# Local development stack for MeuRPG.
#
# Usage: `make up` from the repo root (or `docker compose -f deploy/local/compose.yaml up -d`).
#
# Services:
#   cockroach - single-node CockroachDB, insecure mode, for local dev only.
#   migrate   - runs database migrations once, then exits.
#   idp       - devidp, a development-only OpenID Connect provider standing in
#               for Google: sign in at http://localhost:8080/auth/login with
#               one click on a test user. Never deployed (see backend/cmd/devidp).
#   api       - the backend API server, starts only after migrations succeed.
#               Uploaded images go to the "images" volume (BLOB_DIR).
name: meurpg-local

services:
  cockroach:
    # Pinned by tag AND by digest (multi-arch manifest list), so the exact
    # image content is reproducible regardless of what "v26.2.7" points to
    # later. v26.2 is CockroachDB's latest "Regular" (production-recommended,
    # long-support) release line as of 2026-09; v26.2.7 is its newest patch.
    image: cockroachdb/cockroach:v26.2.7@sha256:9464ae30465b887295459b98d129a76d074caeaa4c86836d369c6d2fdddd1685
    command: ["start-single-node", "--insecure"]
    environment:
      # start-single-node reads this on first boot (empty data dir only) and
      # creates the database for us, so the app never has to run `CREATE DATABASE`.
      COCKROACH_DATABASE: meurpg
    ports:
      - "26257:26257" # SQL / Postgres wire protocol
      - "8081:8080" # DB Console (host 8081, container keeps the default 8080)
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      # The image (Red Hat UBI minimal) has no curl or bash, so we can't use
      # an HTTP healthcheck. `cockroach sql` is always on PATH and confirms
      # the SQL layer is actually accepting connections, not just that the
      # process is running.
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ../.. # repo root: the image needs both backend/ and web/
      dockerfile: backend/Dockerfile
      args:
        VERSION: dev
        COMMIT: local
    # Override the image's default entrypoint (/app/api) to run migrations
    # instead, then exit. This container is not meant to keep running.
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/meurpg?sslmode=disable
    depends_on:
      cockroach:
        condition: service_healthy

  # The issuer is http://idp.localhost:9090 for both sides of the sign-in:
  # - the browser resolves any *.localhost name to 127.0.0.1 by itself
  #   (RFC 6761), and reaches devidp through the published port below;
  #   ports publish on 127.0.0.1 only, so nothing on the LAN can reach it;
  # - the api container resolves idp.localhost through the network alias
  #   below, to this container.
  # One issuer string for both is what OIDC needs: the api checks that the
  # ID token's iss is exactly OIDC_ISSUER.
  idp:
    build:
      context: ../.. # repo root, like backend/Dockerfile
      dockerfile: deploy/local/devidp.Dockerfile
    environment:
      DEVIDP_ISSUER: http://idp.localhost:9090
      DEVIDP_LISTEN: ":9090"
      DEVIDP_CLIENT_ID: meurpg-local
      # Not a secret: devidp only runs on your machine and in CI.
      DEVIDP_CLIENT_SECRET: meurpg-local-secret
      DEVIDP_REDIRECT_URIS: http://localhost:8080/auth/callback
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      default:
        aliases:
          - idp.localhost
    healthcheck:
      # The image is distroless (no shell, no curl): the binary checks itself.
      test: ["CMD", "/app/devidp", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ../.. # repo root: the image needs both backend/ and web/
      dockerfile: backend/Dockerfile
      args:
        VERSION: dev
        COMMIT: local
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/meurpg?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: info
      # Sign-in through devidp (the idp service above).
      OIDC_ISSUER: http://idp.localhost:9090
      OIDC_CLIENT_ID: meurpg-local
      OIDC_CLIENT_SECRET: meurpg-local-secret
      OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      # devidp honors max_age; Google does not document it, so production
      # leaves it unset (docs/operacao.md).
      OIDC_MAX_AGE: 1h
      # Uploaded images (the gallery, MR-019) go to the volume below.
      BLOB_DIR: /var/lib/meurpg/images
    volumes:
      # A named volume, so images survive `make down` and `make up`. The
      # image creates this folder owned by nonroot, the user the API runs
      # as, and a new volume takes that owner (backend/Dockerfile).
      - images:/var/lib/meurpg/images
    ports:
      - "8080:8080"
    depends_on:
      cockroach:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      idp:
        condition: service_healthy
    # No healthcheck here: the backend image is distroless (no shell/curl),
    # so there is nothing to run a CMD-based check with.

volumes:
  cockroach-data:
  images:
