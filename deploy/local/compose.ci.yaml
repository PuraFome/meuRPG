# CI only: the e2e job's CockroachDB keeps its store in memory. The data is
# thrown away with the runner, and the tests' writes and the migrations at
# start-up run faster than on the runner's disk. Used by
# .github/workflows/e2e.yml on top of compose.yaml; never by `make up`.
services:
  cockroach:
    # The same digest as compose.yaml, from Cockroach Labs' registry on Google
    # Cloud: GitHub's shared runners hit Docker Hub's anonymous pull limit.
    image: us-docker.pkg.dev/cockroach-cloud-images/cockroachdb/cockroach:v26.3.2@sha256:bc15746ef2c2493b2cfd46a76898a745587d068b1a259fff3c4447c3f3b36ea2
    command: ["start-single-node", "--insecure", "--store=type=mem,size=2GiB", "--cache=256MiB", "--max-sql-memory=1GiB"]
    volumes: !reset []
