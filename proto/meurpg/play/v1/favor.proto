syntax = "proto3";

// The Inspiration the master grants a player character (PHB 2014 ch. 4, outside
// SRD 5.1). It is called favor here because "inspiration" already means Bardic
// Inspiration in the code; the app says "Inspiração".
package meurpg.play.v1;

import "meurpg/play/v1/combat_rolls.proto";

// FavorBlockedReason is why a favor call was refused with `failed_precondition`.
enum FavorBlockedReason {
  FAVOR_BLOCKED_REASON_UNSPECIFIED = 0;
  // The character already has the Inspiration: it never stacks.
  FAVOR_BLOCKED_REASON_ALREADY_HAS = 1;
  // Creatures and NPCs never hold it.
  FAVOR_BLOCKED_REASON_NOT_A_PLAYER_CHARACTER = 2;
  // The caller's character does not hold it.
  FAVOR_BLOCKED_REASON_NOT_THE_HOLDER = 3;
  // The caller's character has none to spend.
  FAVOR_BLOCKED_REASON_HAS_NONE = 4;
  // What a pass tells its giver when the receiver cannot take it (it has one, it is in
  // another campaign or it is an NPC). The server never sends the receiver's state.
  FAVOR_BLOCKED_REASON_CANNOT_RECEIVE = 5;
  // The pass names the giver as the receiver.
  FAVOR_BLOCKED_REASON_SELF = 6;
  // The roll would not change: it already has advantage, or advantage and disadvantage cancel.
  FAVOR_BLOCKED_REASON_ADDS_NOTHING = 7;
  // The d20 was already rolled.
  FAVOR_BLOCKED_REASON_AFTER_THE_ROLL = 8;
  // The spend was asked on a call that rolls no d20: nothing is spent.
  FAVOR_BLOCKED_REASON_NOTHING_TO_ROLL = 9;
  // The giver already asked to pass it and the master has not answered: the Inspiration cannot be spent or asked again until the
  // ask is answered or canceled.
  FAVOR_BLOCKED_REASON_PASS_PENDING = 10;
  // The ask was already answered or canceled (on another screen, or by the master meanwhile).
  FAVOR_BLOCKED_REASON_PASS_CLOSED = 11;
  // The campaign has no open session: the master answers a pass at the table, so it is only asked in a session.
  FAVOR_BLOCKED_REASON_NO_SESSION = 12;
}

// FavorBlocked is the error detail of FavorService's `failed_precondition`.
message FavorBlocked {
  FavorBlockedReason reason = 1;
}

// FavorHolder is a character that has the Inspiration.
message FavorHolder {
  string character_id = 1;
  string character_name = 2;
}

message GrantFavorRequest {
  string campaign_id = 1;
  string character_id = 2;
  string idempotency_key = 3;
}

message GrantFavorResponse {}

message GetFavorRequest {
  string campaign_id = 1;
}

message GetFavorResponse {
  // The master reads every holder of the campaign; a player reads only their own.
  repeated FavorHolder holders = 1;
  // The passes that wait for the master: the master reads all of them; a player reads only the asks of their own characters.
  repeated FavorPass passes = 2;
  // The master's questions about an Inspiration a roll spent for nothing. The master's alone.
  repeated FavorRefundPrompt refund_prompts = 3;
}

// FavorPassStatus is where a pass is.
enum FavorPassStatus {
  FAVOR_PASS_STATUS_UNSPECIFIED = 0;
  // Waits for the master.
  FAVOR_PASS_STATUS_PENDING = 1;
  // The master accepted: the Inspiration moved.
  FAVOR_PASS_STATUS_ACCEPTED = 2;
  // The master refused: it stays with the giver.
  FAVOR_PASS_STATUS_REFUSED = 3;
  // The giver gave the ask up, or the session ended.
  FAVOR_PASS_STATUS_CANCELED = 4;
}

// FavorPass is a player's ask to pass the Inspiration of their character to another player character.
message FavorPass {
  string id = 1;
  string from_character_id = 2;
  string from_name = 3;
  string to_character_id = 4;
  string to_name = 5;
  FavorPassStatus status = 6;
  // The master's alone: the receiver already has one, so the master's Aceitar is dashed with the reason. False for a player.
  bool receiver_has = 7;
}

// FavorRefundStatus is where a refund prompt is.
enum FavorRefundStatus {
  FAVOR_REFUND_STATUS_UNSPECIFIED = 0;
  // Waits for the master.
  FAVOR_REFUND_STATUS_OPEN = 1;
  // The master gave the Inspiration back.
  FAVOR_REFUND_STATUS_RETURNED = 2;
  // It stays spent: the master chose so, or the session ended without an answer.
  FAVOR_REFUND_STATUS_KEPT = 3;
}

// FavorRefundPrompt is the question the master gets when a roll spent the Inspiration and it added nothing over every source
// of advantage. The master's alone: the player reads only the answer, when the master gives it back.
message FavorRefundPrompt {
  string id = 1;
  string character_id = 2;
  string character_name = 3;
  // The roll's name as the log reads it.
  string roll_label_pt = 4;
  // The sources of advantage the roller could not read, the master's view.
  repeated AdvantageSource hidden_sources = 5;
  FavorRefundStatus status = 6;
}

message PassFavorRequest {
  string campaign_id = 1;
  string from_character_id = 2;
  string to_character_id = 3;
  string idempotency_key = 4;
}

message PassFavorResponse {
  // The pending pass the ask made (the same one on a retry with the same key).
  FavorPass pass = 1;
}

message AnswerFavorPassRequest {
  string campaign_id = 1;
  string pass_id = 2;
  // True accepts: the Inspiration moves. False refuses: it stays with the giver.
  bool accept = 3;
  string idempotency_key = 4;
}

message AnswerFavorPassResponse {
  // The pass as it is after the answer.
  FavorPass pass = 1;
}

message CancelFavorPassRequest {
  string campaign_id = 1;
  string pass_id = 2;
  string idempotency_key = 3;
}

message CancelFavorPassResponse {
  FavorPass pass = 1;
}

message AnswerFavorRefundRequest {
  string campaign_id = 1;
  string prompt_id = 2;
  // True gives the Inspiration back; false keeps it spent.
  bool give_back = 3;
  string idempotency_key = 4;
}

message AnswerFavorRefundResponse {
  FavorRefundPrompt prompt = 1;
}

// FavorService is the Inspiration of the player characters: the master grants it, the
// holder asks to pass it on and the master accepts or refuses. A character has it or not and it
// never stacks.
//
// Errors:
//   - `not_found`: the campaign does not exist, or the caller is not a member of it.
//   - `permission_denied`: a player calls what is the master's.
//   - `failed_precondition`: FavorBlocked. An id that is not a player character of the campaign is NOT_A_PLAYER_CHARACTER.
//   - `invalid_argument`: an id or the key is malformed.
service FavorService {
  // GrantFavor gives the Inspiration to a player character. Only the master.
  rpc GrantFavor(GrantFavorRequest) returns (GrantFavorResponse);

  // GetFavor lists who has the Inspiration: every holder for the master, only the
  // caller's own characters for a player.
  rpc GetFavor(GetFavorRequest) returns (GetFavorResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PassFavor asks to pass the holder's Inspiration to another player character: it stores a
  // pending pass and nothing moves until the master answers. Only in an open session. A retry
  // with the same key answers the same pass.
  rpc PassFavor(PassFavorRequest) returns (PassFavorResponse);

  // AnswerFavorPass is the master's answer to a pending pass: accept moves the Inspiration
  // (refused CANNOT_RECEIVE, to the master alone, when the receiver already has one),
  // refuse keeps it with the giver. Only the master.
  rpc AnswerFavorPass(AnswerFavorPassRequest) returns (AnswerFavorPassResponse);

  // CancelFavorPass gives a pending ask up. Only the giver's owner.
  rpc CancelFavorPass(CancelFavorPassRequest) returns (CancelFavorPassResponse);

  // AnswerFavorRefund is the master's answer to a refund prompt: give back the Inspiration a
  // roll spent for nothing, or keep it spent. Only the master.
  rpc AnswerFavorRefund(AnswerFavorRefundRequest) returns (AnswerFavorRefundResponse);
}
