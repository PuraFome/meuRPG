syntax = "proto3";

// Ready (SRD 5.1, "Ready"; "Preparar"): on its turn a combatant spends its action to act later, as a reaction, when a
// trigger it names happens. The player writes the trigger in their own words and picks what to hold: one attack, a move
// up to its speed, or another standard action. The master judges when the trigger happens. The readied action waits
// until the master fires it, its owner gives it up, or the readier's next turn starts (it is lost; nothing comes back).
//
// The trigger and the held action are the master's and the readier's player's (RN-10). Every other player reads only
// that the combatant readied an action, and nothing at all of a hidden combatant.
package meurpg.play.v1;

import "meurpg/play/v1/combat.proto";

// ReadyService readies an action, fires it and gives it up.
//
// Every method needs a valid session cookie and fails with `unauthenticated` without one, and every request names the
// campaign (as CombatService). Each change carries an idempotency_key scoped to the caller: the same key with the same
// request returns the first answer, and with another request is `invalid_argument`.
service ReadyService {
  // ReadyAction spends the combatant's action and holds the action the request names until its trigger. The
  // combatant must be on turn with its action free. Its player may ready for their own character, and the master for
  // any combatant. The answer carries the encounter as the caller sees it; Combatant.readied holds the row.
  //
  // The checks, in order: the combatant, its turn, its action, a move without a map or with no speed, the trigger, the
  // action.
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this campaign's open session, or the caller is a player and
  //     may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not their character.
  //   - `invalid_argument`: no key or a key used for another request, a malformed id.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN, ACTION_USED, COMBATANT_DOWN and the
  //     other refusals of a turn; READY_TRIGGER (an empty trigger, or one longer than 200 characters); READY_ACTION (an
  //     attack the combatant does not have, a standard action that cannot be held (Attack, Cast a Spell, Ready, Hide,
  //     Help, Dash, Disengage), a move in a combat without a map or with no speed, a spell, or an action readied
  //     already). Nothing is spent.
  rpc ReadyAction(ReadyActionRequest) returns (ReadyActionResponse);

  // FireReadied is the master saying the trigger happened: it opens a reaction window of kind READIED for the readier
  // (the readier's player answers it, the master for an NPC). AnswerReaction USE spends the reaction and runs the held
  // action; PASS lets it go and keeps the reaction. Nothing is spent here. Only the master.
  //
  // The checks, in order: the readied action waits; the readier is not out of the fight, down, incapacitated or
  // surprised; its reaction is free; no READIED window of it is open. A refusal leaves the readied action waiting.
  // UndoLastAction takes the fire back while its window was not answered: the window goes and the row keeps waiting.
  //
  // Errors:
  //   - `permission_denied`: the caller is not the master.
  //   - `not_found`: the combat, or a readied action that waits, is not in this campaign's open session (a defeated or
  //     dismissed readier's was lost).
  //   - `invalid_argument`: no key or a key used for another request, a malformed id.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE; COMBATANT_DOWN (the readier is defeated or at 0 hit
  //     points); CANNOT_ACT (incapacitated, or an effect takes its reactions); REACTION_USED (the reaction was spent
  //     since); REACTION_PENDING (its READIED window is open already). Surprise is refused as a contest's SURPRISED.
  rpc FireReadied(FireReadiedRequest) returns (FireReadiedResponse);

  // CancelReadied gives up a readied action that waits: its row ends, and the action spent to ready it does not come
  // back. Only on the readier's own turn, by its player or the master.
  //
  // Errors:
  //   - `not_found`: the combat, or a readied action that waits, is not in this campaign's open session, or the
  //     caller is a player and it is not their combatant's.
  //   - `invalid_argument`: no key or a key used for another request, a malformed id.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN and the other refusals of a turn.
  rpc CancelReadied(CancelReadiedRequest) returns (CancelReadiedResponse);
}

message ReadyActionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // The trigger, in the player's own words: 1 to 200 characters once trimmed.
  string trigger_text = 5;
  ReadiedKind kind = 6;
  // ATTACK: the key of one of the combatant's attacks (rules.v1.TurnOptions.attacks). OTHER: the key of a standard
  // action (rules.v1.TurnOptions.standard_actions) other than Attack, Cast a Spell and Ready. Empty for a move.
  string action_key = 7;
  // The creature the player names in the trigger, if any: a combatant the caller sees.
  string target_combatant_id = 8;
  // SPELL: the spell and the slot to cast it with (not offered yet: a spell is refused with READY_ACTION).
  string spell_key = 9;
  int32 slot_level = 10;
}

message ReadyActionResponse {
  Encounter encounter = 1;
}

message FireReadiedRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // ReadiedAction.id.
  string readied_id = 3;
  string idempotency_key = 4;
}

message FireReadiedResponse {
  Encounter encounter = 1;
}

message CancelReadiedRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // ReadiedAction.id.
  string readied_id = 3;
  string idempotency_key = 4;
}

message CancelReadiedResponse {
  Encounter encounter = 1;
}
