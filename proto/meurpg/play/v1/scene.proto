syntax = "proto3";

// The RP scene during a game session (MR-015): the scene the master
// opens, what each member sees of it, and the checks the players roll. The
// RPCs are PlayService's (play.proto); the messages are here. The scene's
// actions are kept on the map point (meurpg.maps.v1.MapService,
// AddSceneAction and the others).
package meurpg.play.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/maps/v1/maps.proto";
import "meurpg/play/v1/combat.proto";
import "meurpg/play/v1/combat_rolls.proto";

// SceneBlockedReason says why PlayService refused a scene call with
// `failed_precondition`.
enum SceneBlockedReason {
  SCENE_BLOCKED_REASON_UNSPECIFIED = 0;
  // Unused: it was OpenScene's refusal of a point with no actions
  // at first. Since then (question 63) any SCENE point opens, even with no
  // actions, so the server never sends it. The value stays so the numbers
  // do not change.
  SCENE_BLOCKED_REASON_NO_ACTIONS = 1;
  // RollSceneCheck: no scene is open in the session, or it is not the one
  // the action belongs to. PutOnStage: no scene is open, so there is no
  // stage.
  SCENE_BLOCKED_REASON_NO_OPEN_SCENE = 2;
  // RollSceneCheck: the character has no attempt left at this action while
  // the scene has been open: it rolled as many times as the action's
  // `max_attempts` allows, plus the attempts the master granted
  // (GrantSceneAttempt). The master may grant one more, raise the limit, or
  // close and open the scene again, which resets every count. An unlimited
  // action stops at 200 rolls per character in one opening, with this same
  // reason. The name stays from the time the limit was one roll ("already
  // rolled"); the reason is the same.
  SCENE_BLOCKED_REASON_ALREADY_ROLLED = 3;
  // RollSceneCheck: the campaign's dice setting does not allow this way of
  // rolling (RN-18): the app's roll when everybody rolls real dice, a typed
  // result when everybody rolls in the app.
  SCENE_BLOCKED_REASON_WRONG_DICE_MODE = 4;
  // RollSceneCheck: the caller has no living character in the campaign to
  // roll for.
  SCENE_BLOCKED_REASON_NO_CHARACTER = 5;
  // PutOnStage: 4 NPCs are on the stage already (the limit, MR-031).
  SCENE_BLOCKED_REASON_STAGE_FULL = 6;
  // SetShownImage, SetShownImageAudience: the audience asked is "the scene's
  // players" (IMAGE_AUDIENCE_KIND_SCENE_PLAYERS), and no scene open to only
  // some players is open, so there are no scene players to show it to.
  SCENE_BLOCKED_REASON_SCENE_NOT_PARTIAL = 7;
}

// SceneBlocked is the error detail of a scene call's `failed_precondition`
// that the app reacts to. (A call with no open session fails with
// GameSessionBlocked, NO_OPEN_SESSION, as every live-session call does.)
message SceneBlocked {
  SceneBlockedReason reason = 1;
}

// OpenSceneInfo is the RP scene open in the session, as the caller sees it.
message OpenSceneInfo {
  // The scene's map point (a UUID). A hidden point can be open: it stays
  // hidden on the map, and a player learns of it only through this scene.
  string point_id = 1;
  // The point's name.
  string name = 2;
  // The point's description, which every member reads in the open scene
  // (up to 2,000 characters, with line breaks).
  string description = 3;
  // The scene's actions, in the order the master put them. A player never
  // gets an action the master hid ("Escondida"): not its name, DC, limit or
  // rolls, as if it did not exist (RN-10). The master gets them all.
  repeated SceneActionView actions = 4;
  // The rolls made since the scene was opened, newest first. The master
  // gets everyone's; a player only their own character's.
  repeated SceneRoll rolls = 5;
  // When the master opened the scene.
  google.protobuf.Timestamp opened_at = 6;
  // The point's "Ganchos e anotações" (MR-029): the master's private
  // Markdown text. Only the master gets it: a player always gets it empty
  // (RN-20).
  string hooks = 7;
  // The point's clues, in the master's order, each with who has it (MR-029).
  // Only the master gets them: a player never gets a clue here, revealed or
  // not (the revealed ones are in their notes, NotesService.ListNotes).
  repeated meurpg.maps.v1.SceneClue clues = 8;
  // The NPCs "em cena", in the order they came in, at most 4 (MR-031). Each
  // entry carries only what a player may see (StageNpc). The master gets
  // every NPC, the hidden ones marked `hidden`; a player gets only the ones
  // the players see, never a hidden one. Empty when nobody is on the stage.
  repeated StageNpc stage = 10;
  // Whether this scene shows its DCs to the players ("Mostrar a CD aos
  // jogadores", MR-015, question 52). Every member gets it. On: a player's
  // actions carry `dc` and their own rolls carry `passed`. Off: they carry
  // neither, and the master alone reads both (RN-20). The master always gets
  // the DCs and every `passed`.
  bool show_dc = 11;
  // The gallery images attached to the scene point, in the master's order
  // ("Imagens da cena", MR-015). Only the master gets them: a player always
  // gets none (RN-10); a player sees an image only when the master shows it
  // (PlayService.SetShownImage).
  repeated meurpg.maps.v1.SceneImage images = 12;
  // Who is in the scene and who is out of it ("Aberta desde 20:20 para
  // Pensantus, Brisa"; "Fora da cena: Sálvia e Jabuti"), with `opened_at`. Only
  // the master gets it: a player always gets it unset. A player who is out
  // of the scene does not get the scene at all (GetOpenScene answers them
  // as it does when none is open), and one who is in does not learn who else is.
  SceneAudienceView audience = 13;
  // The master's switch "Os jogadores podem entrar" (off by default). Only the master gets it.
  bool players_may_join = 14;
  // Set only for a player who is out of a scene open to only some players that lets them join
  // (PlayService.JoinScene): then the scene holds nothing but its `name` and this flag (no point,
  // description, stage, actions, rolls, images or clues, RN-10). False everywhere else.
  bool joinable = 15;
}

// SceneAudience says which players a scene is open to (MR-015, RN-10).
message SceneAudience {
  // True: the whole table, including a player who joins the campaign later
  // (what a scene open with no audience is). `user_ids` must then be empty.
  bool everyone = 1;
  // With `everyone` false: exactly these players, by account (a UUID each; the
  // account of a player of the campaign: the player of a dead character
  // follows the scene like any other), at least one, repeats ignored. The master is always in. A player not listed gets no
  // scene at all, as when none is open, and a player who joins later is out.
  repeated string user_ids = 2;
}

// ScenePlayer is a player of the table with the character the master knows
// them by.
message ScenePlayer {
  // The player's account (a UUID).
  string user_id = 1;
  // The player's living character in the party (a UUID) and its name.
  string character_id = 2;
  string character_name = 3;
  // True for a player who joined the scene by themselves (JoinScene), false for one the master chose.
  bool joined_by_self = 4;
}

// SceneAudienceView is who is in and out of the open scene, for the master.
message SceneAudienceView {
  // True when the scene is open to the whole table: `inside` then lists every
  // player and `outside` is empty. A player who joins later is in.
  bool everyone = 1;
  // The players in the scene, in the party's order.
  repeated ScenePlayer inside = 2;
  // The players of the party who are not in it, in the party's order. A
  // player who has no living character is in neither list, though the master
  // can name them in a SceneAudience.
  repeated ScenePlayer outside = 3;
}

// StageNpc is an NPC on the stage of the open scene, as the caller sees it
// (MR-031, RN-20). A player gets the name and the portrait and nothing else:
// not the NPC's kind, hit points, armor class, sheet or character ID. The
// master gets the character ID too, which the stage's calls take.
message StageNpc {
  // The place on the stage (a UUID, made when the NPC came in). It is not
  // the character's ID: a player may use it to tell the entries apart, and
  // it names nothing.
  string id = 1;
  // The NPC's name.
  string name = 2;
  // The portrait's URL ("/images/<id>"; "/images/<id>/thumb" is its
  // thumbnail), or empty when the NPC has none and the app draws its
  // initials. A player may fetch it only while the NPC is on the stage.
  string portrait_url = 3;
  // Whether the NPC is the one speaking now. At most one entry is. A hidden
  // NPC never speaks.
  bool speaking = 4;
  // The character's ID (a UUID). Only the master gets it; a player's is
  // always empty (RN-20).
  string character_id = 5;
  // Whether the NPC is hidden from the players ("Escondida dos jogadores"):
  // true on the master's copy for an NPC the players do not see, and false
  // for "Os jogadores veem". A player never gets a hidden NPC at all (not in
  // the open scene, not in the stream, not its portrait), so a player's
  // entries always carry false (RN-10).
  bool hidden = 6;
}

// PutOnStageRequest names the NPC.
message PutOnStageRequest {
  string campaign_id = 1;
  // A living NPC of the campaign (a UUID).
  string character_id = 2;
  // Put the NPC on the stage hidden from the players (it still counts for
  // the limit of 4). False puts it where the players see it. Ignored for an
  // NPC that is on the stage already: SetStageNpcHidden changes that.
  bool hidden = 3;
}

// PutOnStageResponse returns the stage as it is now.
message PutOnStageResponse {
  repeated StageNpc stage = 1;
}

// TakeOffStageRequest names the NPC.
message TakeOffStageRequest {
  string campaign_id = 1;
  // The NPC to take off (a UUID).
  string character_id = 2;
}

// TakeOffStageResponse returns the stage as it is now.
message TakeOffStageResponse {
  repeated StageNpc stage = 1;
}

// SetStageNpcHiddenRequest names the NPC on the stage and whether the players
// see it.
message SetStageNpcHiddenRequest {
  string campaign_id = 1;
  // An NPC on the stage (a UUID).
  string character_id = 2;
  // True hides the NPC from the players ("Escondida dos jogadores"); false
  // shows it ("Os jogadores veem").
  bool hidden = 3;
}

// SetStageNpcHiddenResponse returns the stage as it is now, as the master
// sees it.
message SetStageNpcHiddenResponse {
  repeated StageNpc stage = 1;
}

// SetSpeakerRequest names the NPC that speaks.
message SetSpeakerRequest {
  string campaign_id = 1;
  // An NPC on the stage (a UUID), or empty for nobody speaking.
  string character_id = 2;
}

// SetSpeakerResponse returns the stage as it is now.
message SetSpeakerResponse {
  repeated StageNpc stage = 1;
}

// SceneActionView is one action of the open scene, with the caller's numbers.
message SceneActionView {
  // The action's ID (a UUID), which RollSceneCheck takes.
  string id = 1;
  // What is rolled: "skill:investigation", "ability:str" or "save:wis".
  string key = 2;
  // The master's name for it ("Convencer o guarda"); empty for none, and
  // then the app shows check_name.
  string name = 3;
  // The check's name in Portuguese: "Investigação", "Teste de Força".
  string check_name = 4;
  // The difficulty class, 1 to 30; 0 for none. The master always gets it. A
  // player gets it only when the scene's `show_dc` is on, and then 0 still
  // means "no DC": an action without one shows nothing extra. With `show_dc`
  // off a player always gets 0 and never learns whether there is one (RN-20).
  int32 dc = 5;
  // What the caller's own character adds to the d20: from their sheet, for
  // a player. Unset for the master, who has no character, and for a player
  // with no living character.
  optional int32 bonus = 6;
  // The character's passive value, set only for Percepção, Investigação and
  // Intuição, and only for a player's own character.
  optional int32 passive = 7;
  // How many times each player's character may roll this action while the
  // scene stays open: 1 to 5, and 0 means unlimited (no counter on screen;
  // the server stops at 200 rolls per character in one opening). Every member
  // gets it.
  int32 max_attempts = 8;
  // How many attempts the caller's own character has left in this opening of
  // the scene (MR-015, question 55): the limit minus their rolls of this
  // action, plus the attempts the master granted, never below 0. The app
  // writes "Restam 2 de 3 tentativas", "1 tentativa" or, at 0, "Sem mais
  // tentativas". Unset for an unlimited action (`max_attempts` 0), for the
  // master and for a player with no living character: nothing to count. A
  // player never gets another player's count. A grant the master gave on
  // purpose may push it above `max_attempts` ("6 de 5"): when it is above,
  // write "Restam N tentativas" without the "de M".
  optional int32 attempts_left = 9;
  // Whether the master hid this action from the players ("Escondida"). Set
  // only on the master's copy: a player never gets a hidden action, so a
  // player's actions always carry false (RN-10).
  bool hidden = 10;
}

// SceneRoll is one check rolled in the scene.
message SceneRoll {
  // The roll's ID (a UUID, the session event's).
  string id = 1;
  // The action rolled (a UUID). It may no longer be among the scene's
  // actions if the master removed it afterwards.
  string action_id = 2;
  // The character that rolled (a UUID) and its name.
  string character_id = 3;
  string character_name = 4;
  // The d20 and the total: `1d20 (11) + 6 = 17`. For a physical roll, the
  // typed face is in faces.
  DiceRoll roll = 5;
  // Whether the total reached the action's DC, as it was when the roll was
  // made. Set only when the action had a DC. The master always gets it; a
  // player gets it for their own rolls only when the scene showed its DC at the
  // moment of the roll (RN-20; turning `show_dc` on later does not reveal the
  // earlier rolls), and never for anyone else's. These are exactly the rolls
  // the session summary counts.
  optional bool passed = 6;
  // When it was rolled.
  google.protobuf.Timestamp rolled_at = 7;
  // How many attempts this character has left at this action now, as
  // SceneActionView.attempts_left says it for a player; the master reads it
  // here to offer "Dar mais uma tentativa" (GrantSceneAttempt) on the roll
  // card of a character with none left. Only the master gets it: a player's
  // count is in their actions. Unset for an unlimited action.
  optional int32 attempts_left = 8;
  // The mode the d20 rolled with (the character's conditions: Poisoned and Frightened
  // are disadvantage on ability checks, a rage is advantage on Strength) and the
  // circumstances, for the master and the character's own player; `roll.faces` holds
  // both dice and `roll.counted_index` the one that counts. NORMAL when nothing
  // applies.
  RollMode mode = 9;
  repeated AdvantageSource sources = 10;
  // The Bardic Inspiration die the player added after the d20 (already in `roll`'s total).
  repeated BonusDie bonus_dice = 11;
}

// OpenSceneRequest names the campaign and the point.
message OpenSceneRequest {
  string campaign_id = 1;
  // A SCENE point of the campaign's maps, hidden or not (a UUID). It may
  // have no actions. Opening a scene makes it "discovered" (MR-030), so
  // players may tag notes with it, even while the point is hidden on the
  // map: by the whole group when it is open to everyone, else by the players
  // it is open to (and the ones brought in or who join later), alone.
  string point_id = 2;
  // The players the scene is open to. Unset: the whole table, for a scene that
  // was not open yet. For the scene that is open already, unset changes
  // nothing (opening it again does not widen it), and a value is applied as
  // SetSceneAudience does.
  SceneAudience audience = 3;
  // The switch "Os jogadores podem entrar" for a scene newly opened to only some players (ignored for the
  // others); see SetScenePlayersMayJoin.
  bool players_may_join = 4;
}

// OpenSceneResponse returns the scene as the master sees it.
message OpenSceneResponse {
  OpenSceneInfo scene = 1;
}

// CloseSceneRequest names the campaign.
message CloseSceneRequest {
  string campaign_id = 1;
}

// CloseSceneResponse is empty: no scene is open.
message CloseSceneResponse {}

// GetOpenSceneRequest names the campaign.
message GetOpenSceneRequest {
  string campaign_id = 1;
}

// GetOpenSceneResponse returns the open scene.
message GetOpenSceneResponse {
  // The scene open in the session, as the caller sees it. Unset when none is
  // open.
  OpenSceneInfo scene = 1;
}

// RollSceneCheckRequest rolls one action of the open scene.
message RollSceneCheckRequest {
  string campaign_id = 1;
  // The action to roll (a UUID), one of the open scene's.
  string action_id = 2;
  // How the d20 comes (RN-18): the app rolls it, or the player typed the
  // face of a real die. Required: one of them.
  oneof roll {
    // True: the server rolls the d20.
    bool roll_in_app = 3;
    // The face of the real d20, 1 to 20. The server adds the bonus.
    int32 d20_face = 4;
  }
  // A UUID the app makes for each roll. Repeating a roll with the same key
  // returns the first roll's answer and changes nothing.
  string idempotency_key = 5;
  // Physical dice: the faces of the d20 pair (1 or 2 faces, 1 to 20 each, as many as
  // the mode the server resolves needs), instead of `roll`. A wrong number is
  // `invalid_argument`.
  repeated int32 d20_faces = 6;
  // Physical dice: the faces of the dice an effect adds to the roll (Bênção, Orientação), in
  // the order the roll's sources list them, one for each, 1 to the die's faces. With the app's
  // dice the server rolls them; a wrong number is `invalid_argument`.
  repeated int32 extra_die_faces = 7;
  // A table maneuver (a superiority_die effect of applies "check, or save for a save action") the player adds to this roll:
  // its key, one of Maneuver.key of the character's derived sheet. The die is rolled with the
  // roll (in the app, or its face is the last of `extra_die_faces` with physical dice) and one use
  // of its resource is spent when the roll is written. Refused with `invalid_argument` for a
  // maneuver the character has not or that does not go on this roll, and with a resource
  // blocked reason NO_USES_LEFT when no use is left. Empty adds none.
  string maneuver_key = 8;
}

// RollSceneCheckResponse is the roll that was made.
message RollSceneCheckResponse {
  // The caller's roll, with its total. `passed` is set only when the scene
  // shows its DC (`show_dc`) and the action had one.
  SceneRoll roll = 1;
  // Set instead of `roll` when the character holds a Bardic Inspiration die: the d20 was
  // rolled and nothing was written; AnswerOutsideInspiration settles the roll.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  OutsideInspirationOffer inspiration_offer = 2 [deprecated = true];
  // Set instead of `roll` when the character is a halfling and a d20 shows a 1 (Lucky): the
  // d20 was rolled and nothing was written; AnswerOutsideLucky rolls it again or keeps the 1.
  // It comes before the die's question.
  // Deprecated (E4-9): the question is `held_roll_offer` (answered with AnswerHeldRoll). This field is still served, for a
  // tab opened before the one question existed; it will go with the old answer RPCs.
  LuckyOffer lucky_offer = 3 [deprecated = true];

  // The question the roll asks now, in the one shape every held roll has (HeldRollOffer), set beside
  // the deprecated `inspiration_offer` and `lucky_offer`: set instead of the result, when the
  // roll waits for an answer (AnswerHeldRoll). Whoever may answer gets it; nobody else does (RN-10).
  HeldRollOffer held_roll_offer = 4;
}

// GrantSceneAttemptRequest gives one character one more attempt at one action.
message GrantSceneAttemptRequest {
  string campaign_id = 1;
  // The action (a UUID), one of the open scene's.
  string action_id = 2;
  // The player's character that gets the attempt (a UUID): a living player
  // character of the campaign.
  string character_id = 3;
  // A UUID the app makes for each grant. Repeating a grant with the same key
  // adds nothing more and answers like the first.
  string idempotency_key = 4;
}

// GrantSceneAttemptResponse returns the open scene as the master sees it.
message GrantSceneAttemptResponse {
  OpenSceneInfo scene = 1;
}

// SetSceneAudienceRequest names the players the open scene is open to.
message SetSceneAudienceRequest {
  string campaign_id = 1;
  // Required: `everyone`, or exactly these players (see SceneAudience).
  SceneAudience audience = 2;
}

// SetSceneAudienceResponse returns the scene as the master sees it.
message SetSceneAudienceResponse {
  OpenSceneInfo scene = 1;
}

// SetScenePlayersMayJoinRequest sets the switch "Os jogadores podem entrar".
message SetScenePlayersMayJoinRequest {
  string campaign_id = 1;
  bool players_may_join = 2;
}

// SetScenePlayersMayJoinResponse returns the scene as the master sees it.
message SetScenePlayersMayJoinResponse {
  OpenSceneInfo scene = 1;
}

// JoinSceneRequest names the campaign.
message JoinSceneRequest {
  string campaign_id = 1;
}

// JoinSceneResponse returns the scene as the player who joined reads it.
message JoinSceneResponse {
  OpenSceneInfo scene = 1;
}
