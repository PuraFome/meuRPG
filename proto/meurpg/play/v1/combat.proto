syntax = "proto3";

// This file is the combat's API (MR-012, MR-013, MR-014, Etapa 6): the
// encounter, who fights, the initiative, the order of turns, the movement on
// the map's grid, what a turn can do, the attacks and their damage, the
// standard actions, the NPCs' hit points, the undo and the combat log.
// Spells, reactions, death saves and conditions come with the next slice. It
// is in the same package as play.proto because the live events of a combat
// travel on the same stream (WatchGameSession).
package meurpg.play.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/rules/v1/rules.proto";

// CombatService runs a combat (an "encounter") inside the campaign's open
// game session: the master picks who fights and starts it, everybody rolls
// initiative, and the turns go round the table until the master ends it.
//
// A combat has three states: SETUP (the participants and their initiatives
// are being decided), ACTIVE (turns run) and ENDED. A session has at most one
// that is not ended. Ending the session ends its combat too.
//
// Who sees what (RN-10, RN-20) is decided on the server, and a player never
// receives what the master keeps from them, not even its ID:
//   - A hidden combatant (a new NPC starts hidden) is not in the player's
//     order, not on their map, and its turn shows as "Vez do mestre":
//     `current_combatant_id` is empty and `master_turn` is true.
//   - A player never gets an NPC's hit points as numbers, its armor class,
//     or the initiative the app rolled for it: only a state word
//     (CombatantState). The order itself tells who goes first.
//   - A player sees the other players' combatants, but not their hit
//     points (the vitals of their own character come from
//     PlayService.GetLiveSession).
//   - A player never gets the armor class of anyone, the d20 and the
//     damage dice of the master's NPCs, nor the combat log entries that
//     involve a hidden combatant (CombatLogEntry).
//   - The master sees everything.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of (a pending member
// neither, RN-15), methods answer `not_found`, exactly as for a campaign that
// does not exist. A player calling a method only the master may call gets
// `permission_denied`; a player acting on a combatant that is not theirs gets
// `permission_denied` too, except for a combatant they may not see, which is
// `not_found`. An ID that is not a UUID is answered like an ID that does not
// exist.
//
// Every write takes an idempotency_key, a UUID the app generates once for the
// action and sends again on a retry: a second call with the same key changes
// nothing and answers with the combat as it is now. Every write is also a
// session_events row, written in the same transaction (ADR-0007).
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `failed_precondition`: the campaign has no open session
//     (GameSessionBlocked, NO_OPEN_SESSION) or the combat is not in the state
//     the call needs (EncounterBlocked, with the reason).
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction after
//     the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Every request carries a campaign
// ID, so reads are IDEMPOTENT and POST-only: a GET would put the ID in the URL,
// and URLs end up in the platform's request logs (docs/privacidade.md).
service CombatService {
  // StartEncounter creates the campaign's combat, in the SETUP state. Only
  // the campaign's master may call it, and only while the campaign has an
  // open session.
  //
  // The fight is on the session's current map, which must have a grid
  // (MapService.SetMapGrid). When map_point_id names a BATTLE point that
  // leads to a map, that map becomes the session's current map (and is
  // revealed to the players, as PlayService.SetCurrentMap does) and must
  // have the grid instead.
  //
  // Who fights: the player characters listed in participants, and copies of
  // the NPCs listed, each NPC with a count: "Goblin" x 3 makes "Goblin 1",
  // "Goblin 2" and "Goblin 3" (a count of 1 keeps the plain name). Without
  // any player character in participants, the whole party joins: every
  // living player character of the campaign's active members. A new NPC
  // starts hidden unless the request says otherwise (question 31).
  //
  // Each combatant starts on the square of its character's token on the
  // map, if it has one (snapped to a square), and unplaced otherwise: the
  // master places it (MoveCombatant). Every NPC's initiative is rolled at
  // once by the app, one roll for each copy (RN-19). The players roll
  // theirs (SubmitInitiative).
  //
  // Every WatchGameSession stream of the campaign gets `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the campaign or the BATTLE point does not exist, or the
  //     caller is not a member; a participant is not a living character of
  //     the campaign.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: no open session (GameSessionBlocked,
  //     NO_OPEN_SESSION); the session already has a combat that is not
  //     ended (EncounterBlocked, ENCOUNTER_ALREADY_OPEN); there is no
  //     current map (NO_CURRENT_MAP) or the map has no grid (MAP_HAS_NO_GRID,
  //     with its map_id, so the app offers to set one).
  //   - `invalid_argument`: no participants, more than 40 combatants, a
  //     participant listed twice, a count outside 1 to 10 (a player
  //     character: 1), or a name that breaks its rules.
  rpc StartEncounter(StartEncounterRequest) returns (StartEncounterResponse);

  // GetEncounter returns the combat of the campaign's open session as the
  // caller may see it: the latest one, so the app can also show the end of
  // a combat that just ended. It answers with no encounter when the session
  // has none yet. Any member may call it. The app reads it after every
  // `encounter_changed` and after every reconnection.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc GetEncounter(GetEncounterRequest) returns (GetEncounterResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SubmitInitiative sets a combatant's initiative: a d20 plus the
  // combatant's initiative bonus (RN-19). The combatant's player may roll
  // for their own character, and the master for anyone. Only while the combat
  // is in SETUP.
  //
  // The roll is either rolled by the app (roll_in_app), or a face typed from
  // a physical die (d20_face, 1 to 20). With the campaign's dice setting
  // "each player chooses" (RN-18) the player picks on every roll, and their
  // saved preference is only the default the screen offers; a mode the master
  // forced binds them: with "everybody rolls in the app" a typed face is
  // refused, and with "everybody rolls their own dice" the app's roll is
  // (WRONG_DICE_MODE). The master may do either for anyone, and may set a
  // value again; a player sets theirs once, so nobody rolls again until the
  // result is good.
  //
  // Every stream gets `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `failed_precondition`: the combat is not in SETUP (EncounterBlocked,
  //     NOT_IN_SETUP); the player's initiative is already set
  //     (INITIATIVE_ALREADY_SET); the master forced the other way of rolling
  //     (WRONG_DICE_MODE).
  //   - `invalid_argument`: neither roll_in_app nor d20_face is set, or the
  //     face is not 1 to 20.
  rpc SubmitInitiative(SubmitInitiativeRequest) returns (SubmitInitiativeResponse);

  // SetInitiativeOrder decides the order of combatants tied on the same
  // initiative total and the same bonus (RN-19): combatant_ids lists them in
  // the order they will play, and they keep the places they hold together.
  // Combatants with a higher bonus already go first without it. Only the
  // master may call it, and only while the combat is in SETUP or ACTIVE.
  //
  // Errors:
  //   - `not_found`: a combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: fewer than two combatants, a repeated one, or
  //     they are not all tied (different total or bonus, or no initiative).
  //   - `failed_precondition`: the combat is ended (EncounterBlocked,
  //     ENCOUNTER_ENDED).
  rpc SetInitiativeOrder(SetInitiativeOrderRequest) returns (SetInitiativeOrderResponse);

  // BeginCombat starts the turns: the combat becomes ACTIVE, in round 1,
  // with the first combatant of the order on turn. Only the master may call
  // it, and only while the combat is in SETUP. Every combatant must have an
  // initiative: otherwise the call fails with `failed_precondition`
  // (EncounterBlocked, INITIATIVE_MISSING) and names who is missing. Ties
  // need not be ordered: the order stays as it is.
  //
  // Every stream gets `encounter_changed` and `turn_changed`.
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: not in SETUP (NOT_IN_SETUP); an initiative is
  //     missing (INITIATIVE_MISSING, with combatant_ids).
  rpc BeginCombat(BeginCombatRequest) returns (BeginCombatResponse);

  // EndTurn ends the current combatant's turn and passes it to the next one
  // that is not defeated; after the last, the round goes up by one. The
  // current combatant's player may call it, and the master for anyone. At
  // the start of its own turn, the new current combatant's movement,
  // action, bonus action, dash and reaction are reset.
  //
  // expected_combatant_id is the combatant whose turn the caller thinks it
  // is. If another one is on turn (a double tap, a stale screen), the call
  // changes nothing and fails with `aborted`, so one tap never skips two
  // turns.
  //
  // Nobody may be on turn: the combatant on turn left the fight (the master
  // removed the last one who could act, or its character was deleted), and
  // `current_combatant_id` is empty while the combat is ACTIVE. Then only the
  // master may call it, with expected_combatant_id empty, and the turns start
  // again from the top of the order, in the same round.
  //
  // Every stream gets `turn_changed` (each audience its own copy: a player
  // sees a hidden combatant's turn as the master's) and `encounter_changed`.
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's, or the caller is a
  //     player and may not see the combatant.
  //   - `permission_denied`: the caller is a player and the current
  //     combatant is not their character, or nobody is on turn.
  //   - `failed_precondition`: the combat is not ACTIVE, or nobody in it can
  //     take a turn (NOT_ACTIVE); the combatant has a damage that waits to be
  //     rolled or applied (PENDING_DAMAGE, see discard_pending_damage).
  //   - `aborted`: expected_combatant_id is not the one on turn.
  rpc EndTurn(EndTurnRequest) returns (EndTurnResponse);

  // MoveCombatant puts a combatant on a square of the grid (RN-21).
  //
  // The master moves anyone anywhere in the grid, at any time, and no
  // movement is spent: the master has the last word. A player moves only
  // their own character, only during its turn, and only as far as the
  // movement it has left: the speed (doubled after the Dash action) minus
  // what it already walked this turn, at 1.5 m (5 ft) per square, diagonals
  // included (a king's move). A move too far changes nothing and fails with
  // `failed_precondition` (EncounterBlocked, TOO_FAR, with missing_ft); so
  // does a visible combatant's square (SQUARE_OCCUPIED).
  //
  // The master's move reaches every stream as `combatant_moved`; a player's
  // stream only gets it for a combatant they may see.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat, or the caller is a
  //     player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `invalid_argument`: the square is outside the grid.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED), or it
  //     is not ACTIVE and the caller is a player (NOT_ACTIVE); it is not the
  //     combatant's
  //     turn (NOT_YOUR_TURN); the combatant is not on the map yet (NOT_PLACED);
  //     the square is too far (TOO_FAR) or occupied (SQUARE_OCCUPIED).
  rpc MoveCombatant(MoveCombatantRequest) returns (MoveCombatantResponse);

  // SetCombatantHidden hides an NPC combatant from the players, or shows it
  // (RN-10): a hidden combatant is not in their order, not on their map, and
  // its turn shows as the master's. Only the master may call it. Player
  // combatants are never hidden.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the combatant is a player's.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc SetCombatantHidden(SetCombatantHiddenRequest) returns (SetCombatantHiddenResponse);

  // AddCombatants brings reinforcements into the combat: copies of NPCs, as
  // in StartEncounter. Only the master may call it, while the combat is in
  // SETUP or ACTIVE. Each new NPC rolls its initiative at once and takes its
  // place in the order; during an ACTIVE combat the turn does not change.
  // Player characters can be added only in SETUP.
  //
  // Errors:
  //   - `not_found`: a participant is not a living character of the campaign.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: no participants, more than 40 combatants in all,
  //     a player character already in the combat or added during ACTIVE, or
  //     a count outside 1 to 10.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc AddCombatants(AddCombatantsRequest) returns (AddCombatantsResponse);

  // RemoveCombatant takes a combatant out of the combat. Only the master may
  // call it. If it is on turn in an ACTIVE combat, the turn passes to the
  // next combatant first. A player's combatant can be removed only in SETUP.
  //
  // Errors:
  //   - `not_found`: the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED), or
  //     the combatant is a player's and the combat is ACTIVE
  //     (PLAYER_IN_COMBAT).
  rpc RemoveCombatant(RemoveCombatantRequest) returns (RemoveCombatantResponse);

  // EndEncounter ends the combat, from SETUP or ACTIVE. Only the master may
  // call it. The player characters' tokens move to the squares where they
  // ended (MapService tokens), so the map shows them where they stand.
  // Ending the game session ends its combat the same way. Ending a combat
  // that already ended is not an error: it returns it as it is.
  //
  // Every stream gets `encounter_changed`, and `map_changed` for the map.
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's.
  //   - `permission_denied`: the caller is a player.
  rpc EndEncounter(EndEncounterRequest) returns (EndEncounterResponse);

  // GetTurnOptions says what a combatant can do now: "Sua vez" (MR-014). The
  // combatant's player may read their own character's, and the master any
  // combatant's (an NPC's come from its sheet: a full sheet or a basic one
  // with its attacks).
  //
  // It answers also when the combatant is not on turn, or the combat is not
  // running: then every option is disabled with the reason
  // (NOT_YOUR_TURN, COMBAT_NOT_ACTIVE, COMBATANT_DOWN, COMBATANT_DEFEATED),
  // so the app can show "fora da vez". Besides the options the rules engine
  // works out (economy, attacks, spells, actions), it lists, for each attack
  // that rolls to hit, the targets the caller sees with the distance (a
  // king's move, 5 ft a square: RN-21) and whether each is too far, and the
  // damage this combatant still has to roll or that waits for the master.
  // Spells are listed; casting them comes with the next slice.
  //
  // A player never gets a hidden combatant among the targets, nor anyone's
  // armor class.
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this campaign's
  //     open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  rpc GetTurnOptions(GetTurnOptionsRequest) returns (GetTurnOptionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RollAttack is the first step of an attack: the attack roll. The
  // combatant on turn attacks one target with one of its attacks (a weapon
  // or a damaging cantrip; GetTurnOptions lists them). The combatant's
  // player may attack with their own character, and the master with any
  // combatant on turn (an NPC's attack, or on a player's behalf).
  //
  // The roll is rolled by the app (roll_in_app) or a physical d20's face is
  // typed (d20_face, 1 to 20). The campaign's dice setting (RN-18) is checked
  // as in SubmitInitiative: the player chooses on each roll unless the master
  // forced a mode (WRONG_DICE_MODE). An NPC's roll is the master's: either way.
  //
  // The attack spends the action (one attack per action: Extra Attack and
  // the NPCs' multiattack come with the next slice; the master may attack
  // again). The server compares the total with the target's armor class: a
  // natural 20 hits and is a critical hit, a natural 1 misses, any other
  // roll hits when the total reaches the armor class. The answer carries the
  // roll as numbers and the outcome, never the armor class. A hit opens a
  // pending damage (stored, so a retry or a reload finds it) for RollDamage;
  // a miss ends the attack.
  //
  // A player must be in reach: the target at most the attack's range (a
  // melee attack: its reach, 5 ft unless the weapon says more) from them.
  // Disadvantage at long range or next to an enemy is not applied yet. The
  // master is never held to the reach.
  //
  // Every stream gets `encounter_changed`; the master's, and a player's when
  // no hidden combatant is involved, `combat_log_changed`.
  //
  // Errors:
  //   - `not_found`: the combat, the attacker or the target is not in this
  //     campaign's open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the attacker is not
  //     their character.
  //   - `invalid_argument`: neither roll_in_app nor d20_face is set, the face
  //     is not 1 to 20, the attack_key is not one of the attacker's attacks
  //     or asks for a saving throw (the next slice), or the attacker is the
  //     target.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN
  //     (the attacker is not on turn), ACTION_USED (a player), COMBATANT_DOWN,
  //     TARGET_DEFEATED, NOT_PLACED (a player without a square, or a target
  //     without one), TARGET_OUT_OF_REACH (with missing_ft) and WRONG_DICE_MODE.
  rpc RollAttack(RollAttackRequest) returns (RollAttackResponse);

  // RollDamage is the second step of an attack that hit: it rolls the damage
  // of the pending damage with the attack's dice (doubled on a critical hit;
  // the modifier is added once) and its damage type. The attacker's player
  // may roll for their own attack, and the master for any.
  //
  // The roll follows the same rules as RollAttack (the player chooses on each
  // roll unless the master forced a mode, RN-18): roll_in_app, or typed_sum,
  // the sum of the physical dice without the modifier (the app adds it),
  // between the number of dice and the number of dice times their faces
  // (Q38). A damage without dice (a flat number) needs no roll: either field
  // works.
  //
  // When the target is an NPC the damage is applied at once: temporary hit
  // points first, then the hit points; at 0 the NPC is defeated ("Derrotado")
  // and the turns skip it. When the target is a player's character the
  // damage waits for the master (status ROLLED) until ApplyPendingDamage or
  // DiscardPendingDamage (RN-02).
  //
  // Errors:
  //   - `not_found`: the pending damage is not in this combat, or the caller
  //     is a player and may not see the attacker.
  //   - `permission_denied`: the caller is a player and the attacker is not
  //     their character.
  //   - `invalid_argument`: neither roll_in_app nor typed_sum is set, or the
  //     sum is out of range for the dice.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED,
  //     DAMAGE_ALREADY_ROLLED, DAMAGE_RESOLVED and WRONG_DICE_MODE.
  rpc RollDamage(RollDamageRequest) returns (RollDamageResponse);

  // ApplyPendingDamage applies a rolled damage to a player's character: the
  // damage goes through the character's vitals (RN-02): temporary hit points
  // first, then hit points, never below 0. At 0 the character is down
  // ("Caído"; the death saves come with the next slice). Only the master may
  // call it, and only for a damage in ROLLED.
  //
  // Every stream gets `encounter_changed`, and the character's player and the
  // master `vitals_changed`.
  //
  // Errors:
  //   - `not_found`: the pending damage is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED,
  //     DAMAGE_NOT_ROLLED and DAMAGE_RESOLVED.
  rpc ApplyPendingDamage(ApplyPendingDamageRequest) returns (ApplyPendingDamageResponse);

  // DiscardPendingDamage drops a damage without applying it ("Não aplicar"),
  // rolled or not. Only the master may call it.
  //
  // Errors: as ApplyPendingDamage, except that a damage not yet rolled may
  // be discarded (no DAMAGE_NOT_ROLLED).
  rpc DiscardPendingDamage(DiscardPendingDamageRequest) returns (DiscardPendingDamageResponse);

  // TakeAction takes one of the standard actions that only spend the action
  // economy: Dash, Disengage, Dodge, Help, Hide, Ready, Search and Use an
  // Object (the keys of rules.v1.TurnOptions.standard_actions, such as
  // "standard:dash"). Attack and Cast a Spell are not taken here: RollAttack
  // and, with the next slice, casting. Dash doubles the speed for the rest of
  // the turn (RN-21). The rest only spend the action and go to the log: the
  // app reminds the table of their effects.
  //
  // The combatant must be on turn. Its player may act for their own
  // character, and the master for any (the master may act again with the
  // action used).
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this campaign's
  //     open session, or the caller is a player and may not see it.
  //   - `permission_denied`: the caller is a player and the combatant is not
  //     their character.
  //   - `invalid_argument`: the action_key is not one of those listed above.
  //   - `failed_precondition` (EncounterBlocked): NOT_ACTIVE, NOT_YOUR_TURN,
  //     ACTION_USED (a player) and COMBATANT_DOWN.
  rpc TakeAction(TakeActionRequest) returns (TakeActionResponse);

  // AdjustCombatantHitPoints is the master's hand on an NPC's hit points:
  // "Dano/Cura" (MR-012). One of damage (temporary hit points first), heal
  // (up to the maximum) or hit_points (an exact value), and, apart or
  // together, new temporary hit points. A defeated NPC healed above 0 comes
  // back into the turn order; one that reaches 0 is defeated. A player's
  // character keeps AdjustCharacterVitals (RN-02).
  //
  // Errors:
  //   - `not_found`: the combat or the combatant is not in this combat.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: nothing to change, more than one of damage, heal
  //     and hit_points, a value out of range (damage and heal 0 to 9,999,
  //     hit_points 0 to the maximum, temporary 0 to 999), or the combatant
  //     is a player's character.
  //   - `failed_precondition`: the combat is ended (ENCOUNTER_ENDED).
  rpc AdjustCombatantHitPoints(AdjustCombatantHitPointsRequest) returns (AdjustCombatantHitPointsResponse);

  // UndoLastAction takes back the last action, one step ("Desfazer"): an
  // attack roll, a damage roll, an applied or discarded damage, a standard
  // action or an NPC's hit point change. It restores the hit points, the
  // vitals, the economy, the defeated flag and the pending damage exactly as
  // they were, and writes a compensating event: the history keeps both. The
  // undone entry leaves the combat log.
  //
  // Only the master may call it. expected_event_id is the event the master
  // sees as the last action (ListCombatLog.undoable_event_id): if another is
  // the last now, the call changes nothing and fails with `aborted`, so two
  // masters never undo two things. Only the very last change of the session
  // can be undone: any later event (a turn passing, a move, a correction of
  // the vitals) leaves nothing to undo (NOTHING_TO_UNDO).
  //
  // Errors:
  //   - `not_found`: the combat is not this campaign's.
  //   - `permission_denied`: the caller is a player.
  //   - `aborted`: expected_event_id is not the last action.
  //   - `failed_precondition` (EncounterBlocked): ENCOUNTER_ENDED or
  //     NOTHING_TO_UNDO.
  rpc UndoLastAction(UndoLastActionRequest) returns (UndoLastActionResponse);

  // ListCombatLog returns the combat log ("Registro do combate"), latest
  // first, grouped by round. Every entry is structured: the app writes the
  // sentence. A player only gets the entries about what they see: nothing
  // from a hidden combatant (not even that it waits hidden), no hit points
  // of an NPC, no armor class, and the dice only of their own character;
  // when the master reveals a combatant, only new entries appear. The master
  // gets everything, with `hidden` set on the entries the players do not get.
  //
  // Any member may call it. The app reads it after every
  // `combat_log_changed` and after every reconnection.
  //
  // Errors:
  //   - `not_found`: the combat is not in this campaign's open session, or
  //     the caller is not a member.
  rpc ListCombatLog(ListCombatLogRequest) returns (ListCombatLogResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// EncounterStatus is where a combat is.
enum EncounterStatus {
  ENCOUNTER_STATUS_UNSPECIFIED = 0;
  // Choosing who fights and rolling initiative.
  ENCOUNTER_STATUS_SETUP = 1;
  // The turns are running.
  ENCOUNTER_STATUS_ACTIVE = 2;
  // Over.
  ENCOUNTER_STATUS_ENDED = 3;
}

// CombatantKind is whose combatant it is.
enum CombatantKind {
  COMBATANT_KIND_UNSPECIFIED = 0;
  // A player's character.
  COMBATANT_KIND_PLAYER = 1;
  // A copy of an NPC.
  COMBATANT_KIND_NPC = 2;
}

// CombatantState is how hurt a combatant is, as a word (RN-20): what a
// player sees of an NPC, instead of its hit points, and whether a player's
// character is down.
enum CombatantState {
  COMBATANT_STATE_UNSPECIFIED = 0;
  // Full hit points: "Ileso".
  COMBATANT_STATE_UNHURT = 1;
  // Hurt, with more than half of its hit points: "Ferido".
  COMBATANT_STATE_HURT = 2;
  // Half of its hit points or fewer: "Muito ferido".
  COMBATANT_STATE_BADLY_HURT = 3;
  // Out of the fight: "Derrotado".
  COMBATANT_STATE_DEFEATED = 4;
  // A player's character at 0 hit points: "Caído". The word is for
  // everyone who sees the combatant, never its numbers.
  COMBATANT_STATE_DOWN = 5;
}

// EncounterBlockedReason says why CombatService refused a call with
// `failed_precondition` (besides GameSessionBlocked's NO_OPEN_SESSION).
enum EncounterBlockedReason {
  ENCOUNTER_BLOCKED_REASON_UNSPECIFIED = 0;
  // StartEncounter: the session already has a combat that is not ended.
  ENCOUNTER_BLOCKED_REASON_ENCOUNTER_ALREADY_OPEN = 1;
  // StartEncounter: the session has no current map to fight on.
  ENCOUNTER_BLOCKED_REASON_NO_CURRENT_MAP = 2;
  // StartEncounter: the map has no grid. map_id names it.
  ENCOUNTER_BLOCKED_REASON_MAP_HAS_NO_GRID = 3;
  // The call needs a combat in SETUP.
  ENCOUNTER_BLOCKED_REASON_NOT_IN_SETUP = 4;
  // The call needs an ACTIVE combat.
  ENCOUNTER_BLOCKED_REASON_NOT_ACTIVE = 5;
  // The combat is ended and cannot change.
  ENCOUNTER_BLOCKED_REASON_ENCOUNTER_ENDED = 6;
  // BeginCombat: some combatants have no initiative yet. combatant_ids names
  // them.
  ENCOUNTER_BLOCKED_REASON_INITIATIVE_MISSING = 7;
  // SubmitInitiative: the player's initiative is already set.
  ENCOUNTER_BLOCKED_REASON_INITIATIVE_ALREADY_SET = 8;
  // SubmitInitiative, RollAttack, RollDamage: the master forced the other way
  // of rolling (RN-18): the app's roll when everybody rolls their own dice, a
  // typed value when everybody rolls in the app.
  ENCOUNTER_BLOCKED_REASON_WRONG_DICE_MODE = 9;
  // MoveCombatant: it is not the combatant's turn.
  ENCOUNTER_BLOCKED_REASON_NOT_YOUR_TURN = 10;
  // MoveCombatant: the combatant has no square on the grid yet.
  ENCOUNTER_BLOCKED_REASON_NOT_PLACED = 11;
  // MoveCombatant: the square is farther than the movement left. missing_ft
  // says by how much.
  ENCOUNTER_BLOCKED_REASON_TOO_FAR = 12;
  // MoveCombatant: another combatant stands on the square.
  ENCOUNTER_BLOCKED_REASON_SQUARE_OCCUPIED = 13;
  // RemoveCombatant: a player's combatant cannot leave an ACTIVE combat.
  ENCOUNTER_BLOCKED_REASON_PLAYER_IN_COMBAT = 14;
  // RollAttack, TakeAction: the action of this turn is already used.
  ENCOUNTER_BLOCKED_REASON_ACTION_USED = 15;
  // RollAttack: the target is beyond the attack's range. missing_ft says by
  // how much.
  ENCOUNTER_BLOCKED_REASON_TARGET_OUT_OF_REACH = 16;
  // RollAttack: the target is defeated.
  ENCOUNTER_BLOCKED_REASON_TARGET_DEFEATED = 17;
  // EndTurn: a damage still waits to be rolled or applied. Only the master
  // may pass the turn anyway (discard_pending_damage).
  ENCOUNTER_BLOCKED_REASON_PENDING_DAMAGE = 18;
  // RollDamage: the damage was rolled already.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_ALREADY_ROLLED = 19;
  // ApplyPendingDamage: the damage was not rolled yet.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_NOT_ROLLED = 20;
  // RollDamage, ApplyPendingDamage, DiscardPendingDamage: the damage was
  // applied or discarded already.
  ENCOUNTER_BLOCKED_REASON_DAMAGE_RESOLVED = 21;
  // UndoLastAction: the last change of the session is not an action that can
  // be undone, or there is none.
  ENCOUNTER_BLOCKED_REASON_NOTHING_TO_UNDO = 22;
  // RollAttack, TakeAction: a player's character at 0 hit points does not
  // act (the death saves come with the next slice).
  ENCOUNTER_BLOCKED_REASON_COMBATANT_DOWN = 23;
}

// EncounterBlocked is the error detail of CombatService's
// `failed_precondition`, so the app can show a clear message.
message EncounterBlocked {
  EncounterBlockedReason reason = 1;
  // TOO_FAR: how many feet the square is beyond the movement left (5 ft is
  // one square, 1.5 m).
  int32 missing_ft = 2;
  // MAP_HAS_NO_GRID: the map that needs a grid (a UUID).
  string map_id = 3;
  // INITIATIVE_MISSING: the combatants that have no initiative (UUIDs).
  repeated string combatant_ids = 4;
}

// Encounter is a combat as the caller may see it.
message Encounter {
  // Stable encounter ID (a UUID).
  string id = 1;
  // What the master calls it, 1 to 80 characters ("Emboscada na estrada").
  string name = 2;
  EncounterStatus status = 3;
  // The round, counting from 1; 0 in SETUP.
  int32 round = 4;
  // The map the fight is on (a UUID; MapService.GetMap reads it). Empty if
  // the master deleted it meanwhile.
  string map_id = 5;
  // The BATTLE point the master started it from. Only the master gets it.
  string map_point_id = 6;
  // The grid the fight uses, copied from the map when it started: squares of
  // 1.5 m (5 ft) across and down. A combatant's square is col 0 to
  // grid_columns - 1 and row 0 to grid_rows - 1, from the top left.
  int32 grid_columns = 7;
  int32 grid_rows = 8;
  // Whose turn it is (a combatant ID). Empty in SETUP, when ENDED, and for a
  // player when the one on turn is hidden from them: then master_turn is
  // true.
  string current_combatant_id = 9;
  // True when the one on turn is a combatant the caller may not see: the app
  // shows "Vez do mestre". Always false for the master.
  bool master_turn = 10;
  // The combatants the caller sees, in turn order: by initiative, highest
  // first; combatants without an initiative yet come last.
  repeated Combatant combatants = 11;
  // Goes up by one on every change. Of two copies of the same combat, the
  // one with the larger revision is newer.
  int32 revision = 12;
  // When the combat began (BeginCombat). Unset in SETUP.
  google.protobuf.Timestamp started_at = 13;
  // When it ended. Unset until then.
  google.protobuf.Timestamp ended_at = 14;
}

// Combatant is one who fights, as the caller may see it. Fields marked "only
// the master" are left out for a player (zero or unset), and a hidden
// combatant is not sent to a player at all.
message Combatant {
  // Stable combatant ID (a UUID), for this combat only.
  string id = 1;
  // What the table calls it: a character's name, or "Goblin 2".
  string label = 2;
  CombatantKind kind = 3;
  // Whether it is the caller's own character.
  bool mine = 4;
  // The character it stands for (a UUID). For a player's character, everyone
  // gets it; for an NPC, only the master (several copies share it).
  string character_id = 5;
  // Whether the master hides it from the players. Only the master gets it;
  // for a player it is always false (a hidden one is not sent).
  bool hidden = 6;
  // The initiative total (d20 + bonus). Unset until rolled. A player gets it
  // for player combatants only, never an NPC's roll (RN-20).
  optional int32 initiative = 7;
  // The bonus added to the d20, and the d20 itself. Only the master and the
  // combatant's own player get them.
  optional int32 initiative_bonus = 8;
  optional int32 initiative_face = 9;
  // Only the master: it is tied with another combatant on the same total and
  // bonus, and the master has not ordered them yet (SetInitiativeOrder).
  bool tie_unresolved = 10;
  // Whether it has a square on the grid. A combatant without one is not on
  // the map yet; the master places it (MoveCombatant).
  bool placed = 11;
  // Its square, from 0, from the top left. Only meaningful when placed.
  int32 col = 12;
  int32 row = 13;
  // Walking speed in feet (5 ft is one square, 1.5 m); the feet walked this
  // turn; and the feet left (twice the speed after the Dash action, minus
  // the feet walked). Only the master and the combatant's own player.
  int32 speed_ft = 14;
  int32 movement_used_ft = 15;
  int32 movement_left_ft = 16;
  // The turn's economy. Only the master and the combatant's own player.
  bool dashed = 17;
  bool action_used = 18;
  bool bonus_action_used = 19;
  bool reaction_used = 20;
  // How hurt an NPC is, as a word (RN-20). Unspecified for a player's
  // character.
  CombatantState state = 21;
  // An NPC's hit points, as numbers. Only the master gets them; for a player's
  // character, they come from its vitals (the master's copy is filled here
  // too).
  optional int32 hit_points_current = 22;
  optional int32 hit_points_max = 23;
  optional int32 hit_points_temporary = 24;
  // Out of the fight (an NPC at 0 hit points). The turn skips it.
  bool defeated = 25;
  // A player's character's death saves (everyone sees them), 0 to 3 each.
  int32 death_successes = 26;
  int32 death_failures = 27;
  // The conditions the master marked ("caído", "envenenado"; RN-22), and the
  // spell it is concentrating on, if any.
  repeated string conditions = 28;
  string concentration_spell = 29;
  // The armor class from its sheet ("CA 15"). Only the master gets it: a
  // player never learns an armor class (RN-20). Unset for a player, and for
  // a character whose sheet is gone.
  optional int32 armor_class = 30;
}

// Participant is who joins a combat: a character of the campaign.
message Participant {
  // A living character of the campaign (a UUID): a player's or an NPC.
  string character_id = 1;
  // How many copies of an NPC fight, 1 to 10; unset means 1. For a player's
  // character it must be 1 (or unset).
  int32 count = 2;
  // Whether the copies start hidden from the players. Unset: an NPC starts
  // hidden (question 31), a player's character never is.
  optional bool hidden = 3;
}

// StartEncounterRequest creates the combat.
message StartEncounterRequest {
  string campaign_id = 1;
  // A UUID the app generates once for this start and sends again on a retry.
  string idempotency_key = 2;
  // What to call the combat: 1 to 80 characters, one line.
  string name = 3;
  // A BATTLE point of the campaign the master started it from (a UUID), or
  // empty.
  string map_point_id = 4;
  // Who fights. Without a player's character here, the whole party joins.
  repeated Participant participants = 5;
}

// StartEncounterResponse returns the new combat in SETUP.
message StartEncounterResponse {
  Encounter encounter = 1;
}

// GetEncounterRequest names the campaign.
message GetEncounterRequest {
  string campaign_id = 1;
}

// GetEncounterResponse is the open session's latest combat.
message GetEncounterResponse {
  // Unset while the session has had no combat.
  Encounter encounter = 1;
}

// SubmitInitiativeRequest rolls a combatant's initiative.
message SubmitInitiativeRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // How the d20 comes: exactly one.
  oneof roll {
    // True: the app rolls the d20 on the server (RN-18).
    bool roll_in_app = 5;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 6;
  }
}

// SubmitInitiativeResponse returns the combat after the roll.
message SubmitInitiativeResponse {
  Encounter encounter = 1;
}

// SetInitiativeOrderRequest orders a tie.
message SetInitiativeOrderRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  // The combatants tied on the same total and bonus (two or more), in the
  // order they will play.
  repeated string combatant_ids = 4;
}

// SetInitiativeOrderResponse returns the combat after the new order.
message SetInitiativeOrderResponse {
  Encounter encounter = 1;
}

// BeginCombatRequest starts the turns.
message BeginCombatRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
}

// BeginCombatResponse returns the ACTIVE combat.
message BeginCombatResponse {
  Encounter encounter = 1;
}

// EndTurnRequest ends the turn of the current combatant.
message EndTurnRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  // The combatant whose turn the caller thinks it is (a UUID); empty only
  // when nobody is on turn (see EndTurn).
  string expected_combatant_id = 4;
  // True: pass the turn although the combatant has a damage still waiting
  // (to be rolled or applied), discarding it. Only the master's call counts;
  // without it, that is `failed_precondition` (PENDING_DAMAGE).
  bool discard_pending_damage = 5;
}

// EndTurnResponse returns the combat after the turn passed.
message EndTurnResponse {
  Encounter encounter = 1;
}

// MoveCombatantRequest puts a combatant on a square.
message MoveCombatantRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // The square, from 0, from the top left of the grid.
  int32 col = 5;
  int32 row = 6;
}

// MoveCombatantResponse returns the combat after the move.
message MoveCombatantResponse {
  Encounter encounter = 1;
}

// SetCombatantHiddenRequest hides an NPC from the players, or shows it.
message SetCombatantHiddenRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // True hides the combatant; false shows it.
  bool hidden = 5;
}

// SetCombatantHiddenResponse returns the combat after the change.
message SetCombatantHiddenResponse {
  Encounter encounter = 1;
}

// AddCombatantsRequest brings reinforcements.
message AddCombatantsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
  repeated Participant participants = 4;
}

// AddCombatantsResponse returns the combat with the new combatants.
message AddCombatantsResponse {
  Encounter encounter = 1;
}

// RemoveCombatantRequest takes a combatant out.
message RemoveCombatantRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
}

// RemoveCombatantResponse returns the combat without the combatant.
message RemoveCombatantResponse {
  Encounter encounter = 1;
}

// EndEncounterRequest ends the combat.
message EndEncounterRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string idempotency_key = 3;
}

// EndEncounterResponse returns the ended combat.
message EndEncounterResponse {
  Encounter encounter = 1;
}

// DiceRoll is a roll as numbers: the dice, what they showed, the modifier and
// the total. The app writes it as `1d20 (13) + 6 = 19`; a physical roll as
// `16 + 5 = 21` with the note "dado físico".
message DiceRoll {
  // How many dice, and how many faces each: 1d20 is 1 and 20. Zero dice is a
  // flat number.
  int32 dice_count = 1;
  int32 dice_sides = 2;
  // The faces the app rolled, one per die. Empty for a physical damage roll:
  // the player typed the sum. A physical d20 carries the face that was typed.
  repeated int32 faces = 3;
  // The number added to the dice.
  int32 modifier = 4;
  // The dice (or the typed sum) plus the modifier. For damage never below 0.
  int32 total = 5;
  // True when the player rolled real dice and typed the sum (RN-18).
  bool physical = 6;
}

// AttackOutcome is what an attack roll did against the target's armor class.
enum AttackOutcome {
  ATTACK_OUTCOME_UNSPECIFIED = 0;
  // The total reached the armor class: "Acertou".
  ATTACK_OUTCOME_HIT = 1;
  // A natural 20: it hits and the damage dice double: "Crítico".
  ATTACK_OUTCOME_CRITICAL_HIT = 2;
  // A natural 1, or a total below the armor class: "Errou".
  ATTACK_OUTCOME_MISS = 3;
}

// PendingDamageStatus is where the damage of a hit is.
enum PendingDamageStatus {
  PENDING_DAMAGE_STATUS_UNSPECIFIED = 0;
  // The attack hit and the damage is not rolled yet (RollDamage).
  PENDING_DAMAGE_STATUS_AWAITING_ROLL = 1;
  // Rolled, for a player's character: waits for the master
  // (ApplyPendingDamage or DiscardPendingDamage).
  PENDING_DAMAGE_STATUS_ROLLED = 2;
  // Applied to the target: at once for an NPC, by the master for a player's
  // character.
  PENDING_DAMAGE_STATUS_APPLIED = 3;
  // Dropped by the master without applying.
  PENDING_DAMAGE_STATUS_DISCARDED = 4;
}

// PendingDamage is the damage of an attack that hit: stored, so a retry or a
// reload finds it. Only the master and the attacker's player get it.
message PendingDamage {
  // Stable ID (a UUID).
  string id = 1;
  // The attacker and the target (combatant IDs).
  string attacker_id = 2;
  string target_id = 3;
  // The attack, as in rules.v1.Attack.key.
  string attack_key = 4;
  PendingDamageStatus status = 5;
  // True for a critical hit: the dice are doubled.
  bool critical = 6;
  // The damage to roll: the dice (already doubled for a critical hit) and
  // the modifier.
  int32 dice_count = 7;
  int32 dice_sides = 8;
  int32 bonus = 9;
  // The kind of damage: a key such as "damage-type:fire" and its Portuguese
  // name ("fogo").
  string damage_type_key = 10;
  string damage_type_pt = 11;
  // The roll and the damage it made. Set from ROLLED on.
  DiceRoll roll = 12;
  int32 amount = 13;
  // APPLIED to an NPC: it reached 0 and is defeated.
  bool target_defeated = 14;
}

// GetTurnOptionsRequest names a combatant.
message GetTurnOptionsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
}

// GetTurnOptionsResponse is what the combatant can do now.
message GetTurnOptionsResponse {
  // The economy (action, bonus action, reaction and the movement in feet:
  // 5 ft is 1.5 m), the attacks, the spells and the actions, each enabled or
  // disabled with a reason.
  meurpg.rules.v1.TurnOptions options = 1;
  // True when the combatant is the one on turn.
  bool your_turn = 2;
  // For each attack of options.attacks that rolls to hit, who it can target.
  repeated AttackTargets attack_targets = 3;
  // The damage this combatant still has to roll, or that waits for the
  // master to apply. Only the master and the combatant's player get it.
  repeated PendingDamage pending_damages = 4;
}

// AttackTargets lists the targets one attack can choose.
message AttackTargets {
  // The attack, as in rules.v1.Attack.key.
  string attack_key = 1;
  // The combatants the caller sees, except the attacker and the defeated, in
  // turn order.
  repeated TargetInReach targets = 2;
}

// TargetInReach is a possible target of an attack.
message TargetInReach {
  string combatant_id = 1;
  string label = 2;
  // How hurt it is, as a word: never hit points.
  CombatantState state = 3;
  // The distance in feet, a king's move at 5 ft a square (RN-21). Unset when
  // either of them has no square on the grid.
  optional int32 distance_ft = 4;
  // True when the attack cannot reach it: the distance is beyond its range,
  // or unknown for a player (RollAttack refuses it). Never true for the
  // master when the distance is unknown: the master is not held to the reach.
  bool too_far = 5;
}

// RollAttackRequest rolls an attack.
message RollAttackRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The combatant that attacks (a UUID).
  string attacker_id = 3;
  // The attack, one of GetTurnOptions' options.attacks keys.
  string attack_key = 4;
  // The target (a UUID).
  string target_id = 5;
  string idempotency_key = 6;
  // How the d20 comes: exactly one.
  oneof roll {
    // True: the app rolls the d20 on the server (RN-18).
    bool roll_in_app = 7;
    // The face of a physical d20, 1 to 20.
    int32 d20_face = 8;
  }
}

// AttackRoll is the attack roll and what it did.
message AttackRoll {
  string attacker_id = 1;
  string target_id = 2;
  string attack_key = 3;
  // The d20 with the attack bonus as the modifier.
  DiceRoll d20 = 4;
  AttackOutcome outcome = 5;
  // The target's armor class that the total was compared with ("Acertou
  // contra CA 18"). Only the master gets it; never a player (RN-20).
  optional int32 target_armor_class = 6;
}

// RollAttackResponse returns the roll and the combat after it.
message RollAttackResponse {
  // The combat as the caller sees it: the action is spent.
  Encounter encounter = 1;
  AttackRoll roll = 2;
  // Set when the attack hit: the damage to roll. For the master and the
  // attacker's player only.
  PendingDamage pending_damage = 3;
}

// RollDamageRequest rolls the damage of a hit.
message RollDamageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
  // How the damage comes: exactly one.
  oneof roll {
    // True: the app rolls the dice on the server.
    bool roll_in_app = 5;
    // The sum of the physical dice, without the modifier: between the number
    // of dice and the number of dice times their faces.
    int32 typed_sum = 6;
  }
}

// RollDamageResponse returns the damage after the roll.
message RollDamageResponse {
  Encounter encounter = 1;
  // APPLIED for an NPC target; ROLLED, waiting for the master, for a player's
  // character.
  PendingDamage pending_damage = 2;
}

// ApplyPendingDamageRequest applies a rolled damage.
message ApplyPendingDamageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
}

// ApplyPendingDamageResponse returns the damage, APPLIED.
message ApplyPendingDamageResponse {
  Encounter encounter = 1;
  PendingDamage pending_damage = 2;
}

// DiscardPendingDamageRequest drops a damage.
message DiscardPendingDamageRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string pending_damage_id = 3;
  string idempotency_key = 4;
}

// DiscardPendingDamageResponse returns the damage, DISCARDED.
message DiscardPendingDamageResponse {
  Encounter encounter = 1;
  PendingDamage pending_damage = 2;
}

// TakeActionRequest takes a standard action.
message TakeActionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  // The action, as in rules.v1.Action.key: "standard:dash", "standard:dodge"...
  string action_key = 4;
  string idempotency_key = 5;
}

// TakeActionResponse returns the combat after the action.
message TakeActionResponse {
  Encounter encounter = 1;
}

// AdjustCombatantHitPointsRequest is the master's correction of an NPC.
message AdjustCombatantHitPointsRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  string combatant_id = 3;
  string idempotency_key = 4;
  // At most one of these.
  oneof change {
    // Damage taken: 0 to 9,999. Temporary hit points go first.
    int32 damage = 5;
    // Hit points healed: 0 to 9,999, up to the maximum.
    int32 heal = 6;
    // The exact hit points: 0 to the maximum.
    int32 hit_points = 7;
  }
  // The new temporary hit points: 0 to 999. Set after the change above, if
  // there is one.
  optional int32 hit_points_temporary = 8;
}

// AdjustCombatantHitPointsResponse returns the combat after the change.
message AdjustCombatantHitPointsResponse {
  Encounter encounter = 1;
}

// UndoLastActionRequest takes back the last action.
message UndoLastActionRequest {
  string campaign_id = 1;
  string encounter_id = 2;
  // The event the caller sees as the last action (a UUID): the
  // undoable_event_id of ListCombatLog.
  string expected_event_id = 3;
  string idempotency_key = 4;
}

// UndoLastActionResponse returns the combat after the undo.
message UndoLastActionResponse {
  Encounter encounter = 1;
}

// ListCombatLogRequest names the combat.
message ListCombatLogRequest {
  string campaign_id = 1;
  string encounter_id = 2;
}

// ListCombatLogResponse is the combat log.
message ListCombatLogResponse {
  // The rounds, the latest first. Round 0 never appears: the log starts when
  // the combat begins.
  repeated CombatLogRound rounds = 1;
  // The event UndoLastAction would take back now (a UUID), if any. Only the
  // master gets it; the entry it belongs to has `undoable` set.
  string undoable_event_id = 2;
}

// CombatLogRound is the entries of one round, the latest first.
message CombatLogRound {
  int32 round = 1;
  repeated CombatLogEntry entries = 2;
}

// CombatLogKind is what a combat log entry tells.
enum CombatLogKind {
  COMBAT_LOG_KIND_UNSPECIFIED = 0;
  // The combat began (round 1).
  COMBAT_LOG_KIND_COMBAT_BEGUN = 1;
  // An attack: the attacker, the target, the roll, the outcome and, once
  // rolled, the damage (`damage`). One entry for the whole attack: the
  // damage lands in the entry of the attack that caused it.
  COMBAT_LOG_KIND_ATTACK = 2;
  // A standard action: the actor and `key`.
  COMBAT_LOG_KIND_ACTION = 3;
  // A combatant moved on its turn: the actor and `distance_ft`.
  COMBAT_LOG_KIND_MOVED = 4;
  // The master changed an NPC's hit points by hand. Master only.
  COMBAT_LOG_KIND_HIT_POINTS_ADJUSTED = 5;
  // The master hid or revealed a combatant (`now_hidden`). Master only.
  COMBAT_LOG_KIND_REVEAL_CHANGED = 6;
  // The combat ended.
  COMBAT_LOG_KIND_COMBAT_ENDED = 7;
}

// CombatLogEntry is one line of the combat log, as the caller may see it.
// Fields marked "only the master" are left out for a player.
message CombatLogEntry {
  // The event's ID (a UUID). For an attack, the attack roll's event.
  string id = 1;
  CombatLogKind kind = 2;
  google.protobuf.Timestamp at = 3;
  int32 round = 4;
  // Who did it, and to whom. The label is the combatant's, "Goblin 2". Empty
  // when the combatant left the combat meanwhile.
  string actor_id = 5;
  string actor_label = 6;
  string target_id = 7;
  string target_label = 8;
  // The attack or action: its key, and its Portuguese name when the actor's
  // sheet still has it ("Cimitarra", "Disparada").
  string key = 9;
  string key_name_pt = 10;
  // ATTACK: what the roll did.
  AttackOutcome outcome = 11;
  // ATTACK: the d20. Only the master and the actor's player get the dice;
  // everyone else only the outcome (the master's rolls are not the players').
  DiceRoll attack_roll = 12;
  // ATTACK: the damage, once the attack hit and it was rolled.
  CombatLogDamage damage = 13;
  // MOVED: how far, in feet (5 ft is one square, 1.5 m).
  int32 distance_ft = 14;
  // REVEAL_CHANGED: whether the combatant is hidden now.
  bool now_hidden = 15;
  // HIT_POINTS_ADJUSTED: the change, negative for damage. Only the master.
  int32 hit_points_delta = 16;
  // The target's hit points after the change. Only the master, and only for
  // ATTACK entries whose damage is APPLIED and HIT_POINTS_ADJUSTED.
  optional int32 hit_points_after = 17;
  // Only the master: the players do not get this entry ("Só o mestre vê").
  bool hidden = 18;
  // Only the master: this entry holds the last action, the one
  // UndoLastAction would take back.
  bool undoable = 19;
}

// CombatLogDamage is the damage of an attack, in the log.
message CombatLogDamage {
  // AWAITING_ROLL (hit, not rolled yet), ROLLED (waits for the master),
  // APPLIED or DISCARDED.
  PendingDamageStatus status = 1;
  // The dice. Only the master and the actor's player get them.
  DiceRoll roll = 2;
  // The damage (for the target's player, the damage they take). Zero until
  // rolled.
  int32 amount = 3;
  string damage_type_key = 4;
  string damage_type_pt = 5;
  // APPLIED to an NPC that reached 0: defeated.
  bool target_defeated = 6;
  // APPLIED to a player's character that reached 0: down.
  bool target_down = 7;
}
