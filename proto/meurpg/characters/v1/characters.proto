syntax = "proto3";

// Package meurpg.characters.v1 is about a campaign's characters: the
// players' characters and the master's NPCs, their sheets and stories, and
// the master's private notes about them.
//
// Text fields. Lengths count characters (Unicode code points), after the
// server trims spaces at both ends. One-line fields reject control
// characters such as line breaks; multi-line fields accept line breaks and
// tabs and reject other control characters. Every free-text field is
// fiction: the app reminds people not to write real people's data there,
// and the server never logs it (docs/privacidade.md). No field holds the
// player's real name or e-mail.
//
// Stored as JSON. The server stores CharacterSheet and CharacterStory in the
// database as their JSON form, with the proto field names and enum value
// names below (and those of meurpg.rules.v1.AbilityScores). Renaming or
// reusing a field or an enum value would break every stored sheet, so never
// do it: add a new field instead. buf breaking checks this.
package meurpg.characters.v1;

import "google/protobuf/timestamp.proto";
import "meurpg/rules/v1/rules.proto";

// CharacterService creates, reads and edits a campaign's characters.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. Every request names the campaign, and access follows the
// caller's role in it (RN-05, ADR-0011):
//   - The campaign's master sees and edits every character of the campaign,
//     in every state. Only the master creates NPCs, marks a character dead,
//     and reads or writes the master's notes.
//   - A player sees and edits only their own characters. The sheet locks
//     for them when a game session starts (RN-01); after that, they edit
//     the story only while the master allows it (SetStoryEditing).
//   - For a campaign the caller is not a member of, every method answers
//     `not_found`, exactly as for a campaign that does not exist.
//   - A member asking for a character they may not see (another player's
//     character, or any NPC for a player) also gets `not_found`, exactly as
//     for a character that does not exist, so nobody learns which
//     characters exist.
//   - A member asking for something only the master may do gets
//     `permission_denied`.
//   - A pending member (RN-15, MR-024: someone who accepted an invite that
//     requires approval, see meurpg.campaigns.v1.AcceptInvite) is not a
//     member yet, and gets `not_found` from every method except these, which
//     let them work on their one character while they wait: CreateCharacter
//     (one player character, which starts PENDING), GetCharacter,
//     ListCharacters, UpdateCharacter and UpdateCharacterStory (only their
//     own PENDING character), and ContentService.ListContent. Inside those
//     methods they are treated like a player.
//   - An ID that is not a UUID is answered like an ID that does not exist.
//   - The guided level-up (MR-040) is the player's own: GetLevelUpOptions and
//     PreviewLevelUp are for the master and the owning player, while the
//     character can level up; RollLevelUpHitPoints and LevelUpCharacter only
//     for the owning player (the master edits the sheet as always); and
//     ListLevelUps only for the master.
//
// Errors every method can return, besides those listed on each method:
//   - `unauthenticated`: no valid session cookie.
//   - `invalid_argument`: a field breaks its documented rules. The message
//     names the field, never its value.
//   - `unavailable`: the database did not answer; the app may try again.
//   - `aborted`: the database kept reporting a conflicting transaction
//     after the server's retries; the app may try again.
//
// Responses carry `Cache-Control: no-store`, because they describe the
// caller's characters. Reads carry IDs, so they are IDEMPOTENT and
// POST-only: a GET would put the IDs in the URL, and URLs end up in the
// platform's request logs (docs/privacidade.md).
service CharacterService {
  // CreateCharacter creates a character in a campaign.
  //
  // Who may call it depends on the kind:
  //   - CHARACTER_KIND_PLAYER (MR-003): any player of the campaign, for
  //     themselves. The master gets `permission_denied`: a master is not a
  //     player of their own campaign. The character starts as a draft the
  //     player edits until the next game session starts (RN-01), even when
  //     the campaign already had sessions. A pending member (RN-15, MR-024)
  //     may create theirs too: it starts PENDING, waits for the master's
  //     ApproveCharacter or RejectCharacter, and becomes a draft when
  //     approved.
  //   - The NPC kinds, ENEMY, BOSS, MINION and STORY (MR-005): only the
  //     campaign's master, who becomes the NPC's owner (RN-04). Players get
  //     `permission_denied`. NPCs never lock.
  //
  // PLAYER, ENEMY and BOSS take a full sheet; MINION and STORY take a basic
  // sheet.
  //
  // A player has at most one living character per campaign (RN-03): they
  // create a new one only after the current one dies. Creating a second one
  // fails with `failed_precondition`, even when two calls race.
  //
  // Not idempotent: calling it twice creates two NPCs.
  //
  // Errors:
  //   - `invalid_argument`: kind is unspecified, the sheet's type does not
  //     match the kind, or a field breaks its rules (including a content key
  //     that does not exist).
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller's role may not create this kind.
  //   - `failed_precondition`: the player already has a living character in
  //     this campaign. The error carries a CharacterBlocked detail with
  //     reason LIVING_CHARACTER_EXISTS and that character's ID.
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);

  // GetCharacter returns one character with its sheet, its story, and the
  // numbers the server derives from the sheet (MR-004). The campaign's
  // master may read every character of the campaign; a player, only their
  // own, dead ones included; a pending member (MR-024), only their own
  // PENDING character. It never carries the master's notes (RN-11): those
  // come only from GetMasterNotes.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, the caller may
  //     not see it, the campaign does not exist, or the caller is not a
  //     member of it.
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListCharacters lists a campaign's characters, without their sheets.
  //
  // The master gets every character of the campaign: the players'
  // characters first, then the NPCs. Characters waiting for approval
  // (PENDING, MR-024) come in the same list, so the master sees whom to
  // approve. A player gets only their own characters, dead ones included,
  // and never an NPC; a pending member, only their own PENDING character.
  // Each group is in creation order, oldest first. The list is not
  // paginated.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // UpdateCharacter replaces a character's name and sheet (MR-006). It does
  // not touch the story: see UpdateCharacterStory.
  //
  // The campaign's master may edit every character of the campaign, in
  // every state. The player who owns a character may edit it only while it
  // is a draft, or while it waits for the master's approval (PENDING,
  // MR-024): once a game session starts, the sheet is locked for them
  // (RN-01), and a dead character stays as it died.
  //
  // The kind never changes, and the sheet's type must still match it.
  //
  // revision must be the revision the client last read. If the character
  // changed since, the call fails with `aborted` and changes nothing: the
  // app reloads the character and the person tries again. On success, the
  // revision goes up by one.
  //
  // Errors:
  //   - `invalid_argument`: revision is less than 1, the sheet's type does
  //     not match the kind, or a field breaks its rules.
  //   - `not_found`: the character is not in this campaign, the caller may
  //     not see it, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `failed_precondition`: the caller is the player and the sheet is
  //     locked or the character is dead. The error carries a
  //     CharacterBlocked detail with reason SHEET_LOCKED or CHARACTER_DEAD.
  //     This wins over a stale revision: retrying would not help.
  //   - `aborted`: revision is stale.
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);

  // UpdateCharacterStory replaces a character's story: personality,
  // appearance, backstory and allies.
  //
  // The story is descriptive text, not game data, so it has its own lock,
  // which the master controls (decided by Vinicius on 29/09/2026):
  //   - The campaign's master may change it in every state. Only the master
  //     edits an NPC's story.
  //   - The player who owns the character may change it while the character
  //     is a draft or pending, and afterwards (locked or dead) only while the master
  //     allows it with SetStoryEditing. That permission ends when the next
  //     game session starts.
  // Nobody ever edits the numbers the server derives from the sheet.
  //
  // revision works as in UpdateCharacter: the story and the sheet share
  // one revision, and this call also raises it by one.
  //
  // Errors:
  //   - `invalid_argument`: revision is less than 1, or a field breaks its
  //     rules.
  //   - `not_found`: the character is not in this campaign, the caller may
  //     not see it, the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `failed_precondition`: the caller is the player, the character is
  //     no longer a draft, and the master has not allowed story edits. The
  //     error carries a CharacterBlocked detail with reason STORY_LOCKED.
  //     This wins over a stale revision: retrying would not help.
  //   - `aborted`: revision is stale.
  rpc UpdateCharacterStory(UpdateCharacterStoryRequest) returns (UpdateCharacterStoryResponse);

  // SetStoryEditing lets the player who owns a locked or dead character
  // edit its story again, or takes that back (decided by Vinicius on
  // 29/09/2026). Only the campaign's master may call it, and only for a
  // player character: the master always edits an NPC's story.
  //
  // The permission lasts until the master takes it back or the next game
  // session starts (PlayService.StartGameSession turns it off). While the
  // character is a draft, the player edits the story anyway.
  //
  // Setting the value it already has changes nothing and is not an error.
  // It does not change the revision.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC.
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc SetStoryEditing(SetStoryEditingRequest) returns (SetStoryEditingResponse);

  // MarkCharacterDead records that a player character died (RN-03). Only
  // the campaign's master may call it.
  //
  // The character is never deleted: it stays in the lists, the player can
  // still read it, and the player may now create a new character in the
  // campaign. Only the master edits a dead character's sheet; the player
  // edits its story only when the master allows it (SetStoryEditing).
  //
  // It is idempotent: marking a dead character again changes nothing and
  // keeps the first died_at. It does not change the revision.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC. Only player characters
  //     die; an NPC's hit points belong to each combat (RN-04).
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character waits for the master's approval
  //     (PENDING, MR-024): approve or reject it instead. The error carries a
  //     CharacterBlocked detail with reason AWAITING_APPROVAL.
  rpc MarkCharacterDead(MarkCharacterDeadRequest) returns (MarkCharacterDeadResponse);

  // GetMasterNotes returns the master's private notes about a character
  // (RN-11). Only the campaign's master may call it. The notes never reach
  // a player, through this or any other method.
  //
  // Notes belong to the pair of campaign and character: a character used in
  // more than one campaign has separate notes in each.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player, whatever the
  //     character.
  rpc GetMasterNotes(GetMasterNotesRequest) returns (GetMasterNotesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // UpdateMasterNotes replaces the master's private notes about a character
  // (RN-11). Only the campaign's master may call it. Empty notes delete
  // them. The last save wins: notes have no revision.
  //
  // Errors:
  //   - `invalid_argument`: notes break their rules.
  //   - `not_found`: the character is not in this campaign, the campaign
  //     does not exist, or the caller is not a member of it.
  //   - `permission_denied`: the caller is a player, whatever the
  //     character.
  rpc UpdateMasterNotes(UpdateMasterNotesRequest) returns (UpdateMasterNotesResponse);

  // ApproveCharacter lets a character that waits for approval into the
  // campaign (RN-15, MR-024). Only the campaign's master may call it.
  //
  // In one transaction, the character becomes a draft (DRAFT: its player
  // edits it until the next game session starts, RN-01) and its player's
  // pending membership becomes an ordinary player membership, so from then
  // on they see the campaign like any other player. If the player deleted
  // their account while waiting, only the character changes: it stays with
  // the campaign, as in RN-16.
  //
  // It is idempotent: approving a character that is not PENDING (already
  // approved, or created by a player who needed no approval) changes nothing
  // and returns the character as it is.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC. Only player characters
  //     wait for approval.
  //   - `not_found`: the character is not in this campaign (a rejected
  //     character is gone), the campaign does not exist, or the caller is
  //     not a member of it.
  //   - `permission_denied`: the caller is a player.
  rpc ApproveCharacter(ApproveCharacterRequest) returns (ApproveCharacterResponse);

  // RejectCharacter turns down a character that waits for approval (RN-15,
  // MR-024). Only the campaign's master may call it.
  //
  // The character never became part of the campaign, so, in one
  // transaction, it is deleted with its story (and any notes the master
  // wrote about it), and its player's pending membership is deleted too
  // (docs/privacidade.md). The player sees the campaign no more, like anyone
  // who is not in it, and needs a new invite to try again. An active
  // membership is never touched.
  //
  // Errors:
  //   - `invalid_argument`: the character is an NPC.
  //   - `not_found`: the character is not in this campaign (rejecting twice
  //     gets this: the character is gone), the campaign does not exist, or
  //     the caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `failed_precondition`: the character is not PENDING: once approved, a
  //     character stays in the campaign. The error carries a CharacterBlocked
  //     detail with reason NOT_PENDING.
  rpc RejectCharacter(RejectCharacterRequest) returns (RejectCharacterResponse);

  // GetLevelUpOptions says what the next level of one of the character's
  // classes gives, so the app can draw the guided level-up (MR-040, RN-12):
  // the ability increase, the hit die, the new cantrips and spells, the
  // subclass and the new feature options, and the numbers that change by
  // themselves. It names the choices, never makes them: nothing is stored.
  //
  // Who may call it: the master, and the owning player, while
  // Character.can_level_up is true. Anyone else asking about a character they
  // cannot see gets `not_found`.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, or the caller may
  //     not see it.
  //   - `failed_precondition`: the character cannot level up now. The error
  //     carries a CharacterBlocked detail with reason CANNOT_LEVEL_UP (it is
  //     not marked for a milestone and has too little XP, it is at level 20,
  //     or it is an NPC), CHARACTER_DEAD or AWAITING_APPROVAL.
  //   - `invalid_argument`: class_key is not a class of the character.
  rpc GetLevelUpOptions(GetLevelUpOptionsRequest) returns (GetLevelUpOptionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PreviewLevelUp tells what the sheet would be like with these choices,
  // without saving anything: the Summary step of the guided level-up
  // ("Resumo", before and after). The server derives the new numbers (the web
  // has no rules engine), so the app also reads here the prepared-spell maximum
  // that an ability increase changes. The choices may be incomplete: the
  // answer then carries the first refusal (LevelUpRefusal) next to the sheet
  // as far as the choices go, so the app knows which step is missing.
  //
  // Who may call it, and the errors, are those of GetLevelUpOptions. A choice
  // that LevelUpCharacter would answer `invalid_argument` to (an unknown key,
  // a list too long) is `invalid_argument` here too.
  rpc PreviewLevelUp(PreviewLevelUpRequest) returns (PreviewLevelUpResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RollLevelUpHitPoints rolls the hit die of the class's next level, on the
  // server, and keeps the result for this character, class and level:
  // calling it again returns the same roll (it is not a reroll), so the
  // result stays on record (RN-18). LevelUpCharacter takes it back with the
  // method ROLLED_IN_APP. A roll that was never used (the player left the
  // flow) is still there when they come back.
  //
  // Only the owning player may call it: the master keeps the editor.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, or the caller may
  //     not see it.
  //   - `permission_denied`: the caller is the master.
  //   - `failed_precondition`: the character cannot level up now (a
  //     CharacterBlocked detail with CANNOT_LEVEL_UP, CHARACTER_DEAD or
  //     AWAITING_APPROVAL), or the campaign makes everybody roll physical dice
  //     (a CharacterBlocked detail with DICE_FORCED_PHYSICAL).
  //   - `invalid_argument`: idempotency_key is not a UUID, or class_key is not
  //     a class of the character.
  rpc RollLevelUpHitPoints(RollLevelUpHitPointsRequest) returns (RollLevelUpHitPointsResponse);

  // LevelUpCharacter takes the character up a level with the player's choices
  // (MR-040, RN-01's exception, RN-12). It works on a locked sheet: the
  // server builds the new sheet from the stored one and the choices (the
  // client never sends the whole sheet), refuses everything the level does
  // not allow, and saves it all at once, keeping the record of the level-up
  // for the master (ListLevelUps). The rest of the sheet stays locked.
  //
  // What it does not cover, the master does in the sheet editor
  // (UpdateCharacter): the features listed in LevelUpOptions.master_adds
  // (Mystic Arcanum, Spell Mastery, Signature Spells, Additional Magical
  // Secrets, favored enemies and terrains); swapping a spell known for
  // another, which the SRD lets Bards, Rangers, Sorcerers and Warlocks do when
  // they level up (a level-up only adds spells, never removes one); and
  // multiclassing and custom subclasses.
  //
  // Who may call it: only the owning player, and only while
  // Character.can_level_up is true. The master keeps the sheet editor
  // (UpdateCharacter). Afterwards can_level_up goes away by itself: the
  // milestone mark's level has passed, or the XP does not reach the next level.
  // Every session stream of the campaign gets `xp_changed`
  // (WatchGameSessionResponse), so the sheets and the master's list read
  // again.
  //
  // Errors:
  //   - `not_found`: the character is not in this campaign, or the caller may
  //     not see it.
  //   - `permission_denied`: the caller is the master.
  //   - `invalid_argument`: a choice is malformed (an unknown content key, a
  //     list too long, no hit points method, a typed value that is not a
  //     number).
  //   - `aborted`: revision is not the character's current one (the master
  //     changed the sheet, or an XP award came in); read it and try again.
  //   - `failed_precondition`, with one of two details:
  //     - CharacterBlocked: CANNOT_LEVEL_UP, CHARACTER_DEAD,
  //       AWAITING_APPROVAL, or DICE_FORCED_IN_APP (a typed die result in a
  //       campaign where everybody rolls in the app);
  //     - LevelUpRefusal: the choices break a rule of the level (the field
  //       and a reason code), or the in-app roll was never made.
  rpc LevelUpCharacter(LevelUpCharacterRequest) returns (LevelUpCharacterResponse);

  // ListLevelUps lists the level-ups of the campaign, newest first, a page
  // at a time (page_size up to 50, page_token): the master's "O que mudou"
  // (MR-040). Each carries what the player
  // chose and when. With character_id, only that character's. The master is
  // told by the stream (`xp_changed`) and reads here; there is no approval
  // and no veto: the master can still edit the sheet as always.
  //
  // Only the master may call it.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: page_size is not 1 to 50, or page_token is not one
  //     this list gave.
  rpc ListLevelUps(ListLevelUpsRequest) returns (ListLevelUpsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListCharacterCreatures lists a character's creatures that are still with
  // it (MR-037, Etapa 9): its familiar, the animals and undead it summoned that
  // the table has not dismissed, the creatures the master gave. They live
  // from one session to the next until the player or the master dismisses
  // them (the app does not count a spell's duration). Each is a kind of
  // creature from the SRD (monster_key; the stat block is
  // ContentService.GetCreature), a name, where it came from, what it may do on
  // its own and its hit points, which the master corrects (RN-02) and a combat
  // writes back when it ends.
  //
  // The master reads any character's, and the player their own character's;
  // another player's creatures, and with them their hit points, are
  // `not_found` for everyone else, as the character itself is (RN-20).
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller may not see the character (or character_id is not a UUID).
  //   - `invalid_argument`: the character is an NPC (only a player's character
  //     has creatures).
  rpc ListCharacterCreatures(ListCharacterCreaturesRequest) returns (ListCharacterCreaturesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListWildShapeForms lists the beasts a druid's Wild Shape allows now
  // (MR-037, Etapa 9): the SRD beasts of the challenge rating, without the fly
  // or swim speed, that the character's Wild Shape features give at its level
  // (level 2: up to 1/4, no fly or swim; 4: up to 1/2, no fly; 8: up to 1),
  // sorted by Portuguese name. Empty for a character without Wild Shape. The
  // stat blocks are ContentService.GetCreature; AssumeWildShape
  // (meurpg.play.v1.PlayService) takes one of these.
  //
  // The master reads any character's and the player their own; for everyone
  // else the character is `not_found`, as always.
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller may not see the character (or character_id is not a UUID).
  //   - `invalid_argument`: the character is an NPC.
  rpc ListWildShapeForms(ListWildShapeFormsRequest) returns (ListWildShapeFormsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GiveCreature gives a character a creature (MR-037): any SRD creature, for a
  // hireling, a pet or a house rule, whatever the character's class. The
  // creature starts at full hit points, acts as any creature in a combat
  // (`CREATURE_ATTACK_FULL`) and has source `CREATURE_SOURCE_MASTER`. A
  // character has at most 40 creatures at a time. Only the master may call it.
  // A `creature_summoned` event goes to the history while a session is open.
  //
  // The owner's player and the master get `creatures_changed`; a creature
  // given during a combat does not join it: the master adds it with the
  // combat's own tools after the combat, or the next combat takes it.
  //
  // Errors:
  //   - `not_found`: the campaign or the character does not exist, or the
  //     caller is not a member of it.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: the character is an NPC or is dead, monster_key is
  //     not an SRD creature, or name is not 1 to 40 characters on one line.
  //   - `failed_precondition` (CharacterBlocked): CREATURE_LIMIT.
  rpc GiveCreature(GiveCreatureRequest) returns (GiveCreatureResponse);

  // RenameCreature changes a creature's name. The character's player and the
  // master may. The name is free text by a player: 1 to 40 characters on one
  // line.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the creature is not one the caller may see (another
  //     player's, dismissed, or not a UUID).
  //   - `invalid_argument`: name is not 1 to 40 characters on one line.
  rpc RenameCreature(RenameCreatureRequest) returns (RenameCreatureResponse);

  // DismissCreature sends a creature away ("Dispensar"): it leaves the
  // character's list and any combat it is in, and a `creature_dismissed` event
  // goes to the history while a session is open. The character's player and the
  // master may. Dismissing a creature that is gone already changes nothing.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the creature is not one the caller may see (another player's,
  //     or not a UUID).
  rpc DismissCreature(DismissCreatureRequest) returns (DismissCreatureResponse);

  // AdjustCreatureHitPoints is the master's correction of a creature's hit
  // points outside a combat (RN-02): damage, healing, or the number itself.
  // Only the master may call it. A creature taken to 0 is dismissed. In a
  // combat the master uses CombatService.AdjustCombatantHitPoints instead.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist or the caller is not a member
  //     of it, or the creature does not exist.
  //   - `permission_denied`: the caller is a player.
  //   - `invalid_argument`: no change is set, or a value is outside 0 to its
  //     maximum (damage and heal: 0 to 9999).
  //   - `failed_precondition` (CharacterBlocked): CREATURE_IN_COMBAT.
  rpc AdjustCreatureHitPoints(AdjustCreatureHitPointsRequest) returns (AdjustCreatureHitPointsResponse);
}

// CharacterKind is what a character is for. The kind never changes after
// the character is created.
enum CharacterKind {
  CHARACTER_KIND_UNSPECIFIED = 0;
  // A player's character ("personagem do jogador"). Full sheet.
  CHARACTER_KIND_PLAYER = 1;
  // An enemy NPC ("inimigo"). Full sheet.
  CHARACTER_KIND_ENEMY = 2;
  // A boss NPC ("boss"). Full sheet.
  CHARACTER_KIND_BOSS = 3;
  // A minion NPC ("minion"): a weak enemy. Basic sheet.
  CHARACTER_KIND_MINION = 4;
  // A story NPC ("NPC de história"): someone the group meets. Basic sheet.
  CHARACTER_KIND_STORY = 5;
}

// CharacterState is where a character is in its life cycle
// (docs/produto/regras.md, "Ciclo de vida da ficha"). The server computes it
// on every read.
//
// NPCs are always DRAFT: they never lock and never die, so the app shows no
// state for them.
enum CharacterState {
  CHARACTER_STATE_UNSPECIFIED = 0;
  // "Rascunho": no game session has started since the character was
  // created, so its player edits the whole sheet.
  CHARACTER_STATE_DRAFT = 1;
  // "Travada": a game session started after the character was created
  // (RN-01). Only the master edits the sheet; the player edits the story
  // only while the master allows it (SetStoryEditing).
  CHARACTER_STATE_LOCKED = 2;
  // "Morto": the master marked the character dead (RN-03). It stays in the
  // campaign; only the master edits its sheet.
  CHARACTER_STATE_DEAD = 3;
  // "Pendente de aprovação" (RN-15, MR-024): created by a pending member,
  // who joined through an invite that requires approval. The player edits
  // the whole sheet and the story, but the character is not part of the
  // campaign yet: a game session does not lock it, and it cannot die. The
  // master's ApproveCharacter makes it a DRAFT; RejectCharacter deletes it.
  CHARACTER_STATE_PENDING = 4;
}

// Character is a character as its reader may see it. It never carries the
// master's notes (RN-11).
message Character {
  // Stable character ID (a UUID).
  string id = 1;
  // The campaign the character belongs to (a UUID).
  string campaign_id = 2;
  CharacterKind kind = 3;
  CharacterState state = 4;
  // The character's name.
  string name = 5;
  // The account ID (a UUID) of the player who owns the character. Empty for
  // NPCs, and for a player character whose player deleted their account: it
  // stays with the campaign (RN-16).
  string player_user_id = 6;
  // The display name of that player (IdentityService.UpdateProfile). Empty
  // when player_user_id is empty or the player has not chosen one.
  string player_display_name = 7;
  // The game data: full or basic, depending on the kind.
  CharacterSheet sheet = 8;
  // The descriptive text. It has its own lock: see UpdateCharacterStory.
  CharacterStory story = 9;
  // The numbers the server derives from a full sheet (MR-004). Unset for a
  // basic sheet.
  meurpg.rules.v1.DerivedSheet derived = 10;
  // Goes up by one every time the name, the sheet or the story change.
  // Send it back in UpdateCharacter and UpdateCharacterStory. Locking and
  // death do not change it: they have their own times below.
  int32 revision = 11;
  // When the sheet locked for the player (RN-01). Unset while it is a
  // draft, and always unset for NPCs.
  google.protobuf.Timestamp sheet_locked_at = 12;
  // When the master marked the character dead. Unset while it lives.
  google.protobuf.Timestamp died_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // Whether the caller may call UpdateCharacter now: always for the master;
  // for the owning player, only while the state is DRAFT or PENDING.
  bool can_edit = 16;
  // Whether the caller may call UpdateCharacterStory now: always for the
  // master; for the owning player, while the state is DRAFT or PENDING, or
  // while story_editing_allowed is true.
  bool can_edit_story = 17;
  // Whether the caller may call MarkCharacterDead: the master, for a player
  // character that is not dead yet.
  bool can_mark_dead = 18;
  // Whether the caller may call GetMasterNotes and UpdateMasterNotes: the
  // master.
  bool can_access_master_notes = 19;
  // Whether the master currently lets the owning player edit the story of
  // this locked or dead character (SetStoryEditing). Always false for NPCs.
  bool story_editing_allowed = 20;
  // Whether the caller may call SetStoryEditing: the master, for a player
  // character.
  bool can_set_story_editing = 21;
  // Whether the caller may call ApproveCharacter and RejectCharacter now:
  // the master, for a PENDING character (MR-024).
  bool can_approve = 22;
  // Whether the character can go up a level now (RN-12, MR-016): its XP
  // reached the next level's, or the master marked a milestone and its level
  // on the sheet has not gone up since. Only the master and the owning player
  // get it; always false for anyone else, for NPCs, for a dead character and
  // at level 20. The tag goes away when the level goes up. The owning player
  // goes up with the guided level-up (GetLevelUpOptions, LevelUpCharacter),
  // even on a locked sheet; the master raises the level in the sheet editor
  // (UpdateCharacter).
  bool can_level_up = 23;
  // Why can_level_up is true: XP, or a MILESTONE. Unspecified when it is
  // false.
  LevelUpReason level_up_reason = 24;
}

// LevelUpReason is why a character can go up a level.
enum LevelUpReason {
  LEVEL_UP_REASON_UNSPECIFIED = 0;
  // The sheet's XP reached the next level's XP (Character.derived.next_level_xp).
  LEVEL_UP_REASON_XP = 1;
  // The master marked a milestone (ProgressionService.MarkMilestone).
  LEVEL_UP_REASON_MILESTONE = 2;
}

// CharacterSummary is a character as a list shows it: no sheet, no story.
message CharacterSummary {
  // Stable character ID (a UUID).
  string id = 1;
  CharacterKind kind = 2;
  CharacterState state = 3;
  string name = 4;
  // As in Character.
  string player_user_id = 5;
  // As in Character.
  string player_display_name = 6;
  // Classes and levels in Portuguese, such as "Mago 3" or
  // "Guerreiro 2 / Mago 1". Empty for a basic sheet.
  string class_summary = 7;
  // The subrace's Portuguese name if the sheet has one, otherwise the
  // race's, such as "Gnomo das Rochas". Empty for a basic sheet.
  string race_name_pt = 8;
  google.protobuf.Timestamp created_at = 9;
  // An NPC's portrait as a URL ("/images/<id>"; "/images/<id>/thumb" is its
  // thumbnail), as Combatant.portrait_url, or empty for none and for a
  // player's character. Only the master lists NPCs, so only the master gets
  // it (MR-031): the app draws "Pôr em cena" with it, with no read of each
  // sheet.
  string portrait_url = 10;
}

// CharacterBlockedReason says why a character cannot be changed now.
enum CharacterBlockedReason {
  CHARACTER_BLOCKED_REASON_UNSPECIFIED = 0;
  // The sheet is locked for the player: a game session has started
  // (RN-01). Only the master edits it now.
  CHARACTER_BLOCKED_REASON_SHEET_LOCKED = 1;
  // The character is dead (RN-03). Only the master edits its sheet.
  CHARACTER_BLOCKED_REASON_CHARACTER_DEAD = 2;
  // The player already has a living character in this campaign (RN-03).
  // They create a new one only after it dies.
  CHARACTER_BLOCKED_REASON_LIVING_CHARACTER_EXISTS = 3;
  // The character is no longer a draft, and the master has not allowed its
  // player to edit the story (SetStoryEditing).
  CHARACTER_BLOCKED_REASON_STORY_LOCKED = 4;
  // RejectCharacter on a character that does not wait for approval (MR-024):
  // once approved, a character stays in the campaign.
  CHARACTER_BLOCKED_REASON_NOT_PENDING = 5;
  // MarkCharacterDead on a character that still waits for the master's
  // approval (MR-024): approve or reject it instead.
  CHARACTER_BLOCKED_REASON_AWAITING_APPROVAL = 6;
  // A guided level-up call (GetLevelUpOptions, PreviewLevelUp,
  // RollLevelUpHitPoints, LevelUpCharacter) on a character that cannot level
  // up now (can_level_up is false): not marked for a milestone, or too little
  // XP, or at level 20, or an NPC.
  CHARACTER_BLOCKED_REASON_CANNOT_LEVEL_UP = 7;
  // RollLevelUpHitPoints in a campaign where everybody rolls physical dice
  // (RN-18): type the result of the real die instead (LevelUpCharacter with
  // ROLLED_PHYSICAL).
  CHARACTER_BLOCKED_REASON_DICE_FORCED_PHYSICAL = 8;
  // LevelUpCharacter with ROLLED_PHYSICAL in a campaign where everybody rolls
  // in the app (RN-18): use RollLevelUpHitPoints.
  CHARACTER_BLOCKED_REASON_DICE_FORCED_IN_APP = 9;
  // AdjustCreatureHitPoints on a creature that is in a combat that is not
  // ended: the hit points are the combatant's now (AdjustCombatantHitPoints).
  CHARACTER_BLOCKED_REASON_CREATURE_IN_COMBAT = 10;
  // GiveCreature, or a summon, for a character that has 40 creatures already.
  CHARACTER_BLOCKED_REASON_CREATURE_LIMIT = 11;
}

// CharacterBlocked is the error detail of CharacterService's
// `failed_precondition`, so the app can show a clear message.
message CharacterBlocked {
  CharacterBlockedReason reason = 1;
  // The character that blocks the call: the one being edited, or, for
  // LIVING_CHARACTER_EXISTS, the player's living character, so the app can
  // link to it.
  string character_id = 2;
}

// CharacterSheet is a character's game data: a full sheet for PLAYER, ENEMY
// and BOSS, a basic sheet for MINION and STORY.
message CharacterSheet {
  // Exactly one must be set, and it must match the kind.
  oneof content {
    FullSheet full = 1;
    BasicSheet basic = 2;
  }
}

// FullSheet holds a character's choices, in the layout of the official
// sheet (MR-004). It holds choices, never computed numbers: the server
// derives those (rules.v1.DerivedSheet). Rules content is referenced by
// content key (see ContentService.ListContent), never by name.
//
// The server checks only what cannot make sense at all: ranges, existing
// keys, a subrace of another race. Choices the rules would not allow, such
// as too many skills, are saved and reported in DerivedSheet.issues: the
// app is an assistant, not a judge.
message FullSheet {
  // Base ability scores, before any bonus: each 1 to 30, all six required.
  meurpg.rules.v1.AbilityScores base_scores = 1;
  // Content key of the race. Required.
  string race_key = 2;
  // Content key of a subrace of race_key, or empty.
  string subrace_key = 3;
  // The character's classes: 1 to 12 entries, no class twice, levels adding
  // up to 1 to 20. The first one is the starting class, which gives the
  // saving throws. The app offers one class; more is multiclassing.
  repeated ClassLevel classes = 4;
  // The background. Unset while none is chosen, which shows an issue.
  oneof background {
    // Content key of a background.
    string background_key = 5;
    // A background that is not in the rules content, described by the
    // player.
    CustomBackground custom_background = 6;
  }
  // Skills the player chose: the class's skill choices and any others the
  // table allows. At most 18 skill keys, no repeats. The skills the race or
  // background grant are added by the server; listing them here too is
  // harmless.
  repeated string skill_proficiency_keys = 7;
  // Skills with expertise, which doubles the proficiency bonus (Bard,
  // Rogue). At most 18 skill keys, no repeats. A skill here that is not
  // proficient shows an issue.
  repeated string expertise_skill_keys = 8;
  // Bonuses added by hand on top of the race's and subrace's fixed ones,
  // such as the increases a race lets the player choose (the Half-Elf's two
  // +1), an ability score improvement or a magic item: each -10 to +10.
  // Unset means no bonus.
  meurpg.rules.v1.AbilityScores extra_ability_bonuses = 9;
  // How the hit points grow with each level.
  HitPoints hit_points = 10;
  // Content key of the body armor worn, or empty for none.
  string armor_key = 11;
  // Whether the character carries a shield.
  bool shield = 12;
  // Content keys of the weapons carried, which become attacks: at most 20,
  // no repeats.
  repeated string weapon_keys = 13;
  // Content keys of the cantrips (level 0 spells) known: at most 30, no
  // repeats.
  repeated string cantrip_keys = 14;
  // Content keys of the spells known (levels 1 to 9): the spellbook of a
  // Wizard, or the spells of a Bard, Ranger, Sorcerer or Warlock. At most
  // 200, no repeats.
  repeated string known_spell_keys = 15;
  // Content keys of the spells prepared for the day (levels 1 to 9), for a
  // Cleric, Druid, Paladin or Wizard. At most 100, no repeats.
  repeated string prepared_spell_keys = 16;
  // Equipment and treasure as free text: at most 100 items.
  repeated Item equipment = 17;
  Coins coins = 18;
  // Languages the player adds, as free text; the ones from race and
  // background come in DerivedSheet.languages. At most 20, each 1 to 40
  // characters, one line.
  repeated string languages = 19;
  // Tool proficiencies the player adds, as free text. At most 20, each 1 to
  // 40 characters, one line.
  repeated string tool_proficiencies = 20;
  // Experience points: 0 to 1,000,000. The master's XP awards add to it, even
  // after the sheet locked (ProgressionService.AwardXP; RN-01 stops the
  // player, not the master's gift).
  int32 experience_points = 21;
  Alignment alignment = 22;
  // Features and traits the rules content does not have, in the player's
  // own words, such as those of a subclass from another book. 0 to 5,000
  // characters, multi-line. Part of the game data: it locks with the sheet.
  string custom_features_text = 23;
  // Options chosen for features and traits that offer them, as content
  // keys: a fighting style ("feature:fighter-fighting-style-defense"), a
  // dragon ancestry ("trait:draconic-ancestry-red"), an eldritch
  // invocation, a metamagic. An option applies only while the character
  // has the feature or trait it belongs to; otherwise it shows as an issue.
  // At most 100.
  repeated string feature_choice_keys = 24;
  // The challenge rating ("ND") of an enemy or a boss: "0", "1/8", "1/4",
  // "1/2" or "1" to "30" (the SRD's list, in ContentService.ListContent), or
  // empty for none. Only the master's NPCs have one: a player character's
  // sheet with a rating is `invalid_argument`. The server stores it as sent;
  // the editor fills xp_value from it (MR-016).
  string challenge_rating = 25;
  // The XP the NPC gives when it is defeated ("XP ao derrotar"): 0 to
  // 1,000,000. The master's own number, usually the one that goes with the
  // challenge rating. A player character's sheet with a value above 0 is
  // `invalid_argument`. It never reaches a player (RN-20); the end-of-combat
  // XP adds the defeated NPCs' values (ProgressionService.AwardXP).
  int32 xp_value = 26;
  // The NPC's portrait: an image of the campaign's gallery (a UUID, MR-031),
  // shown on its card and, while the master has it on the stage, to the whole
  // table. Empty for none (the app draws the initials). An image of another
  // campaign, or one that does not exist, is `invalid_argument`, and so is a
  // value on a player's character. The server keeps it as sent; deleting the
  // gallery image clears it.
  string portrait_image_id = 27;
}

// ClassLevel is one class of a character and its level in it.
message ClassLevel {
  // Content key of the class. Required.
  string class_key = 1;
  // Levels in this class: 1 to 20.
  int32 level = 2;
  // The subclass. Unset while none is chosen.
  oneof subclass {
    // Content key of a subclass of class_key.
    string subclass_key = 3;
    // The name of a subclass that is not in the rules content: 1 to 40
    // characters, one line. It shows on the sheet but has no effect on the
    // numbers; its features go in FullSheet.custom_features_text.
    string custom_subclass_name = 4;
  }
}

// CustomBackground is a background the player describes, for one that is
// not in the rules content, such as the Sage.
message CustomBackground {
  // The background's name: 1 to 40 characters, one line.
  string name = 1;
  // Content keys of the skills it grants: at most 2, no repeats. Fewer than
  // 2 shows an issue.
  repeated string skill_keys = 2;
}

// HitPointsMethod is how a character's maximum hit points grow after the
// first level. The first level always takes the hit die's maximum.
enum HitPointsMethod {
  // Read as AVERAGE.
  HIT_POINTS_METHOD_UNSPECIFIED = 0;
  // The fixed value for each level: half the die plus one, such as 4 for a
  // d6.
  HIT_POINTS_METHOD_AVERAGE = 1;
  // The rolls in HitPoints.rolls.
  HIT_POINTS_METHOD_ROLLED = 2;
}

// HitPoints is how the maximum hit points were decided.
message HitPoints {
  HitPointsMethod method = 1;
  // Only with ROLLED: the hit die rolled at each level after the first, in
  // the order of FullSheet.classes (every level of the first class, then
  // the next class). At most 19 rolls, each 1 to 12. A level without a roll
  // uses the average, and a roll above its die shows an issue.
  repeated int32 rolls = 2;
}

// Item is one line of equipment, as free text.
message Item {
  // What it is, such as "Grimório" or "Corda de cânhamo (15 m)": 1 to 100
  // characters, one line.
  string name = 1;
  // How many: 1 to 9,999. 0 means 1.
  int32 quantity = 2;
}

// Coins is the character's money, per coin. Each 0 to 1,000,000.
message Coins {
  // Copper pieces ("peças de cobre", PC).
  int32 copper = 1;
  // Silver pieces ("peças de prata", PP).
  int32 silver = 2;
  // Electrum pieces ("peças de electrum", PE).
  int32 electrum = 3;
  // Gold pieces ("peças de ouro", PO).
  int32 gold = 4;
  // Platinum pieces ("peças de platina", PL).
  int32 platinum = 5;
}

// Alignment is the character's moral and ethical outlook.
enum Alignment {
  // Not chosen.
  ALIGNMENT_UNSPECIFIED = 0;
  // "Leal e bom".
  ALIGNMENT_LAWFUL_GOOD = 1;
  // "Neutro e bom".
  ALIGNMENT_NEUTRAL_GOOD = 2;
  // "Caótico e bom".
  ALIGNMENT_CHAOTIC_GOOD = 3;
  // "Leal e neutro".
  ALIGNMENT_LAWFUL_NEUTRAL = 4;
  // "Neutro".
  ALIGNMENT_NEUTRAL = 5;
  // "Caótico e neutro".
  ALIGNMENT_CHAOTIC_NEUTRAL = 6;
  // "Leal e mau".
  ALIGNMENT_LAWFUL_EVIL = 7;
  // "Neutro e mau".
  ALIGNMENT_NEUTRAL_EVIL = 8;
  // "Caótico e mau".
  ALIGNMENT_CHAOTIC_EVIL = 9;
}

// BasicSheet is the short sheet of a minion or a story NPC: only what a
// combat or a scene needs, typed by the master. In combat it rolls
// initiative with initiative_bonus and attacks with its attacks.
message BasicSheet {
  // Maximum hit points: 1 to 9,999.
  int32 hit_points_max = 1;
  // Armor class: 1 to 40.
  int32 armor_class = 2;
  // Walking speed in feet: 0 to 300. The app shows it in metres
  // (5 ft = 1.5 m).
  int32 speed_ft = 3;
  // Legacy, read only for sheets saved before Etapa 6. When the server
  // reads such a sheet and can turn damage into an attack, it moves both
  // fields into attacks and clears them here. A write that has attacks
  // clears them. The attack bonus of the old main attack: -10 to +30.
  int32 attack_bonus = 4;
  // Legacy, read only for sheets saved before Etapa 6 (see attack_bonus).
  // The old free text damage, such as "1d6+2 cortante": 0 to 40 characters,
  // one line. It stays only while it could not become an attack.
  string damage = 5;
  // Who or what it is: 0 to 2,000 characters, multi-line.
  string description = 6;
  // The number added to the d20 when it rolls initiative: -10 to +20.
  int32 initiative_bonus = 7;
  // Its attacks: 0 to 3.
  repeated BasicAttack attacks = 8;
  // The challenge rating ("ND"): "0", "1/8", "1/4", "1/2" or "1" to "30", or
  // empty for none. As FullSheet.challenge_rating.
  string challenge_rating = 9;
  // The XP the NPC gives when it is defeated: 0 to 1,000,000. As
  // FullSheet.xp_value.
  int32 xp_value = 10;
  // The NPC's portrait, as FullSheet.portrait_image_id.
  string portrait_image_id = 11;
  // The NPC's size (MR-034, RN-21): decides whether it may pass a creature it
  // is hostile to and share a square with another. Unset (or UNSPECIFIED) means
  // Medium. Shown nowhere new yet: the combat reads it.
  meurpg.rules.v1.CreatureSize size = 12;
}

// BasicAttack is one attack of a basic sheet, with real dice: the d20 plus
// attack_bonus against the target's armor class, then, on a hit,
// damage_dice_count d damage_dice_sides plus damage_bonus.
message BasicAttack {
  // What the attack is called, such as "Cimitarra": 1 to 40 characters,
  // one line.
  string name = 1;
  // The number added to the d20: -10 to +20.
  int32 attack_bonus = 2;
  // How many damage dice: 1 to 20.
  int32 damage_dice_count = 3;
  // The faces of each damage die: 4, 6, 8, 10 or 12.
  int32 damage_dice_sides = 4;
  // The number added to the damage: -20 to +40.
  int32 damage_bonus = 5;
  // The kind of damage. Required: not DAMAGE_TYPE_UNSPECIFIED.
  DamageType damage_type = 6;
  // The reach or range in feet: 0 to 600. 0 is a melee attack with the
  // normal reach of 5 ft (1.5 m). The app does not edit it yet.
  int32 range_ft = 7;
}

// DamageType is a kind of damage of the SRD 5.1.
enum DamageType {
  DAMAGE_TYPE_UNSPECIFIED = 0;
  DAMAGE_TYPE_ACID = 1;
  DAMAGE_TYPE_BLUDGEONING = 2;
  DAMAGE_TYPE_COLD = 3;
  DAMAGE_TYPE_FIRE = 4;
  DAMAGE_TYPE_FORCE = 5;
  DAMAGE_TYPE_LIGHTNING = 6;
  DAMAGE_TYPE_NECROTIC = 7;
  DAMAGE_TYPE_PIERCING = 8;
  DAMAGE_TYPE_POISON = 9;
  DAMAGE_TYPE_PSYCHIC = 10;
  DAMAGE_TYPE_RADIANT = 11;
  DAMAGE_TYPE_SLASHING = 12;
  DAMAGE_TYPE_THUNDER = 13;
}

// CharacterStory is a character's descriptive text: personality,
// appearance, backstory and allies. It has its own lock, which the master
// controls (see UpdateCharacterStory and SetStoryEditing). Every field is
// optional.
message CharacterStory {
  Personality personality = 1;
  Appearance appearance = 2;
  // The character's backstory ("história"): 0 to 10,000 characters,
  // multi-line.
  string backstory = 3;
  // Allies and organizations ("aliados e organizações"): 0 to 2,000
  // characters, multi-line.
  string allies = 4;
}

// Personality is the four personality boxes of the official sheet. Each is 0
// to 1,000 characters, multi-line.
message Personality {
  // Personality traits ("traços de personalidade").
  string traits = 1;
  // Ideals ("ideais").
  string ideals = 2;
  // Bonds ("vínculos").
  string bonds = 3;
  // Flaws ("defeitos").
  string flaws = 4;
}

// Appearance is how the character looks. The short fields are free text,
// such as "1,05 m": 0 to 40 characters each, one line.
message Appearance {
  // Age ("idade").
  string age = 1;
  // Height ("altura").
  string height = 2;
  // Weight ("peso").
  string weight = 3;
  // Eyes ("olhos").
  string eyes = 4;
  // Skin ("pele").
  string skin = 5;
  // Hair ("cabelo").
  string hair = 6;
  // Anything else about how the character looks: 0 to 2,000 characters,
  // multi-line.
  string description = 7;
}

// CreateCharacterRequest describes the new character.
message CreateCharacterRequest {
  string campaign_id = 1;
  // Required. It decides who may create the character and which sheet it
  // takes.
  CharacterKind kind = 2;
  // 1 to 80 characters, one line.
  string name = 3;
  // Required: full for PLAYER, ENEMY and BOSS; basic for MINION and STORY.
  CharacterSheet sheet = 4;
  // Optional; unset means an empty story.
  CharacterStory story = 5;
}

// CreateCharacterResponse returns the new character.
message CreateCharacterResponse {
  // The new character, with revision 1.
  Character character = 1;
}

// GetCharacterRequest names a character of a campaign.
message GetCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// GetCharacterResponse returns the character.
message GetCharacterResponse {
  Character character = 1;
}

// ListCharactersRequest names a campaign.
message ListCharactersRequest {
  string campaign_id = 1;
}

// ListCharactersResponse lists the characters the caller may see.
message ListCharactersResponse {
  repeated CharacterSummary characters = 1;
}

// UpdateCharacterRequest carries the character's new name and sheet. Both
// replace the saved ones completely.
message UpdateCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The revision the client last read (Character.revision).
  int32 revision = 3;
  // 1 to 80 characters, one line.
  string name = 4;
  // Required, of the type the kind takes.
  CharacterSheet sheet = 5;
}

// UpdateCharacterResponse returns the character as saved.
message UpdateCharacterResponse {
  // The character, with the new revision and derived numbers.
  Character character = 1;
}

// UpdateCharacterStoryRequest carries the character's new story, which
// replaces the saved one completely.
message UpdateCharacterStoryRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The revision the client last read (Character.revision).
  int32 revision = 3;
  // Unset means an empty story.
  CharacterStory story = 4;
}

// UpdateCharacterStoryResponse returns the character as saved.
message UpdateCharacterStoryResponse {
  // The character, with the new revision.
  Character character = 1;
}

// SetStoryEditingRequest says whether the player may edit a character's
// story.
message SetStoryEditingRequest {
  string campaign_id = 1;
  string character_id = 2;
  // true lets the owning player edit the story until the next game session
  // starts; false takes that back.
  bool allowed = 3;
}

// SetStoryEditingResponse returns the character as saved.
message SetStoryEditingResponse {
  // The character, with story_editing_allowed as set.
  Character character = 1;
}

// MarkCharacterDeadRequest names the character that died.
message MarkCharacterDeadRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// MarkCharacterDeadResponse returns the dead character.
message MarkCharacterDeadResponse {
  // The character, with state DEAD and died_at set.
  Character character = 1;
}

// GetMasterNotesRequest names a character of a campaign.
message GetMasterNotesRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// GetMasterNotesResponse returns the master's notes about the character.
message GetMasterNotesResponse {
  // The notes. Empty when the master has written none.
  string notes = 1;
  // When the notes were last saved. Unset when there are none.
  google.protobuf.Timestamp updated_at = 2;
}

// UpdateMasterNotesRequest carries the new notes, which replace the saved
// ones completely.
message UpdateMasterNotesRequest {
  string campaign_id = 1;
  string character_id = 2;
  // 0 to 20,000 characters, multi-line. Empty (or only spaces) deletes the
  // notes.
  string notes = 3;
}

// UpdateMasterNotesResponse returns the notes as saved.
message UpdateMasterNotesResponse {
  // The notes as saved. Empty when they were deleted.
  string notes = 1;
  // When they were saved. Unset when they were deleted.
  google.protobuf.Timestamp updated_at = 2;
}

// ApproveCharacterRequest names the character to approve.
message ApproveCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// ApproveCharacterResponse returns the approved character.
message ApproveCharacterResponse {
  // The character, now DRAFT (or as it was, if it was not PENDING).
  Character character = 1;
}

// RejectCharacterRequest names the character to reject.
message RejectCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
}

// RejectCharacterResponse is empty: the character is gone.
message RejectCharacterResponse {}

// GetLevelUpOptionsRequest names the character to level up.
message GetLevelUpOptionsRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The class that gains the level, one the character already has (a new
  // class is multiclassing, which stays in the sheet editor). Empty means the
  // character's first class.
  string class_key = 3;
}

// GetLevelUpOptionsResponse is what the next level gives.
message GetLevelUpOptionsResponse {
  LevelUpOptions options = 1;
}

// LevelUpNamedKey is a content key with its Portuguese name.
message LevelUpNamedKey {
  string key = 1;
  string name_pt = 2;
}

// LevelUpSpellsKind says where the new spells of a level go.
enum LevelUpSpellsKind {
  LEVEL_UP_SPELLS_KIND_UNSPECIFIED = 0;
  // The Wizard's spellbook: two new spells per level, in
  // FullSheet.known_spell_keys. The spells to prepare come from it.
  LEVEL_UP_SPELLS_KIND_SPELLBOOK = 1;
  // Bard, Ranger, Sorcerer and Warlock: the new spells the class table gives,
  // in FullSheet.known_spell_keys.
  LEVEL_UP_SPELLS_KIND_KNOWN = 2;
}

// LevelUpDiceRule is what the campaign's dice setting makes the player do
// with the hit die (RN-18).
enum LevelUpDiceRule {
  LEVEL_UP_DICE_RULE_UNSPECIFIED = 0;
  // Each player chooses, on every roll: roll in the app, or type the result of
  // a physical die. The player's saved preference is only the default the
  // screen highlights.
  LEVEL_UP_DICE_RULE_PLAYER_CHOOSES = 1;
  // Everybody rolls in the app: ROLLED_PHYSICAL is refused.
  LEVEL_UP_DICE_RULE_FORCED_IN_APP = 2;
  // Everybody rolls physical dice: RollLevelUpHitPoints is refused.
  LEVEL_UP_DICE_RULE_FORCED_PHYSICAL = 3;
}

// LevelUpOptions is what the next level of one class gives, in data the
// guided level-up draws. A step with nothing to choose does not exist: the
// app skips a step whose counts are zero and whose lists are empty.
//
// Steps and their data: "Atributos" (ability_score_improvement), "Vida"
// (hit_die, hit_point_average, dice_rule, kept_hit_point_roll), "Magias"
// (cantrips, spells, prepares), and the steps for the subclass
// (subclass_due), the feature options (feature_choices), the skills and
// expertise. "Resumo" is PreviewLevelUp. The numbers of the sheet that change
// by themselves (slots, proficiency bonus, features) are only shown.
message LevelUpOptions {
  // The class that gains the level, and its Portuguese name.
  string class_key = 1;
  string class_name_pt = 2;
  // The class's level before and after, and the character's total level
  // before and after.
  int32 from_level = 3;
  int32 to_level = 4;
  int32 total_from_level = 5;
  int32 total_to_level = 6;

  // The class's hit die (8 for a d8) and the fixed gain: half the die plus
  // one, before the Constitution modifier (the sheet adds the modifier, and
  // never less than 1 in all). The hit points of the new level are one of:
  // the average, a roll of the die in the app (RollLevelUpHitPoints), or the
  // result of a physical die typed in (1 to hit_die).
  int32 hit_die = 7;
  int32 hit_point_average = 8;
  // What the campaign's dice setting allows. With PLAYER_CHOOSES, the
  // player's own preference (the campaign's dice_preference) tells which
  // option the screen highlights.
  LevelUpDiceRule dice_rule = 9;
  // The roll the server already made and kept for this level, 0 for none: a
  // player who comes back sees the same roll.
  int32 kept_hit_point_roll = 10;

  // True at an Ability Score Improvement level: +2 in one ability or +1 in
  // two, none above 20 (LevelUpChoices.ability_increase). The SRD 5.1 has no
  // feats.
  bool ability_score_improvement = 11;

  // True when the class picks its subclass at this level: one of subclasses
  // (LevelUpChoices.subclass_key).
  bool subclass_due = 12;
  repeated LevelUpSubclass subclasses = 13;

  // How many new cantrips to add (LevelUpChoices.cantrip_keys), from the list
  // of spell_list_class_key.
  int32 cantrips = 14;
  // How many new spells to add (LevelUpChoices.known_spell_keys): to the
  // spellbook or to the spells known (spells_kind says which), from the list
  // of spell_list_class_key, each up to max_spell_level.
  int32 spells = 15;
  LevelUpSpellsKind spells_kind = 16;
  // The class whose spell list the new cantrips and spells come from (empty
  // when the class casts nothing yet), and the highest spell level it can
  // cast at the new level.
  string spell_list_class_key = 17;
  int32 max_spell_level = 18;
  // True for a class that prepares spells (Cleric, Druid, Paladin, Wizard):
  // the player may prepare more, up to the new maximum
  // (LevelUpChoices.prepared_spell_keys, none removed). prepared_max is the
  // maximum now; prepared_max_after is the one at the new level with the
  // abilities as they are today. An ability increase can raise it again, so
  // the app reads the final number in PreviewLevelUp
  // (DerivedSheet.spellcasting).
  bool prepares = 19;
  int32 prepared_max = 20;
  int32 prepared_max_after = 21;

  // The options the new features offer (a fighting style, a metamagic), for
  // the class's own features and, when the subclass is already chosen, the
  // subclass's (LevelUpChoices.feature_choice_keys).
  repeated LevelUpFeatureChoice feature_choices = 22;
  // How many new skills (LevelUpChoices.skill_proficiency_keys) and how many
  // new expertise (LevelUpChoices.expertise_skill_keys) the new level gives.
  int32 skill_choices = 23;
  int32 expertise_choices = 24;

  // What changes by itself: the proficiency bonus, the spell slots per
  // circle (9 entries, the 1st circle first) and the warlock's pact slots,
  // before and after, and the class features the level gives.
  int32 proficiency_bonus_before = 25;
  int32 proficiency_bonus_after = 26;
  repeated int32 spell_slots_before = 27;
  repeated int32 spell_slots_after = 28;
  meurpg.rules.v1.PactMagic pact_magic_before = 29;
  meurpg.rules.v1.PactMagic pact_magic_after = 30;
  repeated LevelUpNamedKey new_features = 31;

  // How many of `spells` may come from any class's list, not only
  // spell_list_class_key's: the Bard's Magical Secrets (2 at levels 10, 14 and
  // 18). They must still be of a circle the class can cast. 0 for every
  // other level.
  int32 any_class_spells = 32;
  // The features of this level whose choice the guided level-up does not
  // cover, so the app tells the player "o mestre acrescenta pelo editor":
  // the Warlock's Mystic Arcanum (levels 11, 13, 15 and 17), the Wizard's Spell
  // Mastery (18) and Signature Spells (20), the College of Lore's Additional
  // Magical Secrets (6), and the Ranger's favored enemies and terrains. They
  // are part of the level (new_features lists them too); only their choice is
  // the master's.
  repeated LevelUpNamedKey master_adds = 33;
  // The class of the kept roll, when there is one (kept_hit_point_roll is the
  // roll for the character's next total level, whichever class rolled it). A
  // roll kept for another class cannot be rolled again nor used for this
  // class: RollLevelUpHitPoints and LevelUpCharacter answer
  // HIT_POINT_ROLL_OTHER_CLASS.
  string kept_hit_point_roll_class_key = 34;
}

// LevelUpSubclass is a subclass the player may pick at this level, with the
// options its features at the new level offer.
message LevelUpSubclass {
  string key = 1;
  string name_pt = 2;
  // Shown once the subclass is picked: choose them with the subclass.
  repeated LevelUpFeatureChoice feature_choices = 3;
  // What this subclass adds to the level's counts, which are not in
  // LevelUpOptions' own until it is chosen: new cantrips (the Circle of the
  // Land's bonus cantrip, from the druid list), new skills (the College of
  // Lore's three) and new expertise. Add them to cantrips, skill_choices and
  // expertise_choices once the player picks it.
  int32 cantrips = 4;
  int32 skill_choices = 5;
  int32 expertise_choices = 6;
}

// LevelUpFeatureChoice is "choose `choose` of `options`" for a feature the
// character gains at the new level.
message LevelUpFeatureChoice {
  // The feature that offers the options, such as "feature:metamagic-1".
  LevelUpNamedKey feature = 1;
  // The subclass the feature belongs to, or empty for a class feature.
  string subclass_key = 2;
  // How many options to choose.
  int32 choose = 3;
  // The options the character does not have yet, as content keys.
  repeated LevelUpNamedKey options = 4;
}

// LevelUpHitPointsMethod is how the hit points of the new level are decided.
enum LevelUpHitPointsMethod {
  LEVEL_UP_HIT_POINTS_METHOD_UNSPECIFIED = 0;
  // The average: half the die plus one.
  LEVEL_UP_HIT_POINTS_METHOD_AVERAGE = 1;
  // The roll the server made and kept (RollLevelUpHitPoints).
  LEVEL_UP_HIT_POINTS_METHOD_ROLLED_IN_APP = 2;
  // The result of a physical die, typed in: LevelUpHitPoints.value, 1 to the
  // hit die.
  LEVEL_UP_HIT_POINTS_METHOD_ROLLED_PHYSICAL = 3;
}

// LevelUpHitPoints is the hit points of the new level.
message LevelUpHitPoints {
  LevelUpHitPointsMethod method = 1;
  // With ROLLED_PHYSICAL, the typed result of the die: 1 to the hit die. The
  // server ignores it for the other methods and fills it in the record
  // (ListLevelUps) with the number the level took: the average, or the roll.
  int32 value = 2;
}

// LevelUpChoices is what the player chose for one level up. The lists hold
// only what is new, never the sheet's whole lists: the server adds them to the
// stored sheet. The same message is what ListLevelUps shows the master.
message LevelUpChoices {
  // The class that gains the level: one the character has.
  string class_key = 1;
  // The ability increase at an Ability Score Improvement level: +2 in one
  // ability, or +1 in two, as AbilityScores fields; the others 0 or unset.
  // The sheet keeps it in extra_ability_bonuses. Unset for none.
  meurpg.rules.v1.AbilityScores ability_increase = 2;
  // The subclass, when the class picks it at this level.
  string subclass_key = 3;
  // The new cantrips, spells known (or spellbook) and prepared spells. At most
  // 30, 30 and 100 entries.
  repeated string cantrip_keys = 4;
  repeated string known_spell_keys = 5;
  repeated string prepared_spell_keys = 6;
  // The options the new features offer, the new skills, and the new
  // expertise. At most 100 entries each.
  repeated string feature_choice_keys = 7;
  repeated string skill_proficiency_keys = 8;
  repeated string expertise_skill_keys = 9;
  // The hit points of the level. Required.
  LevelUpHitPoints hit_points = 10;
}

// LevelUpRefusalReason says why the rules refuse a set of choices, so the app
// shows its own Portuguese copy for each; never parse a message.
enum LevelUpRefusalReason {
  LEVEL_UP_REFUSAL_REASON_UNSPECIFIED = 0;
  // Not exactly one class of the character gaining one level (a new class is
  // multiclassing, which stays in the sheet editor).
  LEVEL_UP_REFUSAL_REASON_CLASS = 1;
  // The character is already level 20.
  LEVEL_UP_REFUSAL_REASON_MAX_LEVEL = 2;
  // A field the level does not change would differ (name, race, base scores,
  // equipment...): it stays locked (RN-01). `field` says which.
  LEVEL_UP_REFUSAL_REASON_LOCKED_FIELD = 3;
  // An ability increase at a level that has none.
  LEVEL_UP_REFUSAL_REASON_ABILITY_NOT_DUE = 4;
  // The increase is not +2 in one ability or +1 in two.
  LEVEL_UP_REFUSAL_REASON_ABILITY_SHAPE = 5;
  // The increase would take an ability above 20.
  LEVEL_UP_REFUSAL_REASON_ABILITY_ABOVE_20 = 6;
  // The hit points are out of range: the die result is not 1 to the hit die.
  LEVEL_UP_REFUSAL_REASON_HIT_POINTS = 7;
  // A subclass chosen when none is due, or none chosen when one is due, or one
  // that is not the class's.
  LEVEL_UP_REFUSAL_REASON_SUBCLASS = 8;
  // Not exactly the number of new cantrips the level gives.
  LEVEL_UP_REFUSAL_REASON_CANTRIPS = 9;
  // Not exactly the number of new spells the level gives.
  LEVEL_UP_REFUSAL_REASON_SPELLS = 10;
  // Prepared spells removed, or added by a class that does not prepare.
  LEVEL_UP_REFUSAL_REASON_PREPARED = 11;
  // Not exactly the options the new features offer.
  LEVEL_UP_REFUSAL_REASON_FEATURE_CHOICE = 12;
  // Not exactly the new skills the level gives.
  LEVEL_UP_REFUSAL_REASON_SKILLS = 13;
  // Not exactly the new expertise the level gives.
  LEVEL_UP_REFUSAL_REASON_EXPERTISE = 14;
  // The new sheet would have a problem that the old one did not: a spell off
  // the class's list or above the highest circle, more prepared spells than
  // the new maximum... `issue_code` is the Issue code (meurpg.rules.v1.Issue)
  // and `field` the sheet field.
  LEVEL_UP_REFUSAL_REASON_SHEET_ISSUE = 15;
  // The method ROLLED_IN_APP, but the server has no kept roll for this level:
  // call RollLevelUpHitPoints first.
  LEVEL_UP_REFUSAL_REASON_HIT_POINT_ROLL_MISSING = 16;
  // The kept roll was made for another class of the character (a multiclass
  // character gets one roll per level, so it cannot roll a d6 and a d12 for the
  // same level and keep the better). RollLevelUpHitPoints for the other class,
  // and LevelUpCharacter with ROLLED_IN_APP, are refused.
  LEVEL_UP_REFUSAL_REASON_HIT_POINT_ROLL_OTHER_CLASS = 17;
  // The stored sheet does not pass today's rules by itself (a key the content
  // no longer has, a value out of range), so no choice could fix it: the app
  // says "peça ao mestre para corrigir a ficha", and the master edits it.
  // `field` is the sheet field.
  LEVEL_UP_REFUSAL_REASON_SHEET_NEEDS_MASTER = 18;
}

// LevelUpRefusal is the first rule the choices break: the sheet field and a
// reason code. It is the detail of LevelUpCharacter's `failed_precondition`,
// and PreviewLevelUp returns it as data.
message LevelUpRefusal {
  // The sheet field, with the CharacterSheet field names, such as
  // "full.extra_ability_bonuses" or "full.cantrip_keys".
  string field = 1;
  LevelUpRefusalReason reason = 2;
  // With SHEET_ISSUE: the Issue code, such as "spell_count" or "spell_level".
  string issue_code = 3;
}

// PreviewLevelUpRequest asks for the sheet with the choices applied.
message PreviewLevelUpRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The choices so far, possibly incomplete. A hit points method left
  // UNSPECIFIED previews with the average.
  LevelUpChoices choices = 3;
}

// PreviewLevelUpResponse is the sheet the choices would make.
message PreviewLevelUpResponse {
  // The derived numbers after the level up, as far as the choices go. The
  // app compares it with Character.derived: level, abilities, hit points, hit
  // dice, spell save DC and attack bonus, saves, skills, passive scores,
  // cantrips, slots, prepared spells.
  meurpg.rules.v1.DerivedSheet after = 1;
  // The first rule the choices break, unset when LevelUpCharacter would
  // accept them. An incomplete step shows here (for example CANTRIPS while
  // the new cantrip is not picked).
  LevelUpRefusal refusal = 2;
}

// RollLevelUpHitPointsRequest names the character, and the class if it has
// several.
message RollLevelUpHitPointsRequest {
  string campaign_id = 1;
  string character_id = 2;
  // As in GetLevelUpOptionsRequest.
  string class_key = 3;
  // A UUID the app generates once for the tap, and sends again on a retry.
  // The roll is kept per character, class and level whatever the key, so a
  // second call with another key returns the same roll too.
  string idempotency_key = 4;
}

// RollLevelUpHitPointsResponse is the kept roll.
message RollLevelUpHitPointsResponse {
  // The class's hit die (8 for a d8) and the result, 1 to die.
  int32 die = 1;
  int32 value = 2;
  // False when this call rolled; true when the roll was already there.
  bool already_rolled = 3;
}

// LevelUpCharacterRequest is the guided level-up's "Confirmar o nível N".
message LevelUpCharacterRequest {
  string campaign_id = 1;
  string character_id = 2;
  // The character's revision as the app read it (Character.revision). A
  // different one is `aborted`.
  int32 revision = 3;
  LevelUpChoices choices = 4;
}

// LevelUpCharacterResponse returns the leveled-up character.
message LevelUpCharacterResponse {
  // The character with its new sheet, revision and derived numbers.
  // can_level_up is already false when this was the level it could take.
  Character character = 1;
}

// ListLevelUpsRequest asks for a campaign's level-ups.
message ListLevelUpsRequest {
  string campaign_id = 1;
  // Only this character's level-ups. Empty for the campaign's.
  string character_id = 2;
  // At most this many level-ups: 1 to 50, 20 when 0.
  int32 page_size = 3;
  // The next_page_token of the previous page, to read the next one.
  string page_token = 4;
}

// ListLevelUpsResponse is the master's "O que mudou".
message ListLevelUpsResponse {
  // Newest first.
  repeated LevelUp level_ups = 1;
  // Pass it as page_token to read the next page; empty on the last one.
  string next_page_token = 2;
}

// LevelUp is the record of one guided level-up.
message LevelUp {
  string id = 1;
  string character_id = 2;
  // The character's current name, and its player's display name (empty when
  // the player has not chosen one or left).
  string character_name = 3;
  string player_display_name = 4;
  // The class that gained the level, and its Portuguese name.
  string class_key = 5;
  string class_name_pt = 6;
  // The character's total level before and after ("Subiu para o nível 4").
  int32 from_level = 7;
  int32 to_level = 8;
  // What the player chose. hit_points.value is the number the level took.
  LevelUpChoices choices = 9;
  // The Portuguese name of every content key in choices (spells, features,
  // subclass), by key.
  map<string, string> names_pt = 10;
  // When the player confirmed.
  google.protobuf.Timestamp created_at = 11;
}

// CreatureSource is where a creature came from.
enum CreatureSource {
  CREATURE_SOURCE_UNSPECIFIED = 0;
  // Encontrar Familiar: at most one at a time.
  CREATURE_SOURCE_FAMILIAR = 1;
  // Animar os Mortos: skeletons and zombies.
  CREATURE_SOURCE_ANIMATE_DEAD = 2;
  // Conjurar Animais: animals that last while the caster concentrates.
  CREATURE_SOURCE_CONJURE_ANIMALS = 3;
  // Given by the master (GiveCreature).
  CREATURE_SOURCE_MASTER = 4;
}

// CharacterCreature is a creature that belongs to a character (MR-037).
message CharacterCreature {
  // Stable ID (a UUID).
  string id = 1;
  // The character it belongs to (a UUID).
  string character_id = 2;
  // The SRD creature it is: "monster:wolf". The stat block is
  // meurpg.rules.v1.ContentService.GetCreature; the Portuguese name of the
  // kind is below.
  string monster_key = 3;
  // The creature kind's Portuguese name ("Lobo atroz").
  string monster_name_pt = 4;
  // What the table calls it, 1 to 40 characters ("Nanquim").
  string name = 5;
  // Where it came from.
  CreatureSource source = 6;
  // What it may do on its own in a combat (meurpg.play.v1.CreatureAttack, as
  // its number: 1 none, 2 reaction, 3 full). A number, not the enum, so this
  // file does not import the combat's.
  int32 attack = 7;
  // Creatures of one casting share it (a UUID); they share one initiative roll.
  string summon_group_id = 8;
  // Whether it lasts only while the caster concentrates (Conjurar Animais).
  bool depends_on_concentration = 9;
  // Its hit points: only the master and its owner's player get them here.
  int32 hit_points_current = 10;
  int32 hit_points_max = 11;
  // When it was created (the creatures of one casting a microsecond apart, in
  // the order of the casting).
  google.protobuf.Timestamp created_at = 12;
}

// ListCharacterCreaturesRequest names a character.
message ListCharacterCreaturesRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character of the campaign (a UUID).
  string character_id = 2;
}

// ListCharacterCreaturesResponse lists the character's creatures.
message ListCharacterCreaturesResponse {
  // Oldest first. Dismissed creatures are not listed.
  repeated CharacterCreature creatures = 1;
}

// GiveCreatureRequest gives a creature to a character.
message GiveCreatureRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character (a UUID).
  string character_id = 2;
  // An SRD creature's key, "monster:wolf" (ContentService.ListCreatures).
  string monster_key = 3;
  // What to call it, 1 to 40 characters on one line; blank takes the
  // creature's Portuguese name.
  string name = 4;
}

// GiveCreatureResponse returns the new creature.
message GiveCreatureResponse {
  CharacterCreature creature = 1;
}

// RenameCreatureRequest renames a creature.
message RenameCreatureRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The creature (a UUID). If it is in a combat that is not ended, its combatant
  // takes the new name there too.
  string creature_id = 2;
  // The new name: 1 to 40 characters on one line.
  string name = 3;
}

// RenameCreatureResponse returns the creature with its new name.
message RenameCreatureResponse {
  CharacterCreature creature = 1;
}

// DismissCreatureRequest sends a creature away.
message DismissCreatureRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The creature (a UUID).
  string creature_id = 2;
}

// DismissCreatureResponse is empty: the creature is gone from the list.
message DismissCreatureResponse {}

// AdjustCreatureHitPointsRequest corrects a creature's hit points.
message AdjustCreatureHitPointsRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // The creature (a UUID).
  string creature_id = 2;
  // Exactly one.
  oneof change {
    // Damage taken: 0 to 9999; the hit points stop at 0.
    int32 damage = 3;
    // Healing: 0 to 9999; the hit points stop at the maximum.
    int32 heal = 4;
    // The hit points themselves, 0 to the maximum.
    int32 hit_points = 5;
  }
}

// AdjustCreatureHitPointsResponse returns the creature after the correction.
// A creature taken to 0 is dismissed: it is unset then.
message AdjustCreatureHitPointsResponse {
  CharacterCreature creature = 1;
}

// ListWildShapeFormsRequest names a character.
message ListWildShapeFormsRequest {
  // The campaign (a UUID).
  string campaign_id = 1;
  // A player's character of the campaign (a UUID).
  string character_id = 2;
}

// ListWildShapeFormsResponse lists the beasts the character may become.
message ListWildShapeFormsResponse {
  // The beasts, by Portuguese name; empty when the character has no Wild Shape.
  repeated meurpg.rules.v1.CreatureSummary forms = 1;
  // The limit that decided the list: the highest challenge rating ("1/4"), and
  // whether the fly and the swim speed are left out. Empty and false when there
  // is no Wild Shape.
  string max_cr = 2;
  bool no_fly = 3;
  bool no_swim = 4;
}
