syntax = "proto3";

// Package meurpg.rules.v1 is about the game rules: the rules content a
// character is built from (races, classes, skills, spells...) and the
// numbers the server derives from a character's choices (ADR-0008).
//
// Rules content comes from the System Reference Document 5.1 (SRD 5.1),
// under the Creative Commons Attribution 4.0 license. Content.attribution
// carries the attribution text the app must show.
//
// Conventions used in every message of this package:
//   - Content keys. Every piece of rules content has a stable key made of
//     its type and an ID, such as "race:gnome", "subrace:rock-gnome",
//     "class:wizard", "subclass:evocation", "background:acolyte",
//     "skill:arcana", "equipment:leather-armor", "spell:fire-bolt",
//     "feature:arcane-recovery" or "trait:darkvision". Sheets store these
//     keys, never names, so a name can be fixed without touching any sheet.
//   - Names. `name` is the English name from the SRD, such as "Fire Bolt";
//     `name_pt` is our own Portuguese name, such as "Raio de Fogo".
//     `description` is the SRD's English text. Every other text the server
//     writes for people (hints, issues, damage types) is in Portuguese.
//   - Units. Distances are in feet (fields ending in `_ft`), as in the SRD;
//     the app converts them for display.
package meurpg.rules.v1;

// ContentService lists the rules content that a campaign's characters can
// be built from.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. For a campaign the caller is not a member of, methods answer
// `not_found`, exactly as for a campaign that does not exist (ADR-0011). An
// ID that is not a UUID is answered like an ID that does not exist. A
// database that does not answer gives `unavailable`; the app may try again.
//
// Responses carry `Cache-Control: no-store`. Reads carry a campaign ID, so
// they are IDEMPOTENT and POST-only: a GET would put the ID in the URL, and
// URLs end up in the platform's request logs (docs/privacidade.md).
service ContentService {
  // ListContent returns the catalog the character editor offers: races,
  // subraces, classes, subclasses, backgrounds, skills, armor, weapons and
  // spells, each with its key and names. Any member of the campaign may call
  // it, and so may a pending member (RN-15, MR-024), who needs it to create
  // their character while they wait for the master's approval.
  //
  // Today every campaign gets the same SRD 5.1 content. The request still
  // names the campaign because the table's own content (homebrew, ADR-0008)
  // will depend on it.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, or the caller is not a
  //     member of it.
  rpc ListContent(ListContentRequest) returns (ListContentResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetSpellDetails returns everything the SRD says about one spell,
  // structured: casting time, range, components, duration, attack or saving
  // throw, damage and healing by level, and the English description. It is
  // what the spell's "?" dialog shows; ListContent keeps spells light on
  // purpose. Same access as ListContent: any member of the campaign, a
  // pending member included.
  //
  // Errors:
  //   - `not_found`: the campaign does not exist, the caller is not a
  //     member of it, or no spell has that key.
  rpc GetSpellDetails(GetSpellDetailsRequest) returns (GetSpellDetailsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Ability is one of the six ability scores.
enum Ability {
  ABILITY_UNSPECIFIED = 0;
  // Strength ("Força", FOR).
  ABILITY_STRENGTH = 1;
  // Dexterity ("Destreza", DES).
  ABILITY_DEXTERITY = 2;
  // Constitution ("Constituição", CON).
  ABILITY_CONSTITUTION = 3;
  // Intelligence ("Inteligência", INT).
  ABILITY_INTELLIGENCE = 4;
  // Wisdom ("Sabedoria", SAB).
  ABILITY_WISDOM = 5;
  // Charisma ("Carisma", CAR).
  ABILITY_CHARISMA = 6;
}

// AbilityScores holds one number per ability. The field that uses it says
// what the numbers mean and their range: base scores, or bonuses.
//
// Sheets are stored as JSON with these field names, so they never change.
message AbilityScores {
  int32 strength = 1;
  int32 dexterity = 2;
  int32 constitution = 3;
  int32 intelligence = 4;
  int32 wisdom = 5;
  int32 charisma = 6;
}

// ProficiencyLevel is how much of the proficiency bonus a check adds.
enum ProficiencyLevel {
  PROFICIENCY_LEVEL_UNSPECIFIED = 0;
  // Not proficient: adds nothing.
  PROFICIENCY_LEVEL_NONE = 1;
  // Half the proficiency bonus, rounded down (the Bard's Jack of All
  // Trades).
  PROFICIENCY_LEVEL_HALF = 2;
  // The proficiency bonus.
  PROFICIENCY_LEVEL_PROFICIENT = 3;
  // Twice the proficiency bonus (expertise).
  PROFICIENCY_LEVEL_EXPERTISE = 4;
}

// DerivedSheet is everything the server computes from a character's full
// sheet (MR-004): the app shows these numbers as they come and never
// computes a rule itself.
//
// Derived numbers are never stored: the server computes them again on every
// read, from the sheet and the current rules content. A newer content
// version can therefore change a number on a locked sheet; content_version
// says which content produced these numbers.
//
// Computing never fails. A choice the rules do not recognise, such as a key
// that no longer exists or too many skills, is skipped and reported in
// `issues`: the app is an assistant, not a judge, and the master has the
// final word.
message DerivedSheet {
  // Which rules content produced these numbers, such as
  // "srd51@0123456789ab+fx.1".
  string content_version = 1;

  // The race's Portuguese name. Empty if the sheet has no known race.
  string race_name_pt = 2;
  // The subrace's Portuguese name. Empty if the sheet has none.
  string subrace_name_pt = 3;
  // The background's Portuguese name, or the name of a custom background as
  // the player typed it. Empty if the sheet has none.
  string background_name_pt = 4;
  // The character's classes, in the sheet's order.
  repeated DerivedClass classes = 5;
  // The sum of all class levels, 1 to 20.
  int32 total_level = 6;
  // The proficiency bonus for total_level, such as 2.
  int32 proficiency_bonus = 7;

  // The six abilities, in the order strength, dexterity, constitution,
  // intelligence, wisdom, charisma.
  repeated DerivedAbility abilities = 8;
  // The six saving throws, in the same order as abilities.
  repeated SavingThrow saving_throws = 9;
  // The 18 skills, sorted by their Portuguese name.
  repeated DerivedSkill skills = 10;
  // 10 + the Perception bonus.
  int32 passive_perception = 11;
  // 10 + the Investigation bonus.
  int32 passive_investigation = 12;
  // 10 + the Insight bonus.
  int32 passive_insight = 13;
  // The initiative bonus.
  int32 initiative = 14;

  // Armor class with the armor and shield on the sheet. Spells that change
  // it, such as Mage Armor, are not counted: they belong to the game
  // session.
  int32 armor_class = 15;
  // How armor_class was computed, in Portuguese, such as "Sem armadura" or
  // "Armadura de couro + escudo".
  string armor_class_description = 16;
  // Maximum hit points.
  int32 hit_points_max = 17;
  // Hit dice by die size, largest die first. Several entries only for a
  // character with classes of different hit dice.
  repeated HitDice hit_dice = 18;
  // Walking speed, in feet.
  int32 speed_walk_ft = 19;
  // Special senses, such as darkvision.
  repeated Sense senses = 20;

  // One entry per class that casts spells. Empty for a character that casts
  // no spells.
  repeated Spellcasting spellcasting = 21;
  // Spell slots per spell level, ascending, only levels with at least one
  // slot. With more than one casting class, this comes from the
  // multiclass spellcaster table. Warlock slots are in pact_magic instead.
  repeated SpellSlots spell_slots = 22;
  // The Warlock's pact magic slots. Unset for other characters.
  PactMagic pact_magic = 23;
  // The character's cantrips and spells, cantrips first, then by level and
  // Portuguese name.
  repeated CharacterSpell spells = 24;

  // Attacks, as the official sheet lists them: the weapons carried, then
  // the cantrips that deal damage.
  repeated Attack attacks = 25;
  // Class features, racial traits and background features the character
  // has at its level.
  repeated Feature features = 26;
  // Languages the race and background grant, as Portuguese names. The
  // languages the player typed on the sheet are not repeated here.
  repeated string languages = 27;
  // Armor, weapon and tool proficiencies the race, classes and background
  // grant.
  Proficiencies proficiencies = 28;

  // Situational reminders the numbers above cannot express, such as
  // advantage on some saving throws against magic.
  repeated Hint hints = 29;
  // Choices on the sheet that the rules do not accept, or that were
  // skipped. Empty when everything checks out.
  repeated Issue issues = 30;

  // Use-limited features at the character's level (Second Wind, Ki, Rage).
  // The session counts the uses (RN-02).
  repeated Resource resources = 31;
  // Actions the character's features grant, with their action economy.
  repeated Action actions = 32;
  // The actions everyone has: Attack, Cast a Spell, Dash, Disengage, Dodge,
  // Help, Hide, Ready, Search, Use an Object.
  repeated Action standard_actions = 33;

  // The XP that reaches the next level (SRD "Character Advancement": 300
  // for level 2, 900 for level 3, 2,700 for level 4...), 0 at level 20 or
  // when the sheet has no class yet. The sheet and the campaign's group list
  // compare it with FullSheet.experience_points to show "Pode subir de
  // nível" (RN-12).
  int32 next_level_xp = 34;
}

// Resource is a use-limited feature, such as Second Wind or a monk's ki.
message Resource {
  // The resource's name in the rules content, such as "second_wind".
  string key = 1;
  // The Portuguese name, such as "Retomar o Fôlego".
  string name_pt = 2;
  // How many uses, at the character's level. A barbarian's unlimited rage
  // is 99.
  int32 max = 3;
  // When the uses come back.
  Recharge recharge = 4;
  // Content key of the feature or trait that grants it.
  string source_key = 5;
}

// Recharge says when a Resource's uses come back.
enum Recharge {
  RECHARGE_UNSPECIFIED = 0;
  RECHARGE_SHORT_REST = 1;
  RECHARGE_LONG_REST = 2;
  // At dawn, as for some magic items.
  RECHARGE_DAWN = 3;
  // Never on its own: the master decides.
  RECHARGE_NONE = 4;
}

// Action is something a character does on their turn.
message Action {
  // The feature's content key ("feature:second-wind") for a feature action,
  // or "standard:dash" and the like for a standard one.
  string key = 1;
  // The Portuguese name, such as "Retomar o Fôlego" or "Disparada".
  string name_pt = 2;
  ActionEconomy economy = 3;
  // The key of the Resource each use spends. Empty when it spends none.
  string resource_key = 4;
  // Content key of the feature or trait that grants it. Empty for a
  // standard action.
  string source_key = 5;
}

// ActionEconomy is the part of the turn an action costs.
enum ActionEconomy {
  ACTION_ECONOMY_UNSPECIFIED = 0;
  ACTION_ECONOMY_ACTION = 1;
  ACTION_ECONOMY_BONUS_ACTION = 2;
  ACTION_ECONOMY_REACTION = 3;
  // Costs nothing, such as a free object interaction.
  ACTION_ECONOMY_FREE = 4;
  // Part of the movement.
  ACTION_ECONOMY_MOVEMENT = 5;
}

// DiceFormula is a damage or healing roll as numbers: 1d8+3 is count 1,
// sides 8, bonus 3. The server never rolls; the dice come from the player
// or from the app (RN-18).
message DiceFormula {
  // How many dice. 0 for a flat number.
  int32 count = 1;
  // The die: 8 for a d8.
  int32 sides = 2;
  // Added to the dice. Negative for a penalty.
  int32 bonus = 3;
  // The SRD adds the caster's spellcasting modifier on top ("1d8 + MOD").
  bool adds_modifier = 4;
}

// DerivedClass is one of a character's classes, with names resolved.
message DerivedClass {
  // Content key of the class, such as "class:wizard".
  string class_key = 1;
  // The class's Portuguese name, such as "Mago". Empty if the key is not
  // known.
  string name_pt = 2;
  // Levels in this class, 1 to 20.
  int32 level = 3;
  // The subclass's Portuguese name, or the name of a custom subclass as
  // typed. Empty if none was chosen.
  string subclass_name_pt = 4;
}

// DerivedAbility is one ability, from the base score to the modifier.
message DerivedAbility {
  Ability ability = 1;
  // The ability's Portuguese name, such as "Inteligência".
  string name_pt = 2;
  // The base score from the sheet.
  int32 base = 3;
  // Everything added to the base: race, subrace and the sheet's manual
  // bonuses. Can be negative.
  int32 bonus = 4;
  // base + bonus.
  int32 score = 5;
  // The modifier for score, such as +4 for 18.
  int32 modifier = 6;
}

// SavingThrow is one of the six saving throws.
message SavingThrow {
  Ability ability = 1;
  // The ability's Portuguese name.
  string name_pt = 2;
  // Whether the character is proficient in it: from the starting class
  // (the first on the sheet), or from a feature.
  bool proficient = 3;
  // The total bonus to add to the d20.
  int32 bonus = 4;
}

// DerivedSkill is one skill with the character's bonus.
message DerivedSkill {
  // Content key of the skill, such as "skill:arcana".
  string key = 1;
  // The skill's Portuguese name, such as "Arcanismo".
  string name_pt = 2;
  // The ability the skill uses.
  Ability ability = 3;
  ProficiencyLevel proficiency = 4;
  // The total bonus to add to the d20.
  int32 bonus = 5;
}

// HitDice is a number of hit dice of one size, such as 3d6.
message HitDice {
  // Faces of the die: 6, 8, 10 or 12.
  int32 faces = 1;
  // How many dice.
  int32 count = 2;
}

// Sense is a special sense, such as darkvision.
message Sense {
  // Content key of what grants it, such as "trait:darkvision".
  string key = 1;
  // The sense's Portuguese name, such as "Visão no escuro".
  string name_pt = 2;
  // Range in feet, such as 60.
  int32 range_ft = 3;
}

// Spellcasting is what one casting class gives the character.
message Spellcasting {
  // Content key of the class, such as "class:wizard".
  string class_key = 1;
  // The class's Portuguese name.
  string class_name_pt = 2;
  // The ability the class casts with.
  Ability ability = 3;
  // The spell save DC: 8 + proficiency bonus + ability modifier.
  int32 save_dc = 4;
  // The spell attack bonus: proficiency bonus + ability modifier.
  int32 attack_bonus = 5;
  // How many cantrips the class knows at its level. 0 if it has none.
  int32 cantrips_known = 6;
  // How many spells the class knows at its level, for classes that learn a
  // fixed number (Bard, Ranger, Sorcerer, Warlock). 0 for the others.
  int32 spells_known = 7;
  // How many spells the character can prepare each day, for classes that
  // prepare spells (Cleric, Druid, Paladin, Wizard). 0 for the others.
  int32 prepared_max = 8;
}

// SpellSlots is how many slots the character has of one spell level.
message SpellSlots {
  // Spell level, 1 to 9.
  int32 level = 1;
  // How many slots of that level.
  int32 count = 2;
}

// PactMagic is the Warlock's pact magic: a few slots, all of one level,
// recovered on a short rest.
message PactMagic {
  // The level of every pact slot, 1 to 5.
  int32 slot_level = 1;
  // How many pact slots.
  int32 count = 2;
}

// CharacterSpell is a spell on the character's sheet.
message CharacterSpell {
  Spell spell = 1;
  // Whether the character can cast it today: every cantrip, every spell of
  // a class that knows its spells, and the spells on the sheet's prepared
  // list.
  bool prepared = 2;
}

// Attack is an attack with a weapon on the sheet.
message Attack {
  // Content key of the weapon or the spell, such as "equipment:quarterstaff"
  // or "spell:fire-bolt".
  string key = 1;
  // The English name.
  string name = 2;
  // The Portuguese name, such as "Bordão".
  string name_pt = 3;
  // The attack bonus to add to the d20. 0 for a spell that asks for a
  // saving throw instead: see save_dc.
  int32 attack_bonus = 4;
  // The damage dice with the modifier, such as "1d6+1".
  string damage = 5;
  // The damage type in Portuguese, such as "concussão".
  string damage_type_pt = 6;
  AttackKind kind = 7;
  // For a spell that asks for a saving throw: the DC and the ability of
  // the save. Unset otherwise.
  int32 save_dc = 8;
  Ability save_ability = 9;
  // The two-handed damage of a versatile weapon, such as "1d8+1". Empty
  // otherwise.
  string versatile_damage = 10;
  // The reach or normal range, and the long range of a ranged or thrown
  // weapon or a spell, in feet. long_range_ft is 0 when there is none.
  int32 range_ft = 11;
  int32 long_range_ft = 12;
  // `damage` and `versatile_damage` as numbers, for rolling and adding up.
  // Unset when there are no damage dice.
  DiceFormula damage_dice = 13;
  DiceFormula versatile_damage_dice = 14;
  // Content key of the damage type, such as "damage-type:slashing".
  string damage_type_key = 15;
  // True for a weapon the SRD lists as a melee weapon, thrown or not (a dagger,
  // a spear, a handaxe), and for a basic sheet's attack that reaches 5 ft or
  // less; false for a ranged weapon and for a spell. An opportunity attack is
  // a melee attack.
  bool melee = 16;
}

// AttackKind says whether an attack is a weapon or a spell.
enum AttackKind {
  ATTACK_KIND_UNSPECIFIED = 0;
  // A weapon the character carries.
  ATTACK_KIND_WEAPON = 1;
  // A cantrip that deals damage, at the character's level.
  ATTACK_KIND_SPELL = 2;
}

// Feature is a class feature, racial trait or background feature.
message Feature {
  // Content key, such as "feature:arcane-recovery" or "trait:darkvision".
  string key = 1;
  // English name from the SRD.
  string name = 2;
  // Portuguese name.
  string name_pt = 3;
  // Where it comes from, in Portuguese, such as "Mago 1" or "Gnomo".
  string source_pt = 4;
  // The SRD's English text.
  string description = 5;
}

// Proficiencies lists armor, weapon and tool proficiencies, as Portuguese
// names such as "Armaduras leves" or "Adagas".
message Proficiencies {
  repeated string armor = 1;
  repeated string weapons = 2;
  repeated string tools = 3;
}

// Hint is a reminder the numbers cannot express, because it depends on the
// situation. The server never applies it on its own: the master decides.
message Hint {
  // Content key of the feature or trait that gives it, such as
  // "trait:gnome-cunning".
  string source_key = 1;
  // The reminder in Portuguese, such as "Vantagem em testes de resistência
  // de INT, SAB e CAR contra magia".
  string text = 2;
}

// Issue is a choice on the sheet that the rules do not accept, such as a
// skill the class cannot choose, too many cantrips, or a content key that no
// longer exists. The numbers are computed without it.
message Issue {
  // A stable code for the kind of problem, in lower_snake_case, such as
  // "unknown_key" or "too_many_cantrips".
  string code = 1;
  // Which field of the sheet has the problem, as a path with the proto
  // field names, such as "full.classes[0].subclass_key". Empty when the
  // problem is not about one field.
  string field = 2;
  // What is wrong, in Portuguese, for the app to show.
  string message = 3;
}

// Content is the rules content a campaign's characters can be built from.
// Every list is sorted by Portuguese name, except abilities.
message Content {
  // Which version of the content this is, such as
  // "srd51@0123456789ab+fx.1". Versions never change in place.
  string content_version = 1;
  // The attribution text of the SRD 5.1 license, which the app must show
  // on its credits page, exactly as given.
  string attribution = 2;
  // The six abilities, in the order strength to charisma.
  repeated AbilityInfo abilities = 3;
  repeated Race races = 4;
  repeated Subrace subraces = 5;
  repeated CharacterClass classes = 6;
  repeated Subclass subclasses = 7;
  repeated Background backgrounds = 8;
  repeated Skill skills = 9;
  // Body armor only. A shield is a yes/no on the sheet.
  repeated Armor armor = 10;
  repeated Weapon weapons = 11;
  repeated Spell spells = 12;
  // The SRD's 34 challenge ratings ("ND") with their XP, in order from 0
  // to 30. The NPC editor offers them as a picker that fills in the XP the
  // creature gives when defeated (MR-016); the master may type another
  // value.
  repeated ChallengeRating challenge_ratings = 13;
}

// ChallengeRating is one row of the SRD's "Experience Points by Challenge
// Rating" table.
message ChallengeRating {
  // "0", "1/8", "1/4", "1/2", "1" ... "30". The app writes it "ND 1/4".
  string rating = 1;
  // The XP a creature of this rating gives when defeated. Rating "0" is 10
  // here; a creature with no attack gives 0, which the master types.
  int32 xp = 2;
}

// AbilityInfo names one ability.
message AbilityInfo {
  Ability ability = 1;
  // English name, such as "Intelligence".
  string name = 2;
  // Portuguese name, such as "Inteligência".
  string name_pt = 3;
  // Portuguese abbreviation, such as "INT".
  string abbreviation_pt = 4;
}

// Race is a race from the rules content.
message Race {
  // Content key, such as "race:gnome".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Walking speed in feet, such as 25.
  int32 speed_ft = 4;
  // The race's fixed ability score increases, such as +2 intelligence.
  // Increases the player chooses, such as the Half-Elf's two +1, are not
  // here: the sheet records them as extra bonuses.
  AbilityScores ability_bonuses = 5;
}

// Subrace is a subrace of one race.
message Subrace {
  // Content key, such as "subrace:rock-gnome".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Content key of the race it belongs to, such as "race:gnome".
  string race_key = 4;
  // The subrace's ability score increases, added to the race's.
  AbilityScores ability_bonuses = 5;
}

// CharacterClass is a class from the rules content.
message CharacterClass {
  // Content key, such as "class:wizard".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Faces of the hit die: 6, 8, 10 or 12.
  int32 hit_die = 4;
  // The two saving throws the class is proficient in.
  repeated Ability saving_throws = 5;
  // The skills a character of this class chooses at level 1.
  SkillChoice skill_choice = 6;
  // The class level at which the character chooses a subclass, such as 2
  // for the Wizard.
  int32 subclass_level = 7;
  // How the class casts spells. Unset for a class that never casts.
  ClassSpellcasting spellcasting = 8;
}

// SkillChoice is "choose `count` skills from this list".
message SkillChoice {
  // How many skills to choose.
  int32 count = 1;
  // Content keys of the skills to choose from.
  repeated string skill_keys = 2;
}

// SpellPreparation is how a class decides which spells it can cast.
enum SpellPreparation {
  SPELL_PREPARATION_UNSPECIFIED = 0;
  // The class knows a fixed number of spells and can cast any of them
  // (Bard, Ranger, Sorcerer, Warlock). The sheet uses known_spell_keys.
  SPELL_PREPARATION_KNOWN = 1;
  // The class prepares spells each day from its whole spell list (Cleric,
  // Druid, Paladin). The sheet uses prepared_spell_keys.
  SPELL_PREPARATION_PREPARED = 2;
  // The class keeps spells in a spellbook and prepares some of them each
  // day (Wizard). The sheet uses both known_spell_keys (the spellbook) and
  // prepared_spell_keys.
  SPELL_PREPARATION_SPELLBOOK = 3;
}

// ClassSpellcasting describes a casting class.
message ClassSpellcasting {
  // The ability the class casts with.
  Ability ability = 1;
  // The class level at which spellcasting starts: 1 for most classes, 2
  // for the Paladin and the Ranger.
  int32 first_level = 2;
  SpellPreparation preparation = 3;
  // The highest spell circle (1 to 9) the class can cast at each class
  // level, from the class table's spell slots. Index 0 is class level 1 and
  // index 19 is level 20, so there are 20 entries. 0 means no leveled spells
  // yet (Paladin and Ranger at level 1; cantrips are never gated by level).
  // The Warlock's entry is its pact slot circle. Clients use it to list only
  // the spells the character can take; the server still validates on save.
  repeated int32 max_spell_level_by_level = 4;
}

// Subclass is a subclass of one class.
message Subclass {
  // Content key, such as "subclass:evocation".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Content key of the class it belongs to, such as "class:wizard".
  string class_key = 4;
}

// Background is a background from the rules content.
message Background {
  // Content key, such as "background:acolyte".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Content keys of the skills the background grants.
  repeated string skill_keys = 4;
}

// Skill is one of the 18 skills.
message Skill {
  // Content key, such as "skill:arcana".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // The ability the skill uses.
  Ability ability = 4;
}

// ArmorCategory is the weight class of body armor.
enum ArmorCategory {
  ARMOR_CATEGORY_UNSPECIFIED = 0;
  ARMOR_CATEGORY_LIGHT = 1;
  ARMOR_CATEGORY_MEDIUM = 2;
  ARMOR_CATEGORY_HEAVY = 3;
}

// Armor is a suit of body armor.
message Armor {
  // Content key, such as "equipment:leather-armor".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  ArmorCategory category = 4;
}

// WeaponCategory says whether a weapon is simple or martial.
enum WeaponCategory {
  WEAPON_CATEGORY_UNSPECIFIED = 0;
  WEAPON_CATEGORY_SIMPLE = 1;
  WEAPON_CATEGORY_MARTIAL = 2;
}

// Weapon is a weapon from the rules content.
message Weapon {
  // Content key, such as "equipment:quarterstaff".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  WeaponCategory category = 4;
  // True for a ranged weapon, false for a melee one.
  bool ranged = 5;
}

// Spell is a spell from the rules content.
message Spell {
  // Content key, such as "spell:fire-bolt".
  string key = 1;
  string name = 2;
  string name_pt = 3;
  // Spell level, 0 to 9; 0 is a cantrip.
  int32 level = 4;
  // Content key of the school of magic, such as "school:evocation".
  string school_key = 5;
  // The school's Portuguese name, such as "Evocação".
  string school_name_pt = 6;
  // Content keys of the classes whose spell list has this spell.
  repeated string class_keys = 7;
  // Whether it can be cast as a ritual.
  bool ritual = 8;
  // Whether it needs concentration.
  bool concentration = 9;
}

// ListContentRequest names a campaign.
message ListContentRequest {
  string campaign_id = 1;
}

// ListContentResponse returns the campaign's rules content.
message ListContentResponse {
  Content content = 1;
}

// GetSpellDetailsRequest names a spell. The campaign is there for access
// (and, later, for the table's own spells).
message GetSpellDetailsRequest {
  string campaign_id = 1;
  // Content key of the spell, such as "spell:fire-bolt".
  string spell_key = 2;
}

// GetSpellDetailsResponse returns one spell, in full.
message GetSpellDetailsResponse {
  SpellDetails spell = 1;
}

// SpellDetails is everything the SRD says about a spell, structured. Values
// are in the SRD's units (feet, rounds, English); the app writes them in
// Portuguese ("60 ft" is "18 m", "1 action" is "1 ação"). Whatever does not
// fit a structure is kept in the `raw` field exactly as the SRD wrote it.
message SpellDetails {
  // The light entry ListContent returns: key, names, level, school, classes,
  // ritual and concentration.
  Spell spell = 1;
  SpellCastingTime casting_time = 2;
  SpellRange range = 3;
  SpellComponents components = 4;
  SpellDuration duration = 5;
  // Whether the spell needs an attack roll.
  SpellAttackType attack_type = 6;
  // The saving throw the spell asks for. Unset when it asks for none.
  SpellSave save = 7;
  // The damage, one entry per damage type (Ice Storm has two).
  repeated SpellDamage damage = 8;
  // Healing by the level of the slot, such as {1: "1d8 + MOD"}. Empty when
  // the spell does not heal.
  map<int32, string> heal_by_slot_level = 9;
  // The SRD's English description, one paragraph per entry.
  repeated string description = 10;
  // The SRD's "At Higher Levels" paragraphs, in English. Empty when the
  // spell has none.
  repeated string higher_level = 11;
  // What a spell that reads hit points does (Sono, Borrifo de Cores, Palavra de
  // Poder, Poupar os Moribundos, Cura Completa). Unset for any other spell.
  // These are public spell rules, like the rest of the message: every member
  // gets them, and the app reads them instead of keeping a copy of the table.
  SpellHitPointEffect hit_point_effect = 12;
}

// SpellHitPointEffectKind is how a spell that reads hit points works.
enum SpellHitPointEffectKind {
  SPELL_HIT_POINT_EFFECT_KIND_UNSPECIFIED = 0;
  // A pool of dice is rolled and the creatures are affected in ascending order
  // of current hit points (Sono, Borrifo de Cores).
  SPELL_HIT_POINT_EFFECT_KIND_POOL = 1;
  // A creature at or below a number of hit points is affected (Palavra de Poder).
  SPELL_HIT_POINT_EFFECT_KIND_THRESHOLD = 2;
  // Works only on a creature at 0 hit points (Poupar os Moribundos).
  SPELL_HIT_POINT_EFFECT_KIND_ZERO_HP = 3;
  // A fixed heal that also ends conditions (Cura Completa).
  SPELL_HIT_POINT_EFFECT_KIND_FLAT_HEAL = 4;
}

// SpellHitPointEffect is the rule of a spell that reads hit points, from
// effects/spells.json, at the spell's own circle and what each circle above adds.
message SpellHitPointEffect {
  SpellHitPointEffectKind kind = 1;
  // A pool: the dice at the spell's own circle (5d8) and how many dice each
  // circle above adds (2). 0 for any other kind.
  int32 pool_dice_count = 2;
  int32 pool_dice_sides = 3;
  int32 pool_dice_per_level = 4;
  // The condition given to each creature affected ("condition:unconscious").
  // Empty when none is given (a kill, a stabilise, a heal).
  string condition_key = 5;
  // A threshold: the most hit points a creature may have to be affected.
  int32 threshold = 6;
  // A threshold that kills instead of giving a condition.
  bool dies = 7;
  // A flat heal: the amount at the spell's own circle and what each circle above adds.
  int32 heal_amount = 8;
  int32 heal_per_level = 9;
}

// SpellCastingTime is "1 action", "1 bonus action", "10 minutes"...
message SpellCastingTime {
  // The number: 1 for "1 action", 10 for "10 minutes".
  int32 amount = 1;
  CastingTimeUnit unit = 2;
  // For a reaction, when it is cast, in English ("which you take when you
  // are hit..."). Empty when the SRD data has none.
  string trigger = 3;
  // The SRD's text, such as "1 action".
  string raw = 4;
}

enum CastingTimeUnit {
  CASTING_TIME_UNIT_UNSPECIFIED = 0;
  CASTING_TIME_UNIT_ACTION = 1;
  CASTING_TIME_UNIT_BONUS_ACTION = 2;
  CASTING_TIME_UNIT_REACTION = 3;
  CASTING_TIME_UNIT_MINUTE = 4;
  CASTING_TIME_UNIT_HOUR = 5;
}

// SpellRange is how far a spell reaches.
message SpellRange {
  SpellRangeKind kind = 1;
  // Distance in feet, for SPELL_RANGE_KIND_RANGED. 0 otherwise.
  int32 distance_ft = 2;
  // The SRD's text, such as "120 feet".
  string raw = 3;
}

enum SpellRangeKind {
  SPELL_RANGE_KIND_UNSPECIFIED = 0;
  SPELL_RANGE_KIND_SELF = 1;
  SPELL_RANGE_KIND_TOUCH = 2;
  // A distance, in distance_ft.
  SPELL_RANGE_KIND_RANGED = 3;
  SPELL_RANGE_KIND_SIGHT = 4;
  SPELL_RANGE_KIND_UNLIMITED = 5;
  // The SRD says "Special": read `raw` and the description.
  SPELL_RANGE_KIND_SPECIAL = 6;
}

// SpellComponents are the verbal, somatic and material components.
message SpellComponents {
  bool verbal = 1;
  bool somatic = 2;
  bool material = 3;
  // What the material component is, in English. Empty without one.
  string material_text = 4;
}

// SpellDuration is how long a spell lasts.
message SpellDuration {
  SpellDurationKind kind = 1;
  // For SPELL_DURATION_KIND_TIMED: "8 hours" is amount 8, unit HOUR.
  int32 amount = 2;
  SpellDurationUnit unit = 3;
  // "Up to 1 minute": the spell may end sooner.
  bool up_to = 4;
  // The caster must keep concentrating.
  bool concentration = 5;
  // The SRD's text, such as "Up to 1 minute".
  string raw = 6;
}

enum SpellDurationKind {
  SPELL_DURATION_KIND_UNSPECIFIED = 0;
  SPELL_DURATION_KIND_INSTANTANEOUS = 1;
  // A length of time, in amount and unit.
  SPELL_DURATION_KIND_TIMED = 2;
  SPELL_DURATION_KIND_UNTIL_DISPELLED = 3;
  // The SRD says "Special": read `raw` and the description.
  SPELL_DURATION_KIND_SPECIAL = 4;
}

enum SpellDurationUnit {
  SPELL_DURATION_UNIT_UNSPECIFIED = 0;
  SPELL_DURATION_UNIT_ROUND = 1;
  SPELL_DURATION_UNIT_MINUTE = 2;
  SPELL_DURATION_UNIT_HOUR = 3;
  SPELL_DURATION_UNIT_DAY = 4;
}

// SpellAttackType says whether a spell needs an attack roll.
enum SpellAttackType {
  SPELL_ATTACK_TYPE_UNSPECIFIED = 0;
  SPELL_ATTACK_TYPE_NONE = 1;
  SPELL_ATTACK_TYPE_MELEE = 2;
  SPELL_ATTACK_TYPE_RANGED = 3;
}

// SpellSave is a saving throw a spell asks for.
message SpellSave {
  // The ability of the saving throw.
  Ability ability = 1;
  SpellSaveSuccess on_success = 2;
}

// SpellSaveSuccess says what a successful saving throw does.
enum SpellSaveSuccess {
  SPELL_SAVE_SUCCESS_UNSPECIFIED = 0;
  // The target takes no effect.
  SPELL_SAVE_SUCCESS_NONE = 1;
  // The target takes half the damage.
  SPELL_SAVE_SUCCESS_HALF = 2;
  // Something else: read the description.
  SPELL_SAVE_SUCCESS_OTHER = 3;
}

// SpellDamage is one damage type of a spell, with its dice by level. The
// dice are the SRD's text ("8d6"); where the SRD gives a choice or a
// formula that is not plain dice ("4d6 OR 5d6"), the text is kept as is.
message SpellDamage {
  // Content key of the damage type, such as "damage-type:fire".
  string damage_type_key = 1;
  // The Portuguese name, such as "fogo".
  string damage_type_pt = 2;
  // The dice by the level of the slot the spell is cast with, such as
  // {3: "8d6", 4: "9d6"}. Empty for a cantrip.
  map<int32, string> by_slot_level = 3;
  // The dice by the character's level, for cantrips: they grow at levels 5,
  // 11 and 17, such as {1: "1d10", 5: "2d10"}. Empty for other spells.
  map<int32, string> by_character_level = 4;
}

// TurnOptions is everything a character can do now: "Sua vez" (MR-014). The
// server works it out on every read from the sheet, what the character used
// this turn and what they spent since the last rest. It is never stored.
// A disabled option carries a reason code, never text: the app maps each
// code to Portuguese.
message TurnOptions {
  TurnEconomy economy = 1;
  // Weapon attacks and damaging cantrips, each with its to-hit and damage.
  repeated AttackOption attacks = 2;
  // The prepared spells that are not already an attack (cantrips that deal
  // damage are in `attacks`).
  repeated SpellOption spells = 3;
  // The actions everyone has.
  repeated ActionOption standard_actions = 4;
  // The actions the character's features grant.
  repeated ActionOption feature_actions = 5;
}

// TurnEconomy is the state of the turn's action economy.
message TurnEconomy {
  EconomyState action = 1;
  EconomyState bonus_action = 2;
  EconomyState reaction = 3;
  MovementLeft movement = 4;
  // How many attacks the Attack action makes: 1, or 2 with Extra Attack. At
  // least 1.
  int32 attacks_per_action = 5;
  // How many of them remain this turn: all of them while the action is free,
  // the rest after the first attack spent it, 0 when something else spent the
  // action. The attacks stay enabled while this is above 0.
  int32 attacks_left = 6;
}

// EconomyState says whether an action, bonus action or reaction is spent.
message EconomyState {
  bool used = 1;
  bool available = 2;
}

// MovementLeft is the walking left in the turn, in feet.
message MovementLeft {
  // The speed for this turn: doubled after the Dash action.
  int32 speed_ft = 1;
  int32 used_ft = 2;
  int32 left_ft = 3;
}

// DisabledReason says why an option cannot be used now.
message DisabledReason {
  DisabledReasonCode code = 1;
  // For DISABLED_REASON_CODE_NO_SLOT: the lowest slot level that would do.
  int32 min_level = 2;
  // For DISABLED_REASON_CODE_NO_USES: when the uses come back.
  Recharge recharge = 3;
}

enum DisabledReasonCode {
  DISABLED_REASON_CODE_UNSPECIFIED = 0;
  // The action, bonus action or reaction the option needs is already spent.
  DISABLED_REASON_CODE_ACTION_USED = 1;
  DISABLED_REASON_CODE_BONUS_ACTION_USED = 2;
  DISABLED_REASON_CODE_REACTION_USED = 3;
  // No free slot at the spell's level or above (see min_level).
  DISABLED_REASON_CODE_NO_SLOT = 4;
  // The feature's uses are spent (see recharge).
  DISABLED_REASON_CODE_NO_USES = 5;
  // Shield: cast only when an attack hits the caster.
  DISABLED_REASON_CODE_REACTION_ONLY_WHEN_HIT = 6;
  // Another reaction spell: cast only when its trigger happens.
  DISABLED_REASON_CODE_REACTION_ONLY = 7;
  // The casting time is a minute or more, too long for a fight.
  DISABLED_REASON_CODE_CASTING_TIME_TOO_LONG = 8;
  // CombatService.GetTurnOptions: the combatant is not the one on turn
  // ("fora da vez"). Every option of a combatant off turn carries it.
  DISABLED_REASON_CODE_NOT_YOUR_TURN = 9;
  // CombatService.GetTurnOptions: the combat is not running (still being set
  // up, or already over).
  DISABLED_REASON_CODE_COMBAT_NOT_ACTIVE = 10;
  // CombatService.GetTurnOptions: a player's character at 0 hit points
  // ("Caído"): it makes death saves (CombatService.RollDeathSave) instead of
  // acting.
  DISABLED_REASON_CODE_COMBATANT_DOWN = 11;
  // CombatService.GetTurnOptions: the combatant is out of the fight
  // ("Derrotado").
  DISABLED_REASON_CODE_COMBATANT_DEFEATED = 12;
  // An attack: the Attack action made all its attacks this turn (Extra
  // Attack). With a single attack per action the code is ACTION_USED.
  DISABLED_REASON_CODE_ATTACKS_USED = 13;
}

// AttackOption is an attack the character can make.
message AttackOption {
  Attack attack = 1;
  bool enabled = 2;
  // Set when `enabled` is false.
  DisabledReason reason = 3;
}

// SpellOption is a spell the character can cast.
message SpellOption {
  Spell spell = 1;
  // What casting costs. ACTION_ECONOMY_UNSPECIFIED for a casting time too
  // long for a fight.
  ActionEconomy economy = 2;
  bool enabled = 3;
  // Set when `enabled` is false.
  DisabledReason reason = 4;
  // The slots it can be cast with: at least the spell's level, with a free
  // slot. Empty for a cantrip, and for a spell with no free slot.
  repeated SlotChoice slots = 5;
}

// SlotChoice is a spell slot a spell can be cast with.
message SlotChoice {
  // The slot level, 1 to 9.
  int32 level = 1;
  // Whether it is a Warlock's pact magic slot.
  bool pact = 2;
  // How many slots of this kind are free, so the app can warn about the
  // last one.
  int32 free = 3;
}

// ActionOption is a standard or feature action the character can take.
message ActionOption {
  Action action = 1;
  bool enabled = 2;
  // Set when `enabled` is false.
  DisabledReason reason = 3;
  // Uses left of the action's resource. 0 when it has none.
  int32 uses_left = 4;
}
