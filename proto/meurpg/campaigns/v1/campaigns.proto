syntax = "proto3";

// Package meurpg.campaigns.v1 is about campaigns, who belongs to them, the
// invites that let new players in, and each campaign's document
// (campaign_document.proto).
package meurpg.campaigns.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// CampaignService creates campaigns, lists their members and manages
// invites.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. Roles are per campaign (RN-05): the same user can be the
// master of one campaign and a player in another. For a campaign the caller
// is not a member of, methods answer `not_found`, exactly as for a campaign
// that does not exist, so nobody learns which campaigns exist. A member
// without the needed role gets `permission_denied`. See ADR-0011.
//
// Pending members (RN-15, MR-024). Accepting an invite that requires
// approval makes the caller a pending member of its campaign: they wait
// for the master to approve the character they create (see
// meurpg.characters.v1.CharacterService.ApproveCharacter). A pending member
// is not a member yet. They see the campaign in ListMyCampaigns and
// through GetCampaign, both with only its name, the campaign's XP mode and
// `awaiting_approval` set; every other method answers them `not_found`, exactly as for someone
// who is not in the campaign.
//
// Responses carry `Cache-Control: no-store`, because they describe the
// caller's campaigns.
//
// Reads are marked by their idempotency level. NO_SIDE_EFFECTS, which lets
// clients call a method with HTTP GET, is only for requests with no IDs and
// no personal data (ListMyCampaigns): a GET puts the whole request in the
// URL, and URLs end up in the platform's request logs (docs/privacy.md).
// Reads whose requests carry an ID are IDEMPOTENT instead: safe to retry,
// documented as reads, and POST-only.
service CampaignService {
  // CreateCampaign creates a campaign; the caller becomes its master
  // (MR-001). It can be refused with a CampaignCreationRefused detail
  // (RN-30): `resource_exhausted` when the caller is already master of the
  // most campaigns the server allows, `permission_denied` when the server
  // only lets some people create campaigns and the caller is not one.
  //
  // Safe to retry when the request carries an idempotency_key: a second call with the same key and
  // the same request returns what the first one made and makes nothing; the same key with another
  // request is `invalid_argument`. Without a key the call is not deduplicated.
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);

  // ListMyCampaigns lists the campaigns the caller is a member of, newest
  // first, with the caller's role in each. It also lists the campaigns where
  // the caller is a pending member (RN-15, MR-024), with only the id, the
  // name, my_role, xp_mode and `awaiting_approval` set, so the player can find their
  // way back to the campaign while they wait.
  //
  // Its request is empty, so clients may call it with HTTP GET: the URL
  // never carries personal data.
  rpc ListMyCampaigns(ListMyCampaignsRequest) returns (ListMyCampaignsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetCampaign returns one campaign. Any member may call it. It only
  // reads, but stays POST-only, because a GET would put the campaign ID in
  // the URL.
  //
  // A pending member (RN-15, MR-024) may call it too, and gets only the
  // campaign's id, name, my_role (ROLE_PLAYER), xp_mode and `awaiting_approval`
  // set: enough to show "esperando a aprovação do mestre", and for the
  // character editor to start a new character at its level's XP.
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListMembers lists a campaign's members: the master first, then the
  // players in the order they joined. Any member may call it. It only
  // reads, and is POST-only, like GetCampaign.
  //
  // Pending members (RN-15, MR-024) are not listed: they are not members
  // yet. The master sees who is waiting through their characters
  // (CharacterService.ListCharacters, state PENDING), and the ones who have
  // not created a character yet through ListPendingMembers. A pending
  // member who calls it gets `not_found`. (Those two live in their own calls
  // so that this list keeps meaning "people who are in the campaign".)
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListPendingMembers lists the campaign's pending members who have not
  // created a character yet (RN-15, MR-024), in the order they joined, each
  // with when they joined and when they will be removed automatically (30
  // days after joining). Only the campaign's master may call it. It only
  // reads, and is POST-only, like GetCampaign.
  //
  // It is a call of its own, not extra entries in ListMembers, because those
  // people are not members: ListMembers keeps its meaning, and no screen
  // that reads it can mistake them for players. A pending member who already
  // created a character is not here: the master finds them, and approves or
  // rejects them, through CharacterService.ListCharacters.
  rpc ListPendingMembers(ListPendingMembersRequest) returns (ListPendingMembersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemovePendingMember removes a pending member who has not created a
  // character yet (RN-15, MR-024): their membership is deleted. The person
  // loses nothing else (account, other campaigns), and a new invite brings
  // them back. Only the campaign's master may call it. Removing someone who
  // is already gone is `not_found`, so a repeated call tells the app the
  // list is stale.
  //
  // Errors:
  //   - `not_found`: the campaign is not the caller's to manage (see
  //     authorization), or the user has no membership in it.
  //   - `failed_precondition`: the user is an active member (members are not
  //     removed here), or a pending member who already has a character
  //     (the master rejects it with CharacterService.RejectCharacter).
  rpc RemovePendingMember(RemovePendingMemberRequest) returns (RemovePendingMemberResponse);

  // CreateInvite creates an invite link for a campaign (MR-002). Only the
  // campaign's master may call it.
  //
  // The response carries the invite's secret token, and this is the only
  // time the server ever returns it: the database keeps only a hash. The app
  // shares it as https://<app>/invite#t=<token>. The token goes in the URL
  // fragment, which browsers never send to a server, so it stays out of
  // request logs and Referer headers (ADR-0009).
  //
  // With `requires_approval`, whoever accepts the invite becomes a pending
  // member instead of a player (RN-15, MR-024): see AcceptInvite.
  //
  // A campaign has at most 50 invites that still work (not revoked, not
  // expired, with uses left; RN-30): the 51st is `resource_exhausted`. Revoking
  // an invite, or letting it expire or run out, frees a place.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

  // ListInvites lists a campaign's invites, newest first, without their
  // tokens. Only the campaign's master may call it. It only reads, and is
  // POST-only, like GetCampaign.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RevokeInvite stops an invite from working. People who already joined
  // with it stay members. Revoking an invite twice is not an error. Only the
  // campaign's master may call it.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);

  // AcceptInvite makes the caller a player of the invite's campaign
  // (MR-003). The app reads the token from the URL fragment and sends it
  // here, in the request body, never in a URL. A signed-out user does the
  // same through sign-in instead: POST /auth/login with
  // intent=campaign_invite and the token as intent_payload (ADR-0009).
  //
  // It is idempotent for members: a member of the campaign (the master
  // included) gets the campaign back with `already_member` set, whatever
  // the state of the invite, and no use of the invite is spent. This holds
  // for a pending member too, with one exception: a pending member who
  // accepts an invite WITHOUT approval (and that works now) is promoted. It
  // spends one use, the membership becomes active, and the character they
  // created and that waits for approval, if any, is approved: an ordinary
  // invite counts as the master's approval (RN-15). The response then has
  // `already_member` false and the full campaign. If they accept an invite
  // with approval, or one that does not work, they stay pending.
  //
  // Invites with approval (RN-15, MR-024). When the invite has
  // `requires_approval`, the caller becomes a pending member, not a player:
  // the returned campaign has `awaiting_approval` set and only its id, name,
  // my_role and xp_mode. The app takes them straight to creating their character
  // (CharacterService.CreateCharacter), which starts PENDING. They become a
  // player when the master approves that character
  // (CharacterService.ApproveCharacter); if the master rejects it
  // (CharacterService.RejectCharacter), the pending membership is deleted
  // and they need a new invite. Accepting it through sign-in works the same
  // way: a new pending member lands on
  // /campaigns/<campaign_id>/characters/new, and someone who was already
  // in the campaign on /campaigns/<campaign_id>.
  //
  // Errors:
  //   - `invalid_argument`: the token is empty.
  //   - `not_found`: no invite has this token.
  //   - `failed_precondition`: the invite expired, was revoked or has no
  //     uses left. The error carries an InviteUnusable detail that says
  //     which, so the app can show a clear message.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);

  // SetCampaignDiceMode sets how the campaign's players roll dice (RN-18,
  // MR-013): everyone in the app, everyone with their own dice, or each
  // player's choice. Only the campaign's master may call it. It applies
  // from the next roll, and the players' own choices are kept, whatever
  // the mode. Setting the mode it already has is not an error.
  //
  // Errors: `invalid_argument` for an unspecified or unknown mode.
  rpc SetCampaignDiceMode(SetCampaignDiceModeRequest) returns (SetCampaignDiceModeResponse);

  // SetMyDicePreference sets how the caller likes to roll in this campaign
  // (RN-18, MR-014). Any active member may call it, the master too. It is
  // always saved, but it only counts while the campaign's mode is
  // DICE_MODE_PLAYERS_CHOOSE. A pending member gets `not_found`.
  //
  // Errors: `invalid_argument` for an unspecified or unknown preference.
  rpc SetMyDicePreference(SetMyDicePreferenceRequest) returns (SetMyDicePreferenceResponse);

  // GetTableRules returns the table's rules (MR-025, RN-24): what "Regras da
  // mesa" shows. Any active member may call it, because the page is shown to
  // the whole table. A campaign that never saved its rules gets the defaults
  // (the SRD's: what the app did before the rules existed). A pending member
  // (RN-15) may call it too, to see which ways of making ability scores the
  // table allows while they create their character. It only reads, but stays POST-only, because a GET would
  // put the campaign ID in the URL.
  rpc GetTableRules(GetTableRulesRequest) returns (GetTableRulesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetTableRules replaces all of the table's rules (RN-24). Only the
  // campaign's master may call it. It is one save, as the page has one "Salvar
  // regras": every field is written, so the app sends the whole TableRules it
  // shows. It writes the dice mode (campaigns' own setting, RN-18) in the same
  // transaction, so the page's dice choice and the rest never disagree. It
  // applies from now on: sheets that already exist keep their scores, and a
  // level-up, a creation or a new map takes the rules in force when it happens.
  // Setting what is already saved is not an error.
  //
  // Errors:
  //   - `invalid_argument`: a field is unspecified or unknown; no ability
  //     method is allowed; more than 20 house rules, or one that is empty,
  //     longer than 200 characters or has a line break.
  rpc SetTableRules(SetTableRulesRequest) returns (SetTableRulesResponse);

  // SetCampaignXpMode changes how the campaign levels (RN-09) after it was
  // created. Only the campaign's master may call it. The new mode applies from
  // now on; nothing already awarded is converted or changed, the history stays,
  // and going back to the earlier mode is allowed. When XP was already awarded
  // (an award that was not undone, a milestone included), the call needs
  // `confirm`: without it, it answers `failed_precondition` with an
  // XpModeChangeBlocked detail that says how much was awarded, and changes
  // nothing. Setting the mode the campaign already has is not an error and
  // asks for nothing.
  //
  // The mode also decides "Pode subir de nível" (RN-12): by enemies or by gold, the
  // character's XP reaching the next level; by milestones, a mark. So a switch
  // moves the level-ups that are waiting: a character that was ready by XP is
  // not ready by milestones until the master marks it, and one marked for a
  // milestone is not ready by XP until the XP reaches the level. Nothing is
  // written to the sheets: the flag is read from the mode on every read.
  //
  // Errors:
  //   - `invalid_argument`: the mode is unspecified or unknown.
  //   - `failed_precondition`: XP was already awarded and `confirm` is false
  //     (XpModeChangeBlocked).
  rpc SetCampaignXpMode(SetCampaignXpModeRequest) returns (SetCampaignXpModeResponse);
}

// Role is what a member may do in one campaign (RN-05). The app shows
// "mestre" and "jogador".
enum Role {
  ROLE_UNSPECIFIED = 0;
  // The game master: runs the campaign and manages its invites.
  ROLE_MASTER = 1;
  // A player.
  ROLE_PLAYER = 2;
}

// XpMode is how a campaign awards experience points (RN-09).
enum XpMode {
  XP_MODE_UNSPECIFIED = 0;
  // XP for defeated enemies, split among the group.
  XP_MODE_ENEMIES = 1;
  // XP for gold won.
  XP_MODE_GOLD = 2;
  // The master levels the group up at milestones.
  XP_MODE_MILESTONES = 3;
}

// DiceMode is how a campaign's players roll dice (RN-18). NPCs always roll
// in the app, whatever the mode.
enum DiceMode {
  DICE_MODE_UNSPECIFIED = 0;
  // Each player chooses, with SetMyDicePreference. The default.
  DICE_MODE_PLAYERS_CHOOSE = 1;
  // Everyone rolls in the app; nobody types a result.
  DICE_MODE_APP = 2;
  // Everyone rolls real dice and types the sum.
  DICE_MODE_PHYSICAL = 3;
}

// DicePreference is how one member likes to roll (RN-18). It only counts
// when the campaign's mode is DICE_MODE_PLAYERS_CHOOSE.
enum DicePreference {
  DICE_PREFERENCE_UNSPECIFIED = 0;
  // "No app": the app rolls. The default.
  DICE_PREFERENCE_APP = 1;
  // "Meus próprios dados": the player rolls real dice and types the sum.
  DICE_PREFERENCE_PHYSICAL = 2;
}

// Campaign is a campaign as seen by one of its members.
message Campaign {
  // Stable campaign ID (a UUID).
  string id = 1;
  // The campaign's name, as the master typed it.
  string name = 2;
  XpMode xp_mode = 3;
  google.protobuf.Timestamp created_at = 4;
  // The caller's role in this campaign.
  Role my_role = 5;
  // True when the caller is a pending member (RN-15, MR-024): they accepted
  // an invite that requires approval, and the master has not approved their
  // character yet. Then only id, name, my_role (ROLE_PLAYER) and xp_mode are
  // set (the XP mode is no secret, and the editor needs it); created_at is
  // unset.
  bool awaiting_approval = 6;
  // How the campaign's players roll dice (RN-18). Set for every member;
  // unspecified for a pending member.
  DiceMode dice_mode = 7;
  // The caller's own dice preference in this campaign (RN-18). Only
  // GetCampaign and SetMyDicePreference's callers read it from here; it is
  // unspecified in the other calls that return a Campaign (the list calls
  // do not read it), and for a pending member.
  DicePreference my_dice_preference = 8;
}

// PendingMember is a pending member (RN-15, MR-024) who has not created a
// character yet: someone who accepted an invite with approval and is still
// to start their character.
message PendingMember {
  // The person's account ID (a UUID).
  string user_id = 1;
  // The name the person chose in the app (IdentityService.UpdateProfile).
  // Empty if they have not chosen one yet.
  string display_name = 2;
  // When they accepted the invite.
  google.protobuf.Timestamp joined_at = 3;
  // When the membership is deleted on its own if they still have no
  // character: 30 days after joined_at. The database removes it in a daily
  // job, so it may last up to a day longer. A pending member who creates a
  // character is no longer listed, so this never moves.
  google.protobuf.Timestamp expires_at = 4;
}

// Member is one member of a campaign.
message Member {
  // The member's account ID (a UUID).
  string user_id = 1;
  Role role = 2;
  // The name the member chose in the app (IdentityService.UpdateProfile).
  // Empty if they have not chosen one yet.
  string display_name = 3;
  google.protobuf.Timestamp joined_at = 4;
  // The member's dice preference (RN-18). Only the campaign's master gets
  // it, so the "Dados" panel can list each player's choice: for a player
  // who calls ListMembers it is unspecified. It is a field of Member, not a
  // call of its own, because that panel already lists the members. A
  // member's own preference is in Campaign.my_dice_preference.
  DicePreference dice_preference = 5;
}

// InviteState says whether an invite still works, and why not.
enum InviteState {
  INVITE_STATE_UNSPECIFIED = 0;
  // The invite works.
  INVITE_STATE_ACTIVE = 1;
  // The invite's time ran out.
  INVITE_STATE_EXPIRED = 2;
  // The master revoked the invite.
  INVITE_STATE_REVOKED = 3;
  // The invite was used as many times as it allows.
  INVITE_STATE_USED_UP = 4;
}

// Invite describes an invite without its secret token.
message Invite {
  // Stable invite ID (a UUID), used to revoke it.
  string id = 1;
  // How many people can join with this invite.
  int32 max_uses = 2;
  // How many people joined with it so far.
  int32 use_count = 3;
  google.protobuf.Timestamp created_at = 4;
  // When the invite stops working.
  google.protobuf.Timestamp expires_at = 5;
  // When the master revoked it; unset if they did not.
  google.protobuf.Timestamp revoked_at = 6;
  // Whether the invite works now. When several reasons apply, revoked wins
  // over used up, and used up over expired: "already used" is what warns a
  // player that someone else may have used their link (ADR-0009).
  InviteState state = 7;
  // Whether whoever accepts it becomes a pending member, whose character
  // the master must approve (RN-15, MR-024). See
  // CreateInviteRequest.requires_approval.
  bool requires_approval = 8;
}

// InviteUnusable is the error detail of AcceptInvite's
// `failed_precondition`.
message InviteUnusable {
  // Why the invite cannot be used: expired, revoked or used up.
  InviteState state = 1;
}

// CampaignCreationRefusedReason says why CreateCampaign refused (RN-30).
enum CampaignCreationRefusedReason {
  CAMPAIGN_CREATION_REFUSED_REASON_UNSPECIFIED = 0;
  // The caller is already master of max_campaigns campaigns
  // (`resource_exhausted`).
  CAMPAIGN_CREATION_REFUSED_REASON_LIMIT_REACHED = 1;
  // The server lets only some people create campaigns, and the caller is
  // not one (`permission_denied`).
  CAMPAIGN_CREATION_REFUSED_REASON_NOT_ALLOWED = 2;
}

// CampaignCreationRefused is the error detail of CreateCampaign's refusals.
message CampaignCreationRefused {
  CampaignCreationRefusedReason reason = 1;
  // The most campaigns one account may be master of; set for LIMIT_REACHED.
  int32 max_campaigns = 2;
}

// CreateCampaignRequest describes the new campaign.
message CreateCampaignRequest {
  // 1 to 80 characters after trimming spaces at both ends; no control
  // characters such as line breaks.
  string name = 1;
  // Required.
  XpMode xp_mode = 2;
  // Optional. 1 to 64 characters, chosen once by the app for this action: a retry with the
  // same key and the same request returns what the first call made instead of making another.
  // The key is unique for the user; the same key with another request is `invalid_argument`.
  // Empty: the call is not deduplicated.
  string idempotency_key = 3;
}

// CreateCampaignResponse returns the new campaign.
message CreateCampaignResponse {
  // The new campaign; my_role is ROLE_MASTER.
  Campaign campaign = 1;
}

// ListMyCampaignsRequest is intentionally empty: the session cookie says who
// is asking.
message ListMyCampaignsRequest {}

// ListMyCampaignsResponse lists the caller's campaigns.
message ListMyCampaignsResponse {
  repeated Campaign campaigns = 1;
}

// GetCampaignRequest names a campaign.
message GetCampaignRequest {
  string campaign_id = 1;
}

// GetCampaignResponse returns the campaign.
message GetCampaignResponse {
  Campaign campaign = 1;
}

// ListMembersRequest names a campaign.
message ListMembersRequest {
  string campaign_id = 1;
}

// ListMembersResponse lists the campaign's members.
message ListMembersResponse {
  repeated Member members = 1;
}

// ListPendingMembersRequest names a campaign.
message ListPendingMembersRequest {
  string campaign_id = 1;
}

// ListPendingMembersResponse lists the pending members without a character.
message ListPendingMembersResponse {
  repeated PendingMember members = 1;
}

// RemovePendingMemberRequest names the pending member to remove.
message RemovePendingMemberRequest {
  string campaign_id = 1;
  // The person's account ID, from ListPendingMembers.
  string user_id = 2;
}

// RemovePendingMemberResponse is empty: the membership is gone.
message RemovePendingMemberResponse {}

// CreateInviteRequest describes the new invite. While RN-07 is open, the
// defaults follow ADR-0009: one use, valid for 7 days.
message CreateInviteRequest {
  string campaign_id = 1;
  // How many people can join with the invite: 1 to 20. 0 means 1.
  int32 max_uses = 2;
  // How long the invite works: 5 minutes to 30 days. Unset means 7 days.
  google.protobuf.Duration expires_in = 3;
  // When true, whoever accepts the invite becomes a pending member: they
  // create their character right away, and join the campaign as a player
  // only when the master approves it (RN-15, MR-024; "Exigir aprovação do
  // mestre" in the app). False, the default, lets them in at once, as
  // before.
  bool requires_approval = 4;
}

// CreateInviteResponse returns the invite and, this one time, its token.
message CreateInviteResponse {
  Invite invite = 1;
  // The secret that goes into the link's fragment: /invite#t=<token>.
  // Never log it and never put it in a query string.
  string token = 2;
}

// ListInvitesRequest names a campaign.
message ListInvitesRequest {
  string campaign_id = 1;
}

// ListInvitesResponse lists the campaign's invites. Invites that expired
// more than 30 days ago are deleted and no longer listed.
message ListInvitesResponse {
  repeated Invite invites = 1;
}

// RevokeInviteRequest names the invite to revoke.
message RevokeInviteRequest {
  string campaign_id = 1;
  string invite_id = 2;
}

// RevokeInviteResponse returns the revoked invite.
message RevokeInviteResponse {
  Invite invite = 1;
}

// AcceptInviteRequest carries the invite's token.
message AcceptInviteRequest {
  // The token from the invite link's fragment (/invite#t=<token>).
  string token = 1;
}

// AcceptInviteResponse returns the campaign the caller is now a member of,
// or a pending member of.
message AcceptInviteResponse {
  // The campaign. For an invite with approval, `awaiting_approval` is set
  // and only id, name and my_role come with it (see Campaign).
  Campaign campaign = 1;
  // True when the caller was a member, or a pending member, before this
  // call, and nothing changed. False when they just joined, or when a
  // pending member was just promoted by an invite without approval.
  bool already_member = 2;
}

// SetCampaignDiceModeRequest names the campaign and the new mode.
message SetCampaignDiceModeRequest {
  string campaign_id = 1;
  // Required.
  DiceMode mode = 2;
}

// SetCampaignDiceModeResponse returns the mode now in force.
message SetCampaignDiceModeResponse {
  DiceMode mode = 1;
}

// SetMyDicePreferenceRequest names the campaign and the caller's choice.
message SetMyDicePreferenceRequest {
  string campaign_id = 1;
  // Required.
  DicePreference preference = 2;
}

// SetMyDicePreferenceResponse returns the preference now saved.
message SetMyDicePreferenceResponse {
  DicePreference preference = 1;
}

// TableStyle is "Estilo da mesa" (RN-24, question 76): a preset that fills the
// dice mode, whether a combat starts with a map, and whether new maps have the
// fog on. It is never stored: it is worked out from those three settings, and
// the campaign is PERSONALIZADO when they match no preset.
enum TableStyle {
  TABLE_STYLE_UNSPECIFIED = 0;
  // "Tudo no app": dice in the app, combat with a map, fog on in new maps.
  TABLE_STYLE_TUDO_NO_APP = 1;
  // "Mesa física": physical dice, combat without a map by default, fog off.
  TABLE_STYLE_MESA_FISICA = 2;
  // "Teatro da mente": each player chooses the dice, combat without a map,
  // fog off.
  TABLE_STYLE_TEATRO_DA_MENTE = 3;
  // "Personalizado": the settings match no preset. Never a preset to apply.
  TABLE_STYLE_PERSONALIZADO = 4;
}

// HitPointsRule is how the hit points of a level-up are decided on this table
// (RN-24). The server refuses the method it does not allow.
enum HitPointsRule {
  HIT_POINTS_RULE_UNSPECIFIED = 0;
  // Everybody rolls the hit die (in the app, or typed from a physical die,
  // RN-18); the average is refused.
  HIT_POINTS_RULE_ROLL = 1;
  // Everybody takes the average; a roll is refused.
  HIT_POINTS_RULE_AVERAGE = 2;
  // The player chooses between rolling and the average, at the level-up. The
  // default, and what the app did before this rule existed.
  HIT_POINTS_RULE_PLAYER_CHOOSES = 3;
}

// CriticalRule is what a critical hit does to the damage (RN-24). Stored here;
// the combat applies it to every critical hit (CombatService: RollAttack and
// CastSpell, the SRD's attacks, a creature's and an NPC's), reading it in the
// transaction of each roll, so a change applies from the next roll on.
enum CriticalRule {
  CRITICAL_RULE_UNSPECIFIED = 0;
  // Every damage die of the attack or spell is rolled twice (the SRD's, the
  // default).
  CRITICAL_RULE_DOUBLED_DICE = 1;
  // The dice count as their maximum, and then a set is rolled.
  CRITICAL_RULE_MAX_PLUS_ROLL = 2;
}

// HiddenAreaHitRule is what an area spell does to the hiding of a hidden creature
// it hits (RN-24). The effect is the SRD's and always applies ("each creature in
// the area"); the SRD does not say that an area reveals a hidden creature, so the
// table decides.
enum HiddenAreaHitRule {
  HIDDEN_AREA_HIT_RULE_UNSPECIFIED = 0;
  // The creature appears to the players, as when the master reveals it. The
  // default.
  HIDDEN_AREA_HIT_RULE_REVEAL = 1;
  // The creature takes the effect and stays hidden: the players are not told.
  HIDDEN_AREA_HIT_RULE_KEEP_HIDDEN = 2;
  // When a player's spell hits a hidden creature, the turn waits and the master
  // chooses between the two (CombatService.ResolveHiddenReveal). A spell the
  // master casts asks nothing: the master chooses in the cast itself.
  HIDDEN_AREA_HIT_RULE_ASK = 3;
}

// DeathSaveVisibility is who sees a character's death saves (RN-24). Stored
// here; the combat applies it (CombatService): with OWNER_AND_MASTER, nobody else
// gets the counts, the rolls or the failures a hit at 0 adds, only the state word
// "Caído" ("Estável" and "Morto" stay everybody's, they are results).
enum DeathSaveVisibility {
  DEATH_SAVE_VISIBILITY_UNSPECIFIED = 0;
  // Every player sees them (the default, as today).
  DEATH_SAVE_VISIBILITY_VISIBLE_TO_ALL = 1;
  // Only the character's owner and the master do: they are left out of the
  // screen and the log for everybody else.
  DEATH_SAVE_VISIBILITY_OWNER_AND_MASTER = 2;
}

// AbilityMethods are the ways a player may make a new sheet's ability scores
// (RN-24). At least one is allowed. The standard array, the point buy and 4d6
// come from the SRD 5.2.1 (the 2024 rules, CC BY 4.0, p. 20); typed is ours.
message AbilityMethods {
  // 15, 14, 13, 12, 10 and 8, each given to one ability.
  bool standard_array = 1;
  // 27 points; each score 8 to 15, at most 27 points spent. The cost of a
  // score: 8 = 0, 9 = 1, 10 = 2, 11 = 3, 12 = 4, 13 = 5, 14 = 7, 15 = 9.
  bool point_buy = 2;
  // 4d6, dropping the lowest die of each set; the server rolls and stores the
  // six sets once (CharacterService.RollAbilityScores).
  bool rolled_4d6 = 3;
  // The player types six base scores, 3 to 18, before the race's bonus.
  bool typed = 4;
}

// TableRules are the rules a table chooses (RN-24), the whole content of
// "Regras da mesa" except the XP mode (SetCampaignXpMode), the table's content
// (RN-23) and the maps' grid. The defaults are the SRD's.
message TableRules {
  // How the players roll dice (RN-18); campaigns.dice_mode. Required in
  // SetTableRules.
  DiceMode dice_mode = 1;
  // Whether "Iniciar combate" starts with a map by default (the combat slice
  // 10.5b reads it: StartEncounter without a mode starts a combat on a map when
  // this is true and a combat without a map when it is false). Default true.
  bool combat_starts_with_map = 2;
  // Whether a map created from now on starts with the fog of war on. Maps that
  // exist keep theirs. Default false.
  bool fog_on_new_maps = 3;
  // Required in SetTableRules.
  HitPointsRule hit_points = 4;
  // At least one method true.
  AbilityMethods ability_methods = 5;
  // Required in SetTableRules.
  CriticalRule critical = 6;
  // Required in SetTableRules.
  DeathSaveVisibility death_saves = 7;
  // The table's reminders, shown on "Regras da mesa" and never enforced: for
  // example "Beber uma poção é uma ação bônus". At most 20, each 1 to 200
  // characters on one line, in the order the master wrote them.
  repeated string house_rules = 8;
  // "Talentos": whether the table plays with feats, an optional rule of the
  // game. When true, the guided level-up's Ability Score Improvement step offers
  // a feat in place of the ability increase (the feats the character qualifies
  // for; CharacterService.GetLevelUpOptions). Default false: feats are not used
  // and the level-up is as the SRD's. Read as sent by SetTableRules.
  bool feats_allowed = 9;
  // What a spell of an area does to the hiding of a hidden creature it hits
  // (RN-24, RN-10): the spell always affects the creature, and this decides only
  // whether the players learn of it. Required in SetTableRules (UNSPECIFIED is
  // `invalid_argument`); a campaign that never saved its rules has REVEAL. The
  // combat reads it when each spell is cast, so a change applies from the next
  // spell on.
  HiddenAreaHitRule hidden_area_hits = 10;
  // "Reações dos inimigos": when a player's action against an enemy waits for the
  // master (RN-24). Required in SetTableRules (UNSPECIFIED is `invalid_argument`); a
  // campaign that never saved its rules has ONLY_WHEN_POSSIBLE. Every member reads
  // it, only the master changes it, and the combat reads it at each action, so a
  // change applies from the next action on.
  EnemyReactionsRule enemy_reactions = 11;
}

// EnemyReactionsRule is when the game waits for the master before the result of a
// player's action against an enemy (RN-24, RN-10). A pause that exists only when
// an enemy can react tells the players who can, so the table chooses.
enum EnemyReactionsRule {
  ENEMY_REACTIONS_RULE_UNSPECIFIED = 0;
  // The game waits only when an enemy has a reaction available. The default, and
  // faster; a pause may hint that someone can react.
  ENEMY_REACTIONS_RULE_ONLY_WHEN_POSSIBLE = 1;
  // Every action of a player against an enemy (a hit, a damage, a spell) waits for
  // the master's one-tap answer, "Sem reação" or the reaction, so that the pause
  // says nothing.
  ENEMY_REACTIONS_RULE_ALWAYS = 2;
}

// TableStylePreset is what one "Estilo da mesa" fills in. The app applies a
// preset by copying these three values into the settings it shows, which stay
// editable; the server holds the numbers so the app does none of the rules.
message TableStylePreset {
  // One of the three presets, never PERSONALIZADO.
  TableStyle style = 1;
  DiceMode dice_mode = 2;
  bool combat_starts_with_map = 3;
  bool fog_on_new_maps = 4;
}

// GetTableRulesRequest names the campaign.
message GetTableRulesRequest {
  string campaign_id = 1;
}

// GetTableRulesResponse is the table's rules and the style they make.
message GetTableRulesResponse {
  TableRules rules = 1;
  // The style the saved rules match, or PERSONALIZADO.
  TableStyle style = 2;
  // The three presets, always in the same order (Tudo no app, Mesa física,
  // Teatro da mente).
  repeated TableStylePreset presets = 3;
  // The numbers of the ways of making ability scores, so the app does no rules
  // math. They come from the SRD 5.2.1 (the 2024 rules, CC BY 4.0, p. 20; the same
  // as 2014), except the typed range, which is ours.
  //
  // The standard array: 15, 14, 13, 12, 10 and 8, each given to one ability.
  repeated int32 standard_array = 4;
  // The point buy's cost of each score from 8 to 15, in order (0, 1, 2, 3, 4, 5, 7,
  // 9); point_buy_min_score is the first score of the list.
  repeated int32 point_buy_costs = 5;
  int32 point_buy_min_score = 6;
  // The point buy's budget: 27 points, at most.
  int32 point_buy_budget = 7;
  // The typed range of a base score, before the race's bonus: 3 to 18.
  int32 typed_min_score = 8;
  int32 typed_max_score = 9;
}

// SetTableRulesRequest is the whole of the table's rules.
message SetTableRulesRequest {
  string campaign_id = 1;
  // Required. Every field is read as sent (see TableRules).
  TableRules rules = 2;
}

// SetTableRulesResponse returns what is now in force.
message SetTableRulesResponse {
  TableRules rules = 1;
  // The style the saved rules match, or PERSONALIZADO.
  TableStyle style = 2;
}

// SetCampaignXpModeRequest names the campaign and the new mode.
message SetCampaignXpModeRequest {
  string campaign_id = 1;
  // Required.
  XpMode xp_mode = 2;
  // True to change the mode although XP was already awarded.
  bool confirm = 3;
}

// SetCampaignXpModeResponse returns the mode now in force.
message SetCampaignXpModeResponse {
  XpMode xp_mode = 1;
  // When the mode was last changed with this call, stored: a call that changes
  // nothing returns the time of the real change, so the app can write "mudado
  // em ..." after a reload. Unset when the mode was never changed.
  google.protobuf.Timestamp changed_at = 2;
}

// XpModeChangeBlocked is the error detail of SetCampaignXpMode's
// `failed_precondition`: XP was already awarded, so the change needs `confirm`.
message XpModeChangeBlocked {
  // How many awards stand (not undone), milestones included.
  int32 awards = 1;
  // The XP they gave, summed over the characters. Milestone marks give none.
  int64 total_xp = 2;
}
