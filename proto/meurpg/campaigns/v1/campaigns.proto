syntax = "proto3";

// Package meurpg.campaigns.v1 is about campaigns, who belongs to them, the
// invites that let new players in, and each campaign's document
// (campaign_document.proto).
package meurpg.campaigns.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// CampaignService creates campaigns, lists their members and manages
// invites.
//
// Every method needs a valid session cookie and fails with `unauthenticated`
// without one. Roles are per campaign (RN-05): the same user can be the
// master of one campaign and a player in another. For a campaign the caller
// is not a member of, methods answer `not_found`, exactly as for a campaign
// that does not exist, so nobody learns which campaigns exist. A member
// without the needed role gets `permission_denied`. See ADR-0011.
//
// Pending members (RN-15, MR-024). Accepting an invite that requires
// approval makes the caller a pending member of its campaign: they wait
// for the master to approve the character they create (see
// meurpg.characters.v1.CharacterService.ApproveCharacter). A pending member
// is not a member yet. They see the campaign in ListMyCampaigns and
// through GetCampaign, both with only its name and `awaiting_approval`
// set; every other method answers them `not_found`, exactly as for someone
// who is not in the campaign.
//
// Responses carry `Cache-Control: no-store`, because they describe the
// caller's campaigns.
//
// Reads are marked by their idempotency level. NO_SIDE_EFFECTS, which lets
// clients call a method with HTTP GET, is only for requests with no IDs and
// no personal data (ListMyCampaigns): a GET puts the whole request in the
// URL, and URLs end up in the platform's request logs (docs/privacidade.md).
// Reads whose requests carry an ID are IDEMPOTENT instead: safe to retry,
// documented as reads, and POST-only.
service CampaignService {
  // CreateCampaign creates a campaign; the caller becomes its master
  // (MR-001).
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);

  // ListMyCampaigns lists the campaigns the caller is a member of, newest
  // first, with the caller's role in each. It also lists the campaigns where
  // the caller is a pending member (RN-15, MR-024), with only the id, the
  // name, my_role and `awaiting_approval` set, so the player can find their
  // way back to the campaign while they wait.
  //
  // Its request is empty, so clients may call it with HTTP GET: the URL
  // never carries personal data.
  rpc ListMyCampaigns(ListMyCampaignsRequest) returns (ListMyCampaignsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetCampaign returns one campaign. Any member may call it. It only
  // reads, but stays POST-only, because a GET would put the campaign ID in
  // the URL.
  //
  // A pending member (RN-15, MR-024) may call it too, and gets only the
  // campaign's id, name, my_role (ROLE_PLAYER) and `awaiting_approval` set:
  // enough to show "esperando a aprovação do mestre".
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListMembers lists a campaign's members: the master first, then the
  // players in the order they joined. Any member may call it. It only
  // reads, and is POST-only, like GetCampaign.
  //
  // Pending members (RN-15, MR-024) are not listed: they are not members
  // yet. The master sees who is waiting through their characters
  // (CharacterService.ListCharacters, state PENDING), and the ones who have
  // not created a character yet through ListPendingMembers. A pending
  // member who calls it gets `not_found`. (Those two live in their own calls
  // so that this list keeps meaning "people who are in the campaign".)
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListPendingMembers lists the campaign's pending members who have not
  // created a character yet (RN-15, MR-024), in the order they joined, each
  // with when they joined and when they will be removed automatically (30
  // days after joining). Only the campaign's master may call it. It only
  // reads, and is POST-only, like GetCampaign.
  //
  // It is a call of its own, not extra entries in ListMembers, because those
  // people are not members: ListMembers keeps its meaning, and no screen
  // that reads it can mistake them for players. A pending member who already
  // created a character is not here: the master finds them, and approves or
  // rejects them, through CharacterService.ListCharacters.
  rpc ListPendingMembers(ListPendingMembersRequest) returns (ListPendingMembersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemovePendingMember removes a pending member who has not created a
  // character yet (RN-15, MR-024): their membership is deleted. The person
  // loses nothing else (account, other campaigns), and a new invite brings
  // them back. Only the campaign's master may call it. Removing someone who
  // is already gone is `not_found`, so a repeated call tells the app the
  // list is stale.
  //
  // Errors:
  //   - `not_found`: the campaign is not the caller's to manage (see
  //     authorization), or the user has no membership in it.
  //   - `failed_precondition`: the user is an active member (members are not
  //     removed here), or a pending member who already has a character
  //     (the master rejects it with CharacterService.RejectCharacter).
  rpc RemovePendingMember(RemovePendingMemberRequest) returns (RemovePendingMemberResponse);

  // CreateInvite creates an invite link for a campaign (MR-002). Only the
  // campaign's master may call it.
  //
  // The response carries the invite's secret token, and this is the only
  // time the server ever returns it: the database keeps only a hash. The app
  // shares it as https://<app>/convite#t=<token>. The token goes in the URL
  // fragment, which browsers never send to a server, so it stays out of
  // request logs and Referer headers (ADR-0009).
  //
  // With `requires_approval`, whoever accepts the invite becomes a pending
  // member instead of a player (RN-15, MR-024): see AcceptInvite.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

  // ListInvites lists a campaign's invites, newest first, without their
  // tokens. Only the campaign's master may call it. It only reads, and is
  // POST-only, like GetCampaign.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RevokeInvite stops an invite from working. People who already joined
  // with it stay members. Revoking an invite twice is not an error. Only the
  // campaign's master may call it.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);

  // AcceptInvite makes the caller a player of the invite's campaign
  // (MR-003). The app reads the token from the URL fragment and sends it
  // here, in the request body, never in a URL. A signed-out user does the
  // same through sign-in instead: POST /auth/login with
  // intent=campaign_invite and the token as intent_payload (ADR-0009).
  //
  // It is idempotent for members: a member of the campaign (the master
  // included) gets the campaign back with `already_member` set, whatever
  // the state of the invite, and no use of the invite is spent. This holds
  // for a pending member too, with one exception: a pending member who
  // accepts an invite WITHOUT approval (and that works now) is promoted. It
  // spends one use, the membership becomes active, and the character they
  // created and that waits for approval, if any, is approved: an ordinary
  // invite counts as the master's approval (RN-15). The response then has
  // `already_member` false and the full campaign. If they accept an invite
  // with approval, or one that does not work, they stay pending.
  //
  // Invites with approval (RN-15, MR-024). When the invite has
  // `requires_approval`, the caller becomes a pending member, not a player:
  // the returned campaign has `awaiting_approval` set and only its id, name
  // and my_role. The app takes them straight to creating their character
  // (CharacterService.CreateCharacter), which starts PENDING. They become a
  // player when the master approves that character
  // (CharacterService.ApproveCharacter); if the master rejects it
  // (CharacterService.RejectCharacter), the pending membership is deleted
  // and they need a new invite. Accepting it through sign-in works the same
  // way: a new pending member lands on
  // /campanhas/<campaign_id>/personagens/novo, and someone who was already
  // in the campaign on /campanhas/<campaign_id>.
  //
  // Errors:
  //   - `invalid_argument`: the token is empty.
  //   - `not_found`: no invite has this token.
  //   - `failed_precondition`: the invite expired, was revoked or has no
  //     uses left. The error carries an InviteUnusable detail that says
  //     which, so the app can show a clear message.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
}

// Role is what a member may do in one campaign (RN-05). The app shows
// "mestre" and "jogador".
enum Role {
  ROLE_UNSPECIFIED = 0;
  // The game master: runs the campaign and manages its invites.
  ROLE_MASTER = 1;
  // A player.
  ROLE_PLAYER = 2;
}

// XpMode is how a campaign awards experience points (RN-09).
enum XpMode {
  XP_MODE_UNSPECIFIED = 0;
  // XP for defeated enemies, split among the group.
  XP_MODE_ENEMIES = 1;
  // XP for gold won.
  XP_MODE_GOLD = 2;
  // The master levels the group up at milestones.
  XP_MODE_MILESTONES = 3;
}

// Campaign is a campaign as seen by one of its members.
message Campaign {
  // Stable campaign ID (a UUID).
  string id = 1;
  // The campaign's name, as the master typed it.
  string name = 2;
  XpMode xp_mode = 3;
  google.protobuf.Timestamp created_at = 4;
  // The caller's role in this campaign.
  Role my_role = 5;
  // True when the caller is a pending member (RN-15, MR-024): they accepted
  // an invite that requires approval, and the master has not approved their
  // character yet. Then only id, name and my_role (ROLE_PLAYER) are set:
  // xp_mode is unspecified and created_at is unset.
  bool awaiting_approval = 6;
}

// PendingMember is a pending member (RN-15, MR-024) who has not created a
// character yet: someone who accepted an invite with approval and is still
// to start their character.
message PendingMember {
  // The person's account ID (a UUID).
  string user_id = 1;
  // The name the person chose in the app (IdentityService.UpdateProfile).
  // Empty if they have not chosen one yet.
  string display_name = 2;
  // When they accepted the invite.
  google.protobuf.Timestamp joined_at = 3;
  // When the membership is deleted on its own if they still have no
  // character: 30 days after joined_at. The database removes it in a daily
  // job, so it may last up to a day longer. A pending member who creates a
  // character is no longer listed, so this never moves.
  google.protobuf.Timestamp expires_at = 4;
}

// Member is one member of a campaign.
message Member {
  // The member's account ID (a UUID).
  string user_id = 1;
  Role role = 2;
  // The name the member chose in the app (IdentityService.UpdateProfile).
  // Empty if they have not chosen one yet.
  string display_name = 3;
  google.protobuf.Timestamp joined_at = 4;
}

// InviteState says whether an invite still works, and why not.
enum InviteState {
  INVITE_STATE_UNSPECIFIED = 0;
  // The invite works.
  INVITE_STATE_ACTIVE = 1;
  // The invite's time ran out.
  INVITE_STATE_EXPIRED = 2;
  // The master revoked the invite.
  INVITE_STATE_REVOKED = 3;
  // The invite was used as many times as it allows.
  INVITE_STATE_USED_UP = 4;
}

// Invite describes an invite without its secret token.
message Invite {
  // Stable invite ID (a UUID), used to revoke it.
  string id = 1;
  // How many people can join with this invite.
  int32 max_uses = 2;
  // How many people joined with it so far.
  int32 use_count = 3;
  google.protobuf.Timestamp created_at = 4;
  // When the invite stops working.
  google.protobuf.Timestamp expires_at = 5;
  // When the master revoked it; unset if they did not.
  google.protobuf.Timestamp revoked_at = 6;
  // Whether the invite works now. When several reasons apply, revoked wins
  // over used up, and used up over expired: "already used" is what warns a
  // player that someone else may have used their link (ADR-0009).
  InviteState state = 7;
  // Whether whoever accepts it becomes a pending member, whose character
  // the master must approve (RN-15, MR-024). See
  // CreateInviteRequest.requires_approval.
  bool requires_approval = 8;
}

// InviteUnusable is the error detail of AcceptInvite's
// `failed_precondition`.
message InviteUnusable {
  // Why the invite cannot be used: expired, revoked or used up.
  InviteState state = 1;
}

// CreateCampaignRequest describes the new campaign.
message CreateCampaignRequest {
  // 1 to 80 characters after trimming spaces at both ends; no control
  // characters such as line breaks.
  string name = 1;
  // Required.
  XpMode xp_mode = 2;
}

// CreateCampaignResponse returns the new campaign.
message CreateCampaignResponse {
  // The new campaign; my_role is ROLE_MASTER.
  Campaign campaign = 1;
}

// ListMyCampaignsRequest is intentionally empty: the session cookie says who
// is asking.
message ListMyCampaignsRequest {}

// ListMyCampaignsResponse lists the caller's campaigns.
message ListMyCampaignsResponse {
  repeated Campaign campaigns = 1;
}

// GetCampaignRequest names a campaign.
message GetCampaignRequest {
  string campaign_id = 1;
}

// GetCampaignResponse returns the campaign.
message GetCampaignResponse {
  Campaign campaign = 1;
}

// ListMembersRequest names a campaign.
message ListMembersRequest {
  string campaign_id = 1;
}

// ListMembersResponse lists the campaign's members.
message ListMembersResponse {
  repeated Member members = 1;
}

// ListPendingMembersRequest names a campaign.
message ListPendingMembersRequest {
  string campaign_id = 1;
}

// ListPendingMembersResponse lists the pending members without a character.
message ListPendingMembersResponse {
  repeated PendingMember members = 1;
}

// RemovePendingMemberRequest names the pending member to remove.
message RemovePendingMemberRequest {
  string campaign_id = 1;
  // The person's account ID, from ListPendingMembers.
  string user_id = 2;
}

// RemovePendingMemberResponse is empty: the membership is gone.
message RemovePendingMemberResponse {}

// CreateInviteRequest describes the new invite. While RN-07 is open, the
// defaults follow ADR-0009: one use, valid for 7 days.
message CreateInviteRequest {
  string campaign_id = 1;
  // How many people can join with the invite: 1 to 20. 0 means 1.
  int32 max_uses = 2;
  // How long the invite works: 5 minutes to 30 days. Unset means 7 days.
  google.protobuf.Duration expires_in = 3;
  // When true, whoever accepts the invite becomes a pending member: they
  // create their character right away, and join the campaign as a player
  // only when the master approves it (RN-15, MR-024; "Exigir aprovação do
  // mestre" in the app). False, the default, lets them in at once, as
  // before.
  bool requires_approval = 4;
}

// CreateInviteResponse returns the invite and, this one time, its token.
message CreateInviteResponse {
  Invite invite = 1;
  // The secret that goes into the link's fragment: /convite#t=<token>.
  // Never log it and never put it in a query string.
  string token = 2;
}

// ListInvitesRequest names a campaign.
message ListInvitesRequest {
  string campaign_id = 1;
}

// ListInvitesResponse lists the campaign's invites. Invites that expired
// more than 30 days ago are deleted and no longer listed.
message ListInvitesResponse {
  repeated Invite invites = 1;
}

// RevokeInviteRequest names the invite to revoke.
message RevokeInviteRequest {
  string campaign_id = 1;
  string invite_id = 2;
}

// RevokeInviteResponse returns the revoked invite.
message RevokeInviteResponse {
  Invite invite = 1;
}

// AcceptInviteRequest carries the invite's token.
message AcceptInviteRequest {
  // The token from the invite link's fragment (/convite#t=<token>).
  string token = 1;
}

// AcceptInviteResponse returns the campaign the caller is now a member of,
// or a pending member of.
message AcceptInviteResponse {
  // The campaign. For an invite with approval, `awaiting_approval` is set
  // and only id, name and my_role come with it (see Campaign).
  Campaign campaign = 1;
  // True when the caller was a member, or a pending member, before this
  // call, and nothing changed. False when they just joined, or when a
  // pending member was just promoted by an invite without approval.
  bool already_member = 2;
}
