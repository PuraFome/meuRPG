# Code generation for the Go backend and the Angular frontend. Run from this
# directory: `buf generate`. The TypeScript plugin needs web/node_modules, so
# run `npm ci --ignore-scripts` in web/ first (`make proto` does this).
# Docs: https://buf.build/docs/configuration/v2/buf-gen-yaml/
version: v2
# Delete the output directory before generating, so files for removed
# .proto files do not linger.
clean: true
managed:
  enabled: true
  override:
    # Every .proto maps to a Go package under backend/gen, e.g.
    # meurpg/system/v1 -> github.com/PuraFome/meuRPG/backend/gen/meurpg/system/v1
    - file_option: go_package_prefix
      value: github.com/PuraFome/meuRPG/backend/gen
plugins:
  # The plugins are pinned as `tool` directives in backend/go.mod, so
  # everyone (and CI) generates with exactly the same versions and nobody
  # has to install protoc-gen-* binaries. `go -C ../backend` makes the go
  # command use backend/go.mod.
  - local: ["go", "-C", "../backend", "tool", "protoc-gen-go"]
    out: ../backend/gen
    opt: paths=source_relative
  - local: ["go", "-C", "../backend", "tool", "protoc-gen-connect-go"]
    out: ../backend/gen
    opt: paths=source_relative
  # Connect-ES v2: protoc-gen-es alone generates the message types *and* the
  # service definitions (no separate protoc-gen-connect-es plugin needed).
  # The binary is a local dev dependency of web/, not a global install.
  - local: ["../web/node_modules/.bin/protoc-gen-es"]
    out: ../web/src/gen
    opt: target=ts
