<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>MeuRPG</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The brand's d20 (docs/design.md#logo-and-icons). The .ico says 32x32 so that a browser that
       reads SVG prefers favicon.svg, which turns light in the dark theme. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1f29" media="(prefers-color-scheme: dark)" />
    <!-- Private app: the load balancer sends X-Robots-Tag too; robots.txt asks the same. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Self-hosted Material Symbols (see docs/architecture.md#web-app-web):
       the app.config.ts registers 'material-symbols-outlined' as
       MatIconRegistry's default font set class, and this file is what
       supplies it. No Google Fonts: font-src 'self' would block it, and
       docs/privacy.md forbids a third-party font request on every
       page load anyway. -->
    <link rel="stylesheet" href="material-symbols/outlined.css" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
