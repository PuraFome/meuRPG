<!-- The live region stays in the page once the shell has drawn it (the app loads this component when the browser is idle),
     so a notice that starts later is announced when it appears (role="status": polite, it never interrupts). -->
<div role="status">
  @for (s of sessions(); track s.sessionId) {
    <div class="live-notice">
      <mat-icon class="live-notice__icon" aria-hidden="true">sensors</mat-icon>
      <div class="live-notice__body">
        <p class="live-notice__text">
          <strong>A sessão {{ s.sessionNumber }} de {{ s.campaignName }} começou.</strong>
        </p>
        <!-- The link lays its children out as flex items, and a flex item drops the space that starts its line: the label is
             one item, with "na sessão" inside it, so the space between the two words stays. -->
        <a
          class="live-notice__action"
          [routerLink]="['/campaigns', s.campaignId, 'session']"
          [attr.aria-label]="'Entrar na sessão ' + s.sessionNumber + ' de ' + s.campaignName"
          (click)="dismiss(s.sessionId)"
          ><span>Entrar<span class="live-notice__more"> na sessão</span></span></a
        >
      </div>
      <button
        type="button"
        class="live-notice__close"
        aria-label="Fechar aviso"
        (click)="dismiss(s.sessionId)"
      >
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>
  }
</div>
