<div class="mv-wrap" [style.--mv-ar]="ratio()">
  <div
    #viewport
    class="mv"
    [class.mv--interactive]="interactive()"
    [class.mv--zoomed]="scale() > 1"
    [class.mv--placing]="placing()"
    [style.aspect-ratio]="aspect()"
    [attr.role]="interactive() ? 'group' : 'img'"
    [attr.aria-label]="(interactive() ? 'Mapa ' : 'Prévia do mapa ') + mapName()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (wheel)="onWheel($event)"
    (click)="onClick($event)"
    (keydown)="onKeydown($event)"
    (keyup)="onKeyup($event)"
    (pointerover)="raise($event)"
    (pointerout)="lower()"
    (focusin)="raise($event)"
    (focusout)="lower()"
  >
    <div class="mv__stage" [style.transform]="transformCss()" [style.--s]="transform().scale">
      <img
        class="mv__img"
        [src]="image().url"
        alt=""
        [width]="image().width"
        [height]="image().height"
        draggable="false"
        decoding="async"
      />

      @for (p of shownPoints(); track p.id) {
        <app-map-marker
          [point]="p"
          [at]="pointAt(p)"
          [interactive]="pointsOpen()"
          [selected]="selectedKey() === 'point:' + p.id"
          [raised]="raisedKey() === 'point:' + p.id"
        />
      }
      @for (t of shownTokens(); track t.characterId) {
        <app-map-token
          [token]="t"
          [initial]="initial(t)"
          [at]="tokenAt(t)"
          [interactive]="tokensMovable()"
          [selected]="selectedKey() === 'token:' + t.characterId"
          [raised]="raisedKey() === 'token:' + t.characterId"
        />
      }
      @for (p of shownPoints(); track p.id) {
        <span
          class="lbl"
          aria-hidden="true"
          [attr.data-side]="side(p)"
          [class.lbl--hidden]="!p.revealed"
          [class.lbl--selected]="selectedKey() === 'point:' + p.id"
          [class.lbl--raised]="raisedKey() === 'point:' + p.id"
          [style.left.%]="labelLeft(p)"
          [style.top.%]="labelTop(p)"
        >
          <span class="lbl__pill">
            {{ p.name }}
            @if (!p.revealed) {
              <span class="lbl__state"><mat-icon>visibility_off</mat-icon>Escondido</span>
            }
          </span>
        </span>
      }
    </div>

    @if (hint(); as text) {
      <p class="mv__hint"><mat-icon aria-hidden="true">near_me</mat-icon>{{ text }}</p>
    }
  </div>

  @if (controls() === 'overlay' && interactive()) {
    <div class="mv__controls" role="group" aria-label="Zoom do mapa">
      <button
        type="button"
        class="mv__btn"
        aria-label="Reduzir"
        [disabled]="scale() <= 1"
        (click)="zoomOut()"
      >
        <mat-icon aria-hidden="true">remove</mat-icon>
      </button>
      <button
        type="button"
        class="mv__btn mv__btn--in"
        aria-label="Ampliar"
        [disabled]="scale() >= 4"
        (click)="zoomIn()"
      >
        <mat-icon aria-hidden="true">add</mat-icon>
      </button>
      <button
        type="button"
        class="mv__btn"
        aria-label="Ajustar à tela"
        [disabled]="scale() === 1"
        (click)="fit()"
      >
        <mat-icon aria-hidden="true">fit_screen</mat-icon>
      </button>
    </div>
  }
</div>
