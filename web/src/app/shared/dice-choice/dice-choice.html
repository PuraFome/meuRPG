<div class="dice-choice" role="radiogroup" [attr.aria-label]="label()">
  @for (o of options(); track o.value) {
    <label class="dice-choice__card" [class.dice-choice__card--off]="disabled() && value() !== o.value">
      <input
        type="radio"
        class="mr-visually-hidden"
        [name]="name()"
        [value]="o.value"
        [checked]="value() === o.value"
        [disabled]="disabled()"
        (change)="value.set(o.value)"
      />
      <span class="dice-choice__dot" aria-hidden="true"></span>
      <span class="dice-choice__text">
        <span class="dice-choice__title">{{ o.title }}</span>
        <span class="dice-choice__desc">{{ notes()[o.value] ?? o.description }}</span>
      </span>
    </label>
  }
</div>
