<div class="dice-choice" [class.dice-choice--grid]="grid()" role="radiogroup" [attr.aria-label]="label()">
  @for (o of options(); track o.value) {
    <label class="dice-choice__card" [class.dice-choice__card--off]="(disabled() && value() !== o.value) || (isInert(o.value) && value() !== o.value)">
      <input
        type="radio"
        class="mr-visually-hidden"
        [name]="name()"
        [value]="o.value"
        [checked]="value() === o.value"
        [disabled]="disabled() || isInert(o.value)"
        (change)="value.set(o.value)"
      />
      <span class="dice-choice__dot" aria-hidden="true"></span>
      <span class="dice-choice__text">
        <span class="dice-choice__title">{{ o.title }}</span>
        <span class="dice-choice__desc">{{ notes()[o.value] ?? o.description }}</span>
        @if (reasons()[o.value]; as why) {
          <span class="dice-choice__reason"><mat-icon aria-hidden="true">block</mat-icon>{{ why }}</span>
        }
      </span>
    </label>
  }
</div>
