@if (drawn().length) {
  <svg class="zl__svg" preserveAspectRatio="none" [attr.viewBox]="'0 0 ' + columns() + ' ' + rows()">
    <defs>
      @for (p of patterns; track $index) {
        <pattern [attr.id]="uid + '-' + $index" patternUnits="userSpaceOnUse" [attr.width]="tile" [attr.height]="tile">
          <path [attr.d]="p.d" [class]="'zl__' + p.tint" />
        </pattern>
      }
    </defs>
    @for (z of drawn(); track z.id) {
      <g class="zl__zone" [class.zl__zone--dashed]="z.dashed">
        <path class="zl__fill" [attr.d]="z.fill" />
        <path class="zl__pat" [attr.d]="z.fill" [attr.fill]="'url(#' + uid + '-' + z.pattern + ')'" />
        <path class="zl__halo" [attr.d]="z.edge" />
        <path [class]="'zl__edge zl__' + z.tint" [attr.d]="z.edge" />
      </g>
    }
  </svg>
  @for (z of drawn(); track z.id) {
    <span
      class="zl__label"
      [class.zl__label--below]="z.below"
      [class.zl__label--hidden]="z.dashed"
      [style.left.%]="(z.x / columns()) * 100"
      [style.top.%]="(z.y / rows()) * 100"
    >
      @if (z.dashed) {
        <mat-icon>visibility_off</mat-icon>
      }
      {{ z.label }}
      @if (z.concentration) {
        <mat-icon>psychology</mat-icon>
      }
    </span>
  }
}
