<header class="app-bar">
  <a class="app-bar__brand" routerLink="/">MeuRPG</a>

  @if (liveSession(); as live) {
    <a
      class="app-bar__live app-bar__live--phone"
      [routerLink]="['/campanhas', live.campaignId, 'sessao']"
      [attr.aria-label]="liveLabel(live)"
      ><app-live-pill
    /></a>
  }

  <ng-container #notesSlot />

  <button
    type="button"
    class="app-bar__toggle"
    aria-controls="app-bar-menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Fechar o menu' : 'Abrir o menu'"
    (click)="toggleMenu()"
  >
    <mat-icon aria-hidden="true">{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <div id="app-bar-menu" class="app-bar__menu" [class.app-bar__menu--open]="menuOpen()">
    <nav class="app-bar__nav" aria-label="Principal">
      <a
        class="app-bar__link"
        routerLink="/"
        routerLinkActive="app-bar__link--active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        >Início</a
      >
      <a
        class="app-bar__link"
        routerLink="/campanhas"
        routerLinkActive="app-bar__link--active"
        ariaCurrentWhenActive="page"
        >Minhas campanhas</a
      >
    </nav>
    <ng-container #notesSlot />
    @if (liveSession(); as live) {
      <a
        class="app-bar__live app-bar__live--wide"
        [routerLink]="['/campanhas', live.campaignId, 'sessao']"
        [attr.aria-label]="liveLabel(live)"
        ><app-live-pill
      /></a>
    }
    <app-user-menu class="app-bar__user" />
  </div>
</header>

<main class="app-content">
  <app-live-notice [url]="url()" />
  <router-outlet />
</main>

<footer class="app-footer">
  <a routerLink="/creditos">Créditos</a>
</footer>
