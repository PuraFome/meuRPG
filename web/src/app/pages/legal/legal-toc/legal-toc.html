<nav aria-label="Nesta página">
  <details>
    <summary>
      Nesta página
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 9l6 6 6-6" />
      </svg>
    </summary>
    <ol>
      @for (section of sections(); track section.id; let n = $index) {
        <li>
          <a [routerLink]="[]" [fragment]="section.id" (click)="go(section.id)">
            <span class="toc__n" aria-hidden="true">{{ n + 1 }}</span>
            {{ label(section) }}
          </a>
        </li>
      }
    </ol>
  </details>
</nav>
