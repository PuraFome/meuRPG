<mat-card class="status-card status-card--error" role="alert">
  <mat-card-header>
    <mat-card-title>Servidor indisponível</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Não foi possível confirmar sua sessão agora. Isso não é a mesma coisa que estar sem login —
      tente de novo em instantes.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="retry()">Tentar de novo</button>
  </mat-card-actions>
</mat-card>
