<h1 class="mr-page-title">Servidor indisponível</h1>

<div class="server-unavailable-page">
  <div class="mr-notice mr-notice--danger" role="alert">
    <mat-icon aria-hidden="true">error</mat-icon>
    <p>
      Não foi possível confirmar sua sessão agora. Isso não é a mesma coisa que estar sem login —
      tente de novo em instantes.
    </p>
  </div>

  <button mat-flat-button type="button" (click)="retry()">Tentar de novo</button>
</div>
