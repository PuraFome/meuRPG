<mat-card class="status-card status-card--error" role="alert">
  <mat-card-header>
    <h1 mat-card-title>Não foi possível aceitar o convite</h1>
  </mat-card-header>
  <mat-card-content>
    <p>{{ message() }}</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button routerLink="/">Voltar para o início</a>
  </mat-card-actions>
</mat-card>
