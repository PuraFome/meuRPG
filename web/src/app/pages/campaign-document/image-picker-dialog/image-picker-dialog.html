<app-doc-dialog
  size="wide"
  icon="image"
  heading="Imagem da galeria"
  subtitle="Escolha a imagem que o documento vai mostrar, com a legenda embaixo."
  (closed)="closed.emit()"
>
  <app-gallery-picker
    [campaignId]="campaignId()"
    [(selectedId)]="imageId"
    label="Imagem da galeria"
    (picked)="choose($event)"
  />
  @if (asking()) {
    <section class="ask" role="group" aria-labelledby="doc-whole-map-t">
      <h3 class="ask__title" id="doc-whole-map-t">Inserir o mapa inteiro?</h3>
      <p class="ask__text">
        <mat-icon aria-hidden="true">warning</mat-icon>Esta imagem mostra o mapa inteiro, também o que os jogadores ainda não descobriram, e os jogadores leem o documento.
      </p>
    </section>
  }
  <button #firstAnswer dialogFooter matButton type="button" (click)="asking() ? back() : closed.emit()">{{ asking() ? 'Voltar' : 'Cancelar' }}</button>
  <button
    dialogFooter
    [matButton]="asking() ? 'filled' : 'outlined'"
    type="button"
    [disabled]="imageId() === null"
    (click)="insert()"
  >
    {{ asking() ? 'Inserir mesmo assim' : 'Inserir imagem' }}
  </button>
</app-doc-dialog>
