@if (creatures(); as list) {
  @if (list.length > 0) {
    <div class="cr__list">
      @for (c of list; track c.id) {
        <div class="item">
          <div class="item__row">
            <app-creature-art class="item__art" [monsterKey]="c.monsterKey" />
            <span class="item__name">{{ c.name }}</span>
            <span class="item__sub">{{ c.monsterNamePt }} · {{ sourceShort(c.source) }}</span>
          </div>
          @if (asking() === c.id) {
            <app-creature-edit
              [campaignId]="campaignId()"
              [creature]="c"
              mode="dismiss"
              [ownerView]="false"
              [ownerName]="characterName()"
              (closed)="closed($event, c.id)"
            />
          } @else {
            <button type="button" class="dismiss" [id]="'dismiss-' + c.id" (click)="ask(c.id)">
              <mat-icon aria-hidden="true">close</mat-icon>Dispensar {{ c.name }}
            </button>
          }
        </div>
      }
    </div>
  }
} @else if (failed()) {
  <p class="none">Não deu para ler as criaturas.</p>
}
