<app-fold title="Ganchos e anotações" [region]="true" [open]="open()" (openChange)="choice.set($event)">
  <span foldNote class="sh__lock"><mat-icon aria-hidden="true">lock</mat-icon>Só você vê</span>
  @if (empty()) {
    <p class="sh__none">Esta cena não tem ganchos. Escreva no editor do mapa.</p>
  } @else {
    <div class="sh__text"><app-markdown [source]="hooks()" idPrefix="sh-md-" /></div>
  }
</app-fold>
