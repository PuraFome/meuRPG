@if (scene(); as s) {
  <section class="so mr-panel" aria-labelledby="so-title">
    <app-scene-who [campaignId]="campaignId()" [state]="state()" />

    <div class="so__head">
      <div class="so__titles">
        <h2 #heading class="so__title" id="so-title" tabindex="-1">Cena: {{ sceneName() }}</h2>
        <p class="so__meta">{{ meta() }}</p>
      </div>
      <div class="so__buttons">
        <button matButton type="button" (click)="swap()">
          <mat-icon aria-hidden="true">swap_horiz</mat-icon>Trocar cena
        </button>
        <button matButton type="button" [disabled]="busy()" disabledInteractive (click)="close()">
          <mat-icon aria-hidden="true">close</mat-icon>Fechar cena
        </button>
      </div>
    </div>

    @if (error()) {
      <div class="mr-notice mr-notice--danger" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon>
        <p>{{ error() }}</p>
      </div>
    }

    <app-stage-master class="so__part" [campaignId]="campaignId()" [state]="state()" />

    <div class="so__part so__images">
      <app-scene-images-show
        [campaignId]="campaignId()"
        [images]="s.images"
        [shown]="shown()"
        [keep]="keep()"
        [audience]="state().audience()"
        (changed)="shownChange.emit($event)"
        (leftChanged)="leftChanged.emit()"
      >
        <ng-content select="[galleryTile]" ngProjectAs="[galleryTile]" />
      </app-scene-images-show>
      <!-- "Deixar com os jogadores" and "Parar de mostrar" on one line under the thumbnails. -->
      <ng-content select="[sceneImageTools]" />
    </div>

    <app-scene-actions class="so__part" [campaignId]="campaignId()" [state]="state()" [scene]="s" [mapId]="actionsMapId()" [(groupAsk)]="groupAsk">
      <ng-content select="[sceneTools]" />
    </app-scene-actions>

    <app-scene-clues class="so__part" [campaignId]="campaignId()" [state]="state()" [players]="players()" [phone]="phone()" />

    <app-scene-hooks [hooks]="s.hooks" [phone]="phone()" />

    <p class="mr-visually-hidden so__live" role="status" aria-live="polite">{{ state().notice() }}</p>
  </section>
}
