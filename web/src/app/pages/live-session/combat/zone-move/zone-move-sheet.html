<app-sheet-frame [title]="title()" [subtitle]="subtitle()" [phone]="inSheet" (closed)="close()">
  @if (zone(); as z) {
    <div class="body">
      <app-zone-move-map
        [image]="data.map.image"
        [mapName]="data.map.mapName"
        [columns]="data.map.columns"
        [rows]="data.map.rows"
        [layers]="data.map.layers"
        [fog]="data.map.fog"
        [combatants]="combatants()"
        [zone]="z"
        [master]="data.master"
        [picked]="picked()"
        (pick)="picked.set($event)"
        (confirm)="move()"
      />
      @if (summary(); as s) {
        <div class="summary">
          <strong>{{ s.text }}</strong>
          @if (s.range && !s.refused) {
            <span>{{ s.range }}</span>
          }
          <span>Quem fica na nova área faz o teste na primeira vez que estiver ali num turno.</span>
        </div>
      }
      @if (error()) {
        <div class="mr-notice mr-notice--danger" role="alert">
          <mat-icon aria-hidden="true">error</mat-icon>
          <p>{{ error() }}</p>
        </div>
      }
    </div>
  } @else {
    <p class="gone">Essa zona não existe mais. A tela foi atualizada.</p>
  }

  <div foot class="foot">
    <button matButton="filled" type="button" class="btn" [class.mr-button--off]="!ready() || busy()" [disabled]="!ready() || busy()" disabledInteractive (click)="move()">
      Mover a zona
    </button>
    <button matButton="outlined" type="button" class="btn" [disabled]="busy()" (click)="close()">Cancelar</button>
  </div>
</app-sheet-frame>
