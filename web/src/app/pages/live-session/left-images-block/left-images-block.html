@if (images().length > 0) {
  <!-- A fold of one row on a phone ("Imagens que o mestre deixou (2)"); open at once beside the scene on a computer. -->
  <app-fold
    class="left"
    appearance="row"
    icon="image"
    [level]="2"
    [region]="true"
    [foldable]="phone()"
    [title]="title()"
  >
    <ul class="left__grid">
      @for (image of images(); track image.id) {
        <li>
          <button
            type="button"
            class="thumb"
            [attr.aria-label]="'Ver ' + image.name + ' em tela cheia'"
            (click)="openFull(image)"
          >
            <img class="thumb__img" [src]="thumb(image)" alt="" width="96" height="72" loading="lazy" />
            <span class="thumb__name">{{ image.name }}</span>
          </button>
        </li>
      }
    </ul>
  </app-fold>
}
