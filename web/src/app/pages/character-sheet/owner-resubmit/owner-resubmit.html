@if (error(); as e) {
  <div class="mr-notice mr-notice--danger" role="alert">
    <mat-icon aria-hidden="true">error</mat-icon>
    <p>{{ e }}</p>
  </div>
}
<div class="oc__actions">
  <button matButton="filled" type="button" [disabled]="busy()" (click)="resubmit.emit()">
    Enviar de novo
  </button>
  @if (editLink(); as link) {
    <a matButton="outlined" [routerLink]="link">
      <mat-icon aria-hidden="true">edit</mat-icon>Editar ficha
    </a>
  }
</div>
