# Keeps dependencies (including pinned GitHub Action SHAs and image digests)
# current. Majors that need a deliberate step (a migration, or matching the
# runtime) are ignored here and done by hand; see CONTRIBUTING.md.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions: this is what keeps our SHA pins from going stale.
  # Dependabot bumps the SHA and updates the "# vX.Y.Z" comment for us.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend Go module.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The web app (web/). The repository root's package.json is the old,
  # deprecated app (src/), which is frozen until it is removed, so it gets
  # no updates.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # A new Angular major comes with `ng update` and its migrations, and
      # it moves the TypeScript and vitest ranges Angular accepts: all by
      # hand.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The unit tests run through Angular's builder (@angular/build), which
      # accepts one vitest major at a time: it moves with Angular.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node major the app is built with (22, in
      # CI and in backend/Dockerfile), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Playwright tests (e2e/). A new @playwright/test also moves the Chromium
  # build CI downloads, since the lockfile pins both.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    groups:
      e2e-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The tests run on Node 22 (CI's setup-node); newer types would
      # accept APIs that don't exist there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Base images of the production image and of devidp, pinned by digest.
  # Patch releases and new digests (security fixes) come here; a new Node
  # or Go version goes together with CI and go.mod, by hand. The
  # CockroachDB image is not here on purpose: deploy/local/compose.yaml and
  # the go-db job in .github/workflows/backend.yml pin the same digest, and
  # it changes in both at once, by hand.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/deploy/local"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
