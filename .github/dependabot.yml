# Keeps dependencies (including pinned GitHub Action SHAs and image digests)
# current. Majors that need a deliberate step (a migration, or matching the
# runtime) are ignored here and done by hand; see CONTRIBUTING.md.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions: this is what keeps our SHA pins from going stale.
  # Dependabot bumps the SHA and updates the "# vX.Y.Z" comment for us.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # publish is usually yanked before it reaches us (security updates
    # ignore the cooldown).
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend Go module.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # publish is usually yanked before it reaches us (security updates
    # ignore the cooldown).
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The web app (web/).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # publish is usually yanked before it reaches us (security updates
    # ignore the cooldown).
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # A new Angular major comes with `ng update` and its migrations, and
      # it moves the TypeScript and vitest ranges Angular accepts: all by
      # hand.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The unit tests run through Angular's builder (@angular/build), which
      # accepts one vitest major at a time: it moves with Angular.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # The coverage provider must match vitest's major.
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # angular-eslint's major follows Angular's (21.x for Angular 21).
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node major the app is built with (22, in
      # CI and in backend/Dockerfile), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Playwright tests (e2e/). A new @playwright/test also moves the Chromium
  # build CI downloads, since the lockfile pins both.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # publish is usually yanked before it reaches us (security updates
    # ignore the cooldown).
    cooldown:
      default-days: 7
    groups:
      e2e-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The tests run on Node 22 (CI's setup-node); newer types would
      # accept APIs that don't exist there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The linter of the Playwright tests (e2e/lint/): its own package, because
  # typescript-eslint needs TypeScript 5.x while e2e/ type-checks with 7.
  - package-ecosystem: "npm"
    directory: "/e2e/lint"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      e2e-lint-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stays on TypeScript 5.x until typescript-eslint supports the next major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Base images of the production image and of devidp, pinned by digest.
  # Patch releases and new digests (security fixes) come here; a new Node
  # or Go version goes together with CI, go.mod and .node-version, by hand.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/deploy/local"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # publish is usually yanked before it reaches us (security updates
    # ignore the cooldown).
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The CockroachDB image in the local stack, pinned by digest. The go-db job
  # in .github/workflows/backend.yml pins the same digest: when this opens a
  # PR, change COCKROACH_IMAGE there in the same PR (and the version in the
  # Makefile and in CONTRIBUTING.md).
  - package-ecosystem: "docker-compose"
    directory: "/deploy/local"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Only patches come here. A new release line is an upgrade made by hand:
      # the project follows CockroachDB's Regular lines (26.2, 26.4...) and
      # skips the Innovation ones (26.3: no LTS, six months of support), and
      # the line moves together in CI, the Makefile and the Homebrew formula.
      - dependency-name: "cockroachdb/cockroach"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
