# Gets a runner ready to run Playwright against the local stack: the images of build-e2e-images, the stack itself
# (CockroachDB, migrations, devidp, API), Node, the e2e dependencies and Chromium, as the `e2e` job of e2e.yml does.
# The stack starts in the background while Node, the dependencies and Chromium install, and the last step waits for it:
# the stack needs none of them. The action ends only when the stack is up, or fails with the stack's log.
name: Start the e2e stack
description: Load the images and start the local stack while the e2e dependencies and Chromium install.
inputs:
  code-dir:
    description: The checkout whose stack and tests run.
    default: "."
  artifact:
    description: The name of the artifact build-e2e-images uploaded.
    required: true
  npm-cache:
    description: Set to "npm" to restore and save the npm cache. Empty (the default) caches nothing, for the workflows that run refs that are not main's.
    default: ""
runs:
  using: composite
  steps:
    - name: Download the images
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/images

    - name: Start the stack in the background
      working-directory: ${{ inputs.code-dir }}
      shell: bash
      env:
        IMAGES_DIR: ${{ runner.temp }}/images
        STACK_DIR: ${{ runner.temp }}/stack
      run: |
        mkdir -p "$STACK_DIR"
        # The script keeps its output in a file and its exit code in another, and holds none of this step's pipes.
        cat >"$STACK_DIR/start.sh" <<'SCRIPT'
        (
          set -euo pipefail
          docker load --input "$IMAGES_DIR/api.tar"
          docker load --input "$IMAGES_DIR/devidp.tar"
          docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml up --no-build --detach
        ) >"$STACK_DIR/log" 2>&1
        echo "$?" >"$STACK_DIR/status"
        SCRIPT
        setsid bash "$STACK_DIR/start.sh" >/dev/null 2>&1 </dev/null &
        echo "$!" >"$STACK_DIR/pid"

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.code-dir }}/.node-version
        cache: ${{ inputs.npm-cache }}
        cache-dependency-path: ${{ inputs.code-dir }}/e2e/package-lock.json

    - name: Install the e2e dependencies (no install scripts)
      working-directory: ${{ inputs.code-dir }}/e2e
      shell: bash
      run: npm ci --ignore-scripts

    - name: Install Chromium for Playwright
      working-directory: ${{ inputs.code-dir }}/e2e
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Wait for the stack
      # Runs even when an install failed, so the background start never outlives the action.
      if: ${{ always() }}
      working-directory: ${{ inputs.code-dir }}
      shell: bash
      env:
        STACK_DIR: ${{ runner.temp }}/stack
      run: |
        # The start step did not run (the download failed): there is no stack to wait for.
        if [ ! -f "$STACK_DIR/pid" ]; then exit 0; fi
        # Returns when the background start has exited, whichever way.
        tail --pid="$(cat "$STACK_DIR/pid")" --follow /dev/null
        status=$(cat "$STACK_DIR/status" 2>/dev/null || echo 1)
        if [ "$status" = 0 ]; then
          echo "::group::Start of the stack"
          cat "$STACK_DIR/log"
          echo "::endgroup::"
        else
          cat "$STACK_DIR/log"
          echo "::error::The stack did not start (exit code $status)."
          docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml logs --no-color || true
          exit "$status"
        fi
