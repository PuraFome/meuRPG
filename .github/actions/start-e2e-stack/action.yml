# Gets a runner ready to run Playwright against the local stack: Node, the e2e dependencies, Chromium, the images of
# build-e2e-images, and the stack itself (CockroachDB, migrations, devidp, API), as the `e2e` job of e2e.yml does.
name: Start the e2e stack
description: Install the e2e dependencies and Chromium, load the images and start the local stack.
inputs:
  code-dir:
    description: The checkout whose stack and tests run.
    default: "."
  artifact:
    description: The name of the artifact build-e2e-images uploaded.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.code-dir }}/.node-version
        cache: "npm"
        cache-dependency-path: ${{ inputs.code-dir }}/e2e/package-lock.json

    - name: Install the e2e dependencies (no install scripts)
      working-directory: ${{ inputs.code-dir }}/e2e
      shell: bash
      run: npm ci --ignore-scripts

    - name: Install Chromium for Playwright
      working-directory: ${{ inputs.code-dir }}/e2e
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Download the images
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/images

    - name: Load the images and start the stack
      working-directory: ${{ inputs.code-dir }}
      shell: bash
      env:
        IMAGES_DIR: ${{ runner.temp }}/images
      run: |
        docker load --input "$IMAGES_DIR/api.tar"
        docker load --input "$IMAGES_DIR/devidp.tar"
        docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml up --no-build --detach
