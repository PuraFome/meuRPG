# CI for the Go backend and the Protobuf/Connect contracts it is generated from.
#
# Every third-party action is pinned by full commit SHA (not by tag), because
# a moving tag can be repointed by whoever controls the action's repo. The
# `# vX.Y.Z` comment next to each SHA is just for humans; only the SHA is
# actually trusted by GitHub Actions.
name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "Makefile"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "Makefile"
      - ".github/workflows/backend.yml"

# Cancel a still-running run for the same branch/PR when a new commit lands,
# so we don't waste runners on outdated code.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo, it never pushes,
# comments, or touches packages/deployments.
permissions:
  contents: read

jobs:
  proto:
    name: proto (lint, breaking, generate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: needed so we can inspect origin/main's tree below,
          # to decide whether the breaking check has anything to compare against.
          fetch-depth: 0

      - name: Set up Go (buf generate shells out to Go tool plugins)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install buf
        # setup_only: install the pinned buf CLI and nothing else. The steps
        # below run lint, format and breaking explicitly, so each one shows
        # up as its own step in the logs.
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.73.0"
          setup_only: true

      - name: buf lint
        working-directory: proto
        run: buf lint

      - name: buf format check
        working-directory: proto
        run: buf format --diff --exit-code

      - name: Check whether origin/main already has a proto/ directory
        id: base_proto
        run: |
          # main doesn't have proto/ yet at the time this workflow was added.
          # `buf breaking` against a ref with no proto/ directory would just
          # fail with a confusing error, so we check explicitly and skip the
          # step (rather than swallowing the error) when there is nothing to
          # compare against yet.
          if git cat-file -e origin/main:proto 2>/dev/null; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi

      - name: buf breaking (against origin/main)
        if: steps.base_proto.outputs.has_proto == 'true'
        working-directory: proto
        run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'

      - name: Skip buf breaking (main has no proto/ yet)
        if: steps.base_proto.outputs.has_proto == 'false'
        run: |
          echo "Skipping buf breaking check: origin/main has no proto/ directory yet."

      - name: Download backend Go module dependencies
        working-directory: backend
        run: go mod download

      - name: Set up Node (buf generate's TypeScript plugin runs from web/node_modules)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (no install scripts)
        working-directory: web
        run: npm ci --ignore-scripts

      - name: buf generate
        working-directory: proto
        run: buf generate

      - name: Verify generated code is up to date
        run: |
          # sqlc regenerates the query code (backend/internal/*/*db), with
          # the version pinned in the Makefile.
          make sqlc
          # Catches both changes to tracked generated files and any brand
          # new generated file that wasn't committed: Go and TypeScript from
          # buf, Go from sqlc. Nothing else under backend/ changes in CI.
          git diff --exit-code -- backend web/src/gen
          if [ -n "$(git status --porcelain -- backend web/src/gen)" ]; then
            echo "::error::generated code is not committed. Run 'make proto sqlc' and commit the result." >&2
            git status --porcelain -- backend web/src/gen
            exit 1
          fi

  go:
    name: go (test, lint, vulncheck, docker build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go test -race
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

      - name: govulncheck
        # Invoked directly (rather than golang/govulncheck-action) so the
        # govulncheck version itself is pinned: the action installs
        # govulncheck@latest, which is a moving target.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build (no push, no registry login)
        # Context is the repo root (the image needs both backend/ and
        # web/), overriding this job's `backend` default working-directory.
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            -f backend/Dockerfile \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t meurpg-backend:ci \
            .

  go-db:
    name: go (integration tests against CockroachDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # The same image, pinned by the same digest, as deploy/local/compose.yaml.
      # Keep the two in sync.
      COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.7@sha256:9464ae30465b887295459b98d129a76d074caeaa4c86836d369c6d2fdddd1685
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Start CockroachDB (single node, insecure, in memory, CI only)
        # Not a service container: those cannot pass arguments to the image,
        # and CockroachDB needs `start-single-node`. Published on 127.0.0.1
        # only. The store lives in memory (the data is thrown away with the
        # runner anyway): schema changes, which the test databases are full
        # of, take a quarter of the time they take on disk. Background work
        # that only matters for a long-lived database (automatic statistics,
        # merging empty ranges, keeping finished jobs) is turned off, and a
        # dropped database gives its memory back after 10 minutes instead of
        # the default 4 hours.
        run: |
          docker run --detach --name cockroach --publish 127.0.0.1:26257:26257 \
            "$COCKROACH_IMAGE" start-single-node --insecure \
            --store=type=mem,size=4GiB --cache=512MiB --max-sql-memory=2GiB
          for _ in $(seq 1 60); do
            if docker exec cockroach cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' >/dev/null 2>&1; then
              docker exec cockroach cockroach sql --insecure --host=localhost:26257 \
                -e "SET CLUSTER SETTING sql.stats.automatic_collection.enabled = false" \
                -e "SET CLUSTER SETTING kv.range_merge.queue.enabled = false" \
                -e "SET CLUSTER SETTING jobs.retention_time = '15s'" \
                -e "SET CLUSTER SETTING diagnostics.reporting.enabled = false" \
                -e "ALTER RANGE default CONFIGURE ZONE USING gc.ttlseconds = 600"
              echo "CockroachDB is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::CockroachDB was not ready after 120 seconds." >&2
          docker logs cockroach >&2
          exit 1

      - name: go test -race (with the database)
        # With MEURPG_TEST_DATABASE_URL set, the integration tests
        # (migrations, stores, the 40001 retry, row TTL) run instead of
        # being skipped. Each test creates and drops its own database.
        # -timeout: each package gets 25 minutes, under the job's 30. Go's
        # default is 10 minutes per package, and the packages share one
        # CockroachDB, so the slowest (play, maps) took 7 to 10 minutes and
        # one more package's tests could push them over; the whole job took
        # 18 minutes on 04/10/2026, so the job now has room for Etapa 9.
        env:
          MEURPG_TEST_DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
        run: go test -race -timeout 25m ./...
