# CI for the Angular frontend (web/), served by the Go backend on the same
# origin (see docs/architecture/web.md#web-app).
#
# Every third-party action is pinned by full commit SHA (not by tag) so a
# moving tag can't silently change what runs in CI. The `# vX.Y.Z` comment
# is for humans only; GitHub Actions trusts the SHA.
name: web

on:
  # No paths filter: the `select` job chooses, so a train (refactor/train-*) always runs the full gate.
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "proto/error-reasons.json"
      - ".github/workflows/web.yml"
      - ".node-version"

# Only a pull request's runs cancel each other (a newer push makes the older
# run pointless). A push to main always runs to the end, so every merge
# leaves a complete signal instead of cancelling the previous merge's run.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Is this workflow selected (docs/ci.md, "What runs when"): a train, main, the schedule and a manual run always
  # run it; any other pull request only when it changes what it judges. On a fork only pull requests and manual runs.
  select:
    name: select (is this workflow selected)
    if: ${{ github.repository == 'PuraFome/meuRPG' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      # Only a pull request that is not a train is judged by its files, so only it needs the history and the diff.
      # Main, the schedule, a manual run and a train (a branch of this repository) are answered here, without a checkout.
      DIFF: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'refactor/train-') && github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      run: ${{ steps.all.outputs.run || steps.run.outputs.selected }}
    steps:
      - name: Everything is selected
        id: all
        if: env.DIFF != 'true'
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: env.DIFF == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the diff against the base branch needs it.
          fetch-depth: 0

      - name: Is this workflow selected
        id: run
        if: env.DIFF == 'true'
        uses: ./.github/actions/select
        with:
          pattern: '^(web/|proto/error-reasons\.json$|\.github/workflows/web\.yml$|\.node-version$)'

  web:
    needs: select
    if: ${{ needs.select.outputs.run == 'true' }}
    name: test and build
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # `npm ci --ignore-scripts` installs cleanly, and both `npm test` and
      # `npm run build` work with it, so CI never runs install scripts from
      # third-party packages.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # ESLint is a ratchet: eslint-suppressions.json lists the violations that
      # existed when it was introduced, so this step fails only on a NEW one.
      - name: Lint
        run: npm run lint

      # The complexity limits have no exceptions: no suppression and no inline
      # disable of `complexity` or `max-lines` (docs/ci.md, "Web and e2e linters").
      - name: No exception to complexity or max-lines
        run: |
          if jq -e '[.[] | keys[] | select(. == "complexity" or . == "max-lines")] | length > 0' eslint-suppressions.json >/dev/null; then
            echo "::error file=web/eslint-suppressions.json::complexity and max-lines cannot be suppressed: split the function or the file"
            exit 1
          fi
          if grep -rnE 'eslint-disable.*\b(complexity|max-lines)\b' src; then
            echo "::error::complexity and max-lines cannot be disabled inline: split the function or the file"
            exit 1
          fi

      # Prettier formats the TypeScript, SCSS and JSON (not the Angular
      # templates: see web/.prettierignore). `npm run format` fixes it.
      - name: Formatting (Prettier)
        run: npm run format:check

      # The layer rules (core, shared, pages, shell) and the import cycles, with a ratchet like the lint
      # (.dependency-cruiser-known-violations.json, empty today: any violation fails). About 4 s.
      - name: Import rules (dependency-cruiser)
        run: npm run depcruise

      # The verdict: the plain run, where the setup file (src/test-setup.ts)
      # resets the stubbed globals and the clock after every test.
      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The coverage run, in its own job so it can never cancel or skip the build
  # and runs in parallel with it (v8 instrumentation makes it slower than the
  # plain run, and it once ate the 15 minutes of "test and build"). It is
  # blocking: the floor (lines 89, statements 88, branches 84, functions 83,
  # today's numbers rounded down) is `coverageThresholds` in web/angular.json,
  # and the builder exits with an error under it. Raise the floor when the
  # numbers rise; never lower it to get green.
  coverage:
    needs: select
    if: ${{ needs.select.outputs.run == 'true' }}
    name: coverage
    timeout-minutes: 25
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # `npm ci --ignore-scripts` installs cleanly, and both `npm test` and
      # `npm run build` work with it, so CI never runs install scripts from
      # third-party packages.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # With --coverage the setup file (src/test-setup.ts) runs once per
      # worker, not once per spec file, so its own spec (test-setup.spec.ts) is
      # left out. Under the floor in angular.json the step fails.
      - name: Measure coverage (floor)
        run: npx ng test --watch=false --coverage --exclude src/test-setup.spec.ts

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/web/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/web/coverage-summary.json").total;
              const rows = ["lines", "statements", "functions", "branches"].map(
                (k) => "| " + k + " | " + t[k].pct + "% | " + t[k].covered + " / " + t[k].total + " |",
              );
              console.log(["### Web unit test coverage", "", "| | % | covered / total |", "| --- | --- | --- |"].concat(rows).join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 7
          if-no-files-found: ignore
