# CI for the Angular frontend (web/), served by the Go backend on the same
# origin (see docs/arquitetura.md#frontend-web).
#
# Every third-party action is pinned by full commit SHA (not by tag) so a
# moving tag can't silently change what runs in CI. The `# vX.Y.Z` comment
# is for humans only; GitHub Actions trusts the SHA.
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Verified locally on 2026-09-29: `npm ci --ignore-scripts` installs
      # cleanly and both `npm test` and `npm run build` still work with it,
      # so we never run install scripts from third-party packages in CI.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
