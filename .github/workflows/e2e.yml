# Acceptance tests: Playwright against the local stack (deploy/local/compose.yaml),
# which signs in through devidp, a development-only OpenID Connect provider,
# instead of Google. See CONTRIBUTING.md ("Testes ponta a ponta").
#
# Every third-party action is pinned by full commit SHA (not by tag), because
# a moving tag can be repointed by whoever controls the action's repo. The
# `# vX.Y.Z` comment is for humans; GitHub Actions trusts the SHA.
name: e2e

on:
  pull_request:
    # Everything that goes into the stack or the tests. Docs-only changes
    # (docs/, any .md file) do not run the e2e tests.
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "e2e/**"
      - "deploy/local/**"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - ".node-version"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "e2e/**"
      - "deploy/local/**"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - ".node-version"
      - "!**/*.md"

# Only a pull request's runs cancel each other (a newer push makes the older
# run pointless). A push to main always runs to the end, so every merge
# leaves a complete signal instead of cancelling the previous merge's run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read the repo, nothing else. Uploading an artifact needs
# no extra permission.
permissions:
  contents: read

jobs:
  # Lints the Playwright tests (a missing `await` is the classic flake) and
  # type-checks them, without Docker, so a mistake fails in about a minute
  # instead of after the images and shards. ESLint is a ratchet:
  # e2e/eslint-suppressions.json lists the old violations, so only a NEW one
  # fails. It has its own small package (e2e/lint) because ESLint's TypeScript
  # support needs TypeScript 5.x, while the tests type-check with TypeScript 7.
  lint:
    name: lint and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: |
            e2e/package-lock.json
            e2e/lint/package-lock.json

      - name: Install e2e dependencies (no install scripts)
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Install lint dependencies (no install scripts)
        working-directory: e2e
        run: npm run lint:install

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Lint
        working-directory: e2e
        run: npm run lint

  # Builds the two images once (the production image and devidp) and hands them
  # to the shards, which used to build them four times over (124 to 162 s each,
  # 07/10/2026). The layers are cached across runs in the GitHub Actions cache,
  # so a change that only touches Go or web code reuses the dependency layers.
  # It also fails fast on a broken Dockerfile, before any shard starts, and it
  # is the Dockerfile smoke test the backend workflow's go job used to do.
  image:
    name: images (production image and devidp)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the production image
        # VERSION=dev, as in compose.yaml: the app test reads it from the page.
        # The tar goes straight to disk (type=docker,dest=): no registry, no push.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: |
            VERSION=dev
            COMMIT=local
          tags: meurpg-ci/api:ci
          outputs: type=docker,dest=${{ runner.temp }}/api.tar
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the devidp image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/local/devidp.Dockerfile
          tags: meurpg-ci/devidp:ci
          outputs: type=docker,dest=${{ runner.temp }}/devidp.tar
          cache-from: type=gha,scope=devidp
          cache-to: type=gha,scope=devidp,mode=max

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-images
          path: |
            ${{ runner.temp }}/api.tar
            ${{ runner.temp }}/devidp.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    # The suite is split across six runners, each with its own stack: on
    # one runner the 171 tests took 13 minutes with 2 workers (04/10/2026).
    # Playwright splits a shard by test count, not time, and the axe scans
    # (@a11y) are the long ones: three plain shards took 522, 171 and 119
    # seconds. So the @a11y tests get four runners and the rest two: with
    # two, an @a11y shard took 19 minutes and set every PR's wait (07/10/2026).
    name: playwright ${{ matrix.part }} (local stack with devidp)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: a11y 1/4
            args: --grep @a11y --shard=1/4
          - part: a11y 2/4
            args: --grep @a11y --shard=2/4
          - part: a11y 3/4
            args: --grep @a11y --shard=3/4
          - part: a11y 4/4
            args: --grep @a11y --shard=4/4
          - part: 1/2
            args: --grep-invert @a11y --shard=1/2
          - part: 2/2
            args: --grep-invert @a11y --shard=2/2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies (no install scripts)
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Type-check the tests
        working-directory: e2e
        run: npm run typecheck

      - name: Install Chromium for Playwright
        # The browser build is the one this exact @playwright/test version
        # expects, so package-lock.json pins it too. --with-deps installs
        # the system libraries Chromium needs.
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-images
          path: ${{ runner.temp }}/images

      - name: Load the images
        env:
          IMAGES_DIR: ${{ runner.temp }}/images
        run: |
          docker load --input "$IMAGES_DIR/api.tar"
          docker load --input "$IMAGES_DIR/devidp.tar"

      - name: Start the local stack (CockroachDB, migrations, devidp, API)
        # compose.ci.yaml keeps CockroachDB's store in memory (CI only).
        # compose.ci-images.yaml points the services at the images loaded
        # above, and --no-build keeps compose from building them again.
        run: docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml up --no-build --detach

      - name: Check that the production image has no devidp
        # The api service runs the image the `image` job built from
        # backend/Dockerfile, the production image. devidp signs anyone in
        # without a password and must only ever exist in its own image (deploy/local/devidp.Dockerfile).
        # One runner checks it: they all run the same image.
        if: matrix.part == '1/2'
        run: |
          container=$(docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml ps --quiet api)
          files=$(docker cp "$container:/app" - | tar -t)
          if ! grep -qx 'app/api' <<<"$files"; then
            echo "::error::/app/api not found; this check no longer matches the image layout." >&2
            exit 1
          fi
          if grep -q 'devidp' <<<"$files"; then
            echo "::error::The production image contains devidp:" >&2
            grep 'devidp' <<<"$files" >&2
            exit 1
          fi
          echo "The production image has only:"
          grep -v '^app/web/.' <<<"$files"

      - name: Run the Playwright tests
        # CI=true makes the config use Playwright's Chromium instead of an
        # installed Google Chrome. The global setup waits for /readyz. Each
        # runner runs its part (matrix.args: a grep and a shard).
        working-directory: e2e
        env:
          PART_ARGS: ${{ matrix.args }}
        run: |
          # PART_ARGS holds several flags, so it is word-split on purpose.
          # shellcheck disable=SC2086
          npx playwright test $PART_ARGS

      - name: Show the stack logs
        if: failure()
        run: docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml logs --no-color

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
