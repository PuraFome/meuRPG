# Acceptance tests: Playwright against the local stack (deploy/local/compose.yaml),
# which signs in through devidp, a development-only OpenID Connect provider,
# instead of Google. See CONTRIBUTING.md ("Testes ponta a ponta").
#
# Every third-party action is pinned by full commit SHA (not by tag), because
# a moving tag can be repointed by whoever controls the action's repo. The
# `# vX.Y.Z` comment is for humans; GitHub Actions trusts the SHA.
name: e2e

on:
  pull_request:
    # Everything that goes into the stack or the tests. Docs-only changes
    # (docs/, any .md file) do not run the e2e tests.
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "e2e/**"
      - "deploy/local/**"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - ".github/scripts/e2e-no-retries.sh"
      - ".github/actions/**"
      - ".node-version"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "proto/**"
      - "web/**"
      - "e2e/**"
      - "deploy/local/**"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - ".github/scripts/e2e-no-retries.sh"
      - ".github/actions/**"
      - ".node-version"
      - "!**/*.md"
  # The nightly run and a manual run test everything, with no path filter
  # (03:00 in São Paulo).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Only a pull request's runs cancel each other (a newer push makes the older
# run pointless). A push to main always runs to the end, so every merge
# leaves a complete signal instead of cancelling the previous merge's run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read the repo, nothing else. Uploading an artifact needs
# no extra permission.
permissions:
  contents: read

jobs:
  # Chooses the Playwright shards. The plain shards always run. The slow
  # accessibility (@a11y) shards run on main, the nightly and manual runs, and
  # on a pull request only when it touches what they scan: the web app, the
  # tests or the stack. Other pull requests get the fast signal.
  plan:
    name: plan (which shards run)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the diff against the base branch needs it.
          fetch-depth: 0

      - name: Choose the shards
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          a11y=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            if grep -Eq '^(web/|e2e/|deploy/local/|\.github/workflows/e2e\.yml$|\.node-version$)' <<<"$changed"; then
              a11y=true
            else
              a11y=false
            fi
          fi
          matrix=$(jq -nc --argjson a11y "$a11y" '
            [range(1; 4) | {part: "\(.)/3", args: "--grep-invert @a11y --shard=\(.)/3"}]
            + (if $a11y then [range(1; 7) | {part: "a11y \(.)/6", args: "--grep @a11y --shard=\(.)/6"}] else [] end)
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # Lints the Playwright tests (a missing `await` is the classic flake) and
  # type-checks them, without Docker, so a mistake fails in about a minute
  # instead of after the images and shards. ESLint is a ratchet:
  # e2e/eslint-suppressions.json lists the old violations, so only a NEW one
  # fails. It has its own small package (e2e/lint) because ESLint's TypeScript
  # support needs TypeScript 5.x, while the tests type-check with TypeScript 7.
  lint:
    name: lint and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: |
            e2e/package-lock.json
            e2e/lint/package-lock.json

      - name: Install e2e dependencies (no install scripts)
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Install lint dependencies (no install scripts)
        working-directory: e2e
        run: npm run lint:install

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Lint
        working-directory: e2e
        run: npm run lint

      - name: Check that the tests are not retried
        # A retry hides a flaky test: the config keeps `retries: 0` (docs/ci.md, "Flaky tests").
        run: .github/scripts/e2e-no-retries.sh

  # Builds the two images once (the production image and devidp) and hands them
  # to the shards, which used to build them four times over (124 to 162 s each,
  # 07/10/2026). The layers are cached across runs in the GitHub Actions cache,
  # so a change that only touches Go or web code reuses the dependency layers.
  # It also fails fast on a broken Dockerfile, before any shard starts, and it
  # is the Dockerfile smoke test the backend workflow's go job used to do.
  image:
    name: images (production image and devidp)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub mirror, VERSION=dev, the tars straight to disk and the layer cache: all in the composite action,
      # shared with the workflows that test a ref of their own (flake-check, repeat-changed, nightly-hunt).
      - name: Build and upload the images
        uses: ./.github/actions/build-e2e-images
        with:
          artifact: e2e-images
          cache-write: "true"

  e2e:
    # The suite is split across nine runners, each with its own stack: on
    # one runner the 171 tests took 13 minutes with 2 workers (04/10/2026).
    # Playwright splits a shard by test count, not time, and the axe scans
    # (@a11y) are the long ones: three plain shards took 522, 171 and 119
    # seconds. So the @a11y tests get their own runners and the rest theirs:
    # with two @a11y runners, a shard took 19 minutes and set every PR's wait
    # (07/10/2026). On 10/10/2026 four @a11y shards took 7 to 13 minutes and
    # two plain shards 11 minutes each (2 to 3 of them setup), so now it is
    # six @a11y shards and three plain ones, aiming at 6 to 7 minutes of
    # tests in the slowest.
    name: playwright ${{ matrix.part }} (local stack with devidp)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [image, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node, the e2e dependencies (no install scripts), Chromium for the exact @playwright/test version the lockfile
      # pins, the images, and the local stack (compose.ci.yaml keeps CockroachDB in memory; compose.ci-images.yaml
      # points the services at the loaded images, --no-build).
      - name: Start the local stack (CockroachDB, migrations, devidp, API)
        uses: ./.github/actions/start-e2e-stack
        with:
          artifact: e2e-images
          npm-cache: npm

      - name: Type-check the tests
        working-directory: e2e
        run: npm run typecheck

      - name: Check that the production image has no devidp
        # The api service runs the image the `image` job built from
        # backend/Dockerfile, the production image. devidp signs anyone in
        # without a password and must only ever exist in its own image (deploy/local/devidp.Dockerfile).
        # One runner checks it: they all run the same image.
        if: matrix.part == '1/3'
        run: |
          container=$(docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml ps --quiet api)
          files=$(docker cp "$container:/app" - | tar -t)
          if ! grep -qx 'app/api' <<<"$files"; then
            echo "::error::/app/api not found; this check no longer matches the image layout." >&2
            exit 1
          fi
          if grep -q 'devidp' <<<"$files"; then
            echo "::error::The production image contains devidp:" >&2
            grep 'devidp' <<<"$files" >&2
            exit 1
          fi
          echo "The production image has only:"
          grep -v '^app/web/.' <<<"$files"

      - name: Run the Playwright tests
        # CI=true makes the config use Playwright's Chromium instead of an
        # installed Google Chrome. The global setup waits for /readyz. Each
        # runner runs its part (matrix.args: a grep and a shard).
        working-directory: e2e
        env:
          PART_ARGS: ${{ matrix.args }}
        run: |
          # PART_ARGS holds several flags, so it is word-split on purpose.
          # shellcheck disable=SC2086
          npx playwright test $PART_ARGS

      - name: Show the stack logs
        if: failure()
        run: docker compose -f deploy/local/compose.yaml -f deploy/local/compose.ci.yaml -f deploy/local/compose.ci-images.yaml logs --no-color

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Opens (or adds to) a GitHub issue when a run outside a pull request fails,
  # so a red main or nightly does not go unnoticed.
  report:
    name: report (issue when main is red)
    needs: [lint, image, plan, e2e]
    # Only the upstream repository has issues: a fork's red main (synced from upstream) has nowhere to report.
    if: ${{ always() && github.repository == 'PuraFome/meuRPG' && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'O workflow %s falhou na main.\n\nCommit: %s\nExecução: %s' "$WORKFLOW" "$SHA" "$RUN_URL")
          gh label create ci-red --force --color B60205 --description "CI vermelho na main" || true
          number=$(gh issue list --label ci-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label ci-red --title "CI vermelho: $WORKFLOW na main" --body "$body"
          fi
