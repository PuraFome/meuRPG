# CodeQL: GitHub's semantic code analysis (free for public repositories). It
# looks for security bugs that linters don't follow across functions: tainted
# input reaching SQL or file paths, unsafe redirects, injection into workflow
# `run:` steps. Findings go to the repository's Security tab ("Code scanning").
name: codeql

on:
  # No paths filter: the `select` job chooses, so a train (refactor/train-*) always runs the full gate.
  pull_request:
  push:
    branches: [main]
  # Weekly, so a new CodeQL query catches old code too.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Is this workflow selected (docs/ci.md, "What runs when"): a train, main, the schedule and a manual run always
  # run it; any other pull request only when it changes what it judges. On a fork only pull requests and manual runs.
  select:
    name: select (is this workflow selected)
    if: ${{ github.repository == 'PuraFome/meuRPG' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      # Only a pull request that is not a train is judged by its files, so only it needs the history and the diff.
      # Main, the schedule, a manual run and a train (a branch of this repository) are answered here, without a checkout.
      DIFF: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'refactor/train-') && github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      run: ${{ steps.all.outputs.run || steps.run.outputs.selected }}
    steps:
      - name: Everything is selected
        id: all
        if: env.DIFF != 'true'
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: env.DIFF == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the diff against the base branch needs it.
          fetch-depth: 0

      - name: Is this workflow selected
        id: run
        if: env.DIFF == 'true'
        uses: ./.github/actions/select
        with:
          pattern: '^(backend/|web/src/|e2e/|\.github/workflows/)'

  analyze:
    needs: select
    if: ${{ needs.select.outputs.run == 'true' }}
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go module lives in backend/: build it by hand so CodeQL sees
          # every package (generated code included, which it skips in alerts).
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-precision security queries on top of
          # the default set; the code-quality suite stays off (golangci-lint
          # and ESLint cover style).
          queries: security-extended

      - name: Build the Go module
        if: matrix.language == 'go'
        working-directory: backend
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
