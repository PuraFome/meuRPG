# The fork's merge queue (vfraga/meuRPG only; never in PuraFome/meuRPG): scratch-ms/rework/mergify/design-note.md.
# Mergify reads its configuration from the default branch, and only one configuration file may exist.
queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - -files ~= ^(\.claude/|\.mergify\.yml$)
    merge_conditions:
      - check-success = go (integration tests against CockroachDB)
      - check-success = go (coverage)
      - check-success = go (lint)
      - check-success = govulncheck (called vulnerabilities)
      - check-success = proto (lint, breaking, generate)
      - check-success = playwright (every shard passed)
      - check-success = playwright mobile (WebKit and iPhone)
      - check-success = test and build
      - check-success = lint and typecheck
      - check-success = coverage
      - check-success = CodeQL
      - check-success = osv-scanner (lockfiles)
      - check-success = actionlint and zizmor
      - check-success = tests of the CI scripts
    merge_method: squash
    queue_branch_prefix: refactor/train-mq-
    batch_size: 4
    batch_max_wait_time: 10 min
    max_checks_retries: 0
    batch_max_failure_resolution_attempts: 0
    checks_timeout: 60 min
merge_queue:
  max_parallel_checks: 1
  skip_intermediate_results: false
