# sqlc turns the SQL queries of each module into typed Go code.
# Run `make sqlc` from the repo root after changing a queries.sql file or a
# migration, and commit the generated code: CI regenerates it and fails on
# any difference. Docs: https://docs.sqlc.dev/en/v1.31.1/reference/config.html
#
# sqlc is pinned to v1.31.1 in the Makefile and in CI. The version is written
# into every generated file, so another version would show up as a diff.
#
# The schema is the goose migrations themselves (sqlc skips the Down parts),
# so there is no second copy of the schema to keep in sync. sqlc parses them
# as PostgreSQL, which means migrations must use syntax that both PostgreSQL
# and CockroachDB accept: no INDEX inside CREATE TABLE, for example (see
# migrations/migrations.go).
version: "2"

# Go types for database types, the same for every module.
overrides:
  go:
    overrides:
      # IDs are strings in Go, as in the .proto files and the rest of the
      # backend. Handlers check that an ID from a client is a UUID before it
      # reaches a query.
      - db_type: uuid
        go_type: string
      # A nullable UUID (characters.campaign_id, player_user_id,
      # master_user_id) becomes *string, like a nullable timestamptz becomes
      # *time.Time, instead of pgtype.UUID.
      - db_type: uuid
        nullable: true
        go_type:
          type: string
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true

sql:
  # One entry per module: its queries become a package next to its code.
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go: &go-options
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
        # A nullable column becomes a pointer (*string, *time.Time) instead
        # of a pgtype wrapper.
        emit_pointers_for_null_types: true
        # Only the structs that the module's queries use, so a module's
        # package does not get a struct for every table in the database.
        omit_unused_structs: true

  - engine: postgresql
    schema: migrations
    queries: internal/campaigns/queries.sql
    gen:
      go:
        <<: *go-options
        package: campaignsdb
        out: internal/campaigns/campaignsdb

  - engine: postgresql
    schema: migrations
    queries:
      - internal/characters/queries.sql
      - internal/characters/claims.sql
    gen:
      go:
        <<: *go-options
        package: charactersdb
        out: internal/characters/charactersdb

  - engine: postgresql
    schema: migrations
    queries:
      - internal/play/queries.sql
      - internal/play/queries_casting.sql
      - internal/play/combat_reserve.sql
    gen:
      go:
        <<: *go-options
        package: playdb
        out: internal/play/playdb

  - engine: postgresql
    schema: migrations
    queries: internal/maps/queries.sql
    gen:
      go:
        <<: *go-options
        package: mapsdb
        out: internal/maps/mapsdb

  - engine: postgresql
    schema: migrations
    queries: internal/progression/queries.sql
    gen:
      go:
        <<: *go-options
        package: progressiondb
        out: internal/progression/progressiondb

  - engine: postgresql
    schema: migrations
    queries: internal/notes/queries.sql
    gen:
      go:
        <<: *go-options
        package: notesdb
        out: internal/notes/notesdb

  - engine: postgresql
    schema: migrations
    queries: internal/campaignpackage/queries.sql
    gen:
      go:
        <<: *go-options
        package: packagedb
        out: internal/campaignpackage/packagedb
