# golangci-lint v2 configuration. Run from backend/: `golangci-lint run`.
# Docs: https://golangci-lint.run/docs/configuration/file/
version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose # HTTP response bodies must be closed (leaks connections)
    - errorlint # compare/unwrap errors with errors.Is/As, wrap with %w
    - gosec # common security mistakes
    - misspell # typos in comments and strings
    - nilerr # returning nil when an error was just checked
    - noctx # HTTP requests and SQL queries must carry a context
    - revive # style: naming, doc comments on exported identifiers
    - rowserrcheck # rows.Err() must be checked after iterating
    - sqlclosecheck # sql.Rows / sql.Stmt must be closed
    - unconvert # unnecessary type conversions
    - usestdlibvars # http.MethodGet instead of "GET", etc.
  settings:
    misspell:
      locale: US
      # "teatro da mente" is the combat mode's name in the API (ADR-0017): a
      # combat on a map is `grid`, a combat without one is `theatre`.
      ignore-rules:
        - theatre
    revive:
      rules:
        # The defaults, listed explicitly so they are easy to discover.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    # Code generated by buf (backend/gen) is not ours to fix.
    generated: strict
    paths:
      - ^gen/
    presets:
      - std-error-handling # e.g. unchecked errors from Close/Fprintln
      - common-false-positives

formatters:
  enable:
    - gofumpt # a stricter gofmt
    - goimports # groups imports: standard library, third party, this module
  settings:
    goimports:
      local-prefixes:
        - github.com/PuraFome/meuRPG/backend
  exclusions:
    generated: strict
    paths:
      - ^gen/
