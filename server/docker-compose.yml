services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    image: meu-rpg-backend:local
    container_name: meu-rpg-backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s